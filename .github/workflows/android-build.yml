name: Build Fingularity Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK and release AAB
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:bundleRelease
      - name: Upload tablet/emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: Fingularity-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Fingularity-Unsigned-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
