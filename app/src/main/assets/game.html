// Play celestial horn on first interaction with the welcome screen
function playWelcomeHorn(){
  if(hornPlayed)return;
  hornPlayed=true;
  initAudio();
  resumeAudio();   // covers iOS 'interrupted' as well as 'suspended'
  playCelestialHorn();
}
// Trigger horn on any first touch/click/mousemove on the welcome overlay
document.getElementById('screen-overlay').addEventListener('click',playWelcomeHorn,{once:false});
document.getElementById('screen-overlay').addEventListener('touchstart',playWelcomeHorn,{once:false});
document.getElementById('screen-overlay').addEventListener('mouseenter',function once(){playWelcomeHorn();this.removeEventListener('mouseenter',once);});

// ─── iOS LIFECYCLE ───
// A phone call, a notification pull-down, or a swipe to the home screen must
// not silently run the timer down while the player can't see the screen.
function pauseForBackground(){
  if(PAUSABLE.indexOf(state)>=0)togglePause();
  if(musicScheduler){clearInterval(musicScheduler);musicScheduler=null;}
  if(audioCtx&&audioCtx.state==='running')audioCtx.suspend().catch(()=>{});
}
function resumeFromForeground(){
  lastTime=performance.now();   // don't hand the loop a giant dt
  // Not resumed here on purpose — iOS refuses outside a user gesture, so the
  // unpause tap does it instead.
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)pauseForBackground(); else resumeFromForeground();
});
window.addEventListener('pagehide',pauseForBackground);
window.addEventListener('blur',pauseForBackground);
window.addEventListener('focus',resumeFromForeground);

// Tapping anywhere unpauses — a phone has no spacebar.
function resumeIfPaused(e){
  if(state!==STATE.PAUSED)return;
  if(e.target.closest('#mute-btn'))return;      // mute still works while paused
  if(e.target.closest('#menu-btn'))return;      // the pause button owns its own toggle
  if(e.target.closest('.pause-btn'))return;     // let the menu buttons handle themselves
  e.preventDefault();
  togglePause();
}

// Pause menu actions.
document.getElementById('pause-actions').addEventListener('click',e=>{
  const b=e.target.closest('[data-pause]');
  if(!b)return;
  e.stopPropagation();
  const a=b.dataset.pause;
  if(a==='resume'){togglePause();return;}
  if(a==='restart'){
    document.getElementById('pause-overlay').classList.remove('show');
    prePauseState=null;
    score=0;                       // the level restarts, so its points do too
    levelRetries++;
    startLevel(currentLevel);
    return;
  }
  if(a==='menu')quitToMenu();
});

document.getElementById('menu-btn').addEventListener('click',e=>{
  e.stopPropagation();
  // Toggles both ways. Previously it only paused: tapping it again resumed via
  // the window handler and then re-paused on this click, so the button looked
  // dead while paused.
  if(PAUSABLE.indexOf(state)>=0||state===STATE.PAUSED)togglePause();
});

/// Abandons the run and returns to the title. The level reached is already
/// saved, so Continue will still offer it.
function quitToMenu(){
  restoreStartScreen();
  document.getElementById('pause-overlay').classList.remove('show');
  // Also covers quitting mid-tutorial, which would otherwise leave its panel
  // floating over the menu.
  const to=document.getElementById('tutorial-overlay');
  if(to)to.classList.add('hidden');
  document.body.classList.remove('tutorial');
  tut=null;
  document.body.classList.remove('playing');
  prePauseState=null;
  state=STATE.MENU;
  stopAmbient();stopAllBHDrones();stopMusic();
  blackHoles=[];particles=[];swipeTrails=[];scorePopups=[];
  angels=[];demons=[];shots=[];voyager=null;
  if(boss){stopBossDrone();boss=null;}
  pointers.clear();
  if(!audioMuted)rampMaster(0.5,0.2);
  document.getElementById('screen-overlay').classList.remove('hidden');
  if(typeof paintBestLine==='function')paintBestLine();
  if(typeof paintStartButtons==='function')paintStartButtons();
  if(typeof paintMenuUnlock==='function')paintMenuUnlock();
}
// Listen on the window in the capture phase so this works no matter what the
// overlay's pointer-events happen to be.
window.addEventListener('touchend',resumeIfPaused,{passive:false,capture:true});
window.addEventListener('mouseup',resumeIfPaused,true);
document.getElementById('pause-overlay').addEventListener('click',resumeIfPaused);

// iOS Safari rotates before it reports the new size; settle then re-measure.
window.addEventListener('orientationchange',()=>{setTimeout(()=>{resize();initStars();generateNebula();},350);});

// In a native shell, hide any off-site web links.
const IS_NATIVE=!!(window.Capacitor||window.nativeIAP||
  (window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.iap));
if(IS_NATIVE){
  // The app has no "back to the website" — hide every off-site link. Apple
  // also flags links out to a web store or portal during review.
  document.querySelectorAll('#tsi-back-btn,#ts-back,a[href^="http"]')
    .forEach(el=>el.remove());
  document.body.classList.add('native');
}

setUnlocked(isUnlocked());
captureStartScreen();
initStars();generateNebula();lastTime=performance.now();
requestAnimationFrame(gameLoop);
</script>
