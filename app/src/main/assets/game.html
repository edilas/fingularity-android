// ─── NEBULA ───
let nebulaCanvas,nebulaCtx;
// ─── PROCEDURAL NEBULA ───
// Six flat radial blobs read as stage lighting. Real nebulae have filament
// structure, which comes from domain warping: sampling a noise field at
// coordinates that have themselves been displaced by another noise field.
//
// Baked once per level into an offscreen canvas at 1/3 resolution and scaled
// up. Nebulae are low-frequency, so the interpolation costs nothing visually
// and the bake stays under ~20ms.

function nHash(x,y,seed){
  let h=(x*374761393+y*668265263+seed*1442695041)|0;
  h=(h^(h>>13))*1274126177|0;
  return ((h^(h>>16))>>>0)/4294967295;
}
function nValue(x,y,seed){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);   // smoothstep
  const a=nHash(xi,yi,seed),     b=nHash(xi+1,yi,seed);
  const c=nHash(xi,yi+1,seed),   d=nHash(xi+1,yi+1,seed);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function nFbm(x,y,seed,oct){
  let sum=0, amp=0.5, f=1, norm=0;
  for(let i=0;i<oct;i++){
    sum+=amp*nValue(x*f,y*f,seed+i*77);
    norm+=amp; amp*=0.5; f*=2;
  }
  return sum/norm;
}

// Cold indigo through teal into rose filaments — an emission-nebula palette
// rather than the flat purple/blue of before.
const NEBULA_RAMP=[
  [0.00,  12, 10, 32],
  [0.28,  34, 26, 82],
  [0.48,  58, 46,142],
  [0.64,  78,108,196],
  [0.78, 148,110,206],
  [0.90, 214,132,186],
  [1.00, 255,206,218],
];
function nebulaColor(d){
  for(let i=1;i<NEBULA_RAMP.length;i++){
    if(d<=NEBULA_RAMP[i][0]||i===NEBULA_RAMP.length-1){
      const a=NEBULA_RAMP[i-1], b=NEBULA_RAMP[i];
      const t=Math.max(0,Math.min(1,(d-a[0])/(b[0]-a[0]||1)));
      return [a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t, a[3]+(b[3]-a[3])*t];
    }
  }
  return [0,0,0];
}

function generateNebula(){
  nebulaCanvas=document.createElement('canvas');
  nebulaCanvas.width=W; nebulaCanvas.height=H;
  // alpha:false lets the compositor treat the blit as opaque.
  nebulaCtx=nebulaCanvas.getContext('2d',{alpha:false});
  nebulaCtx.fillStyle='#030308';
  nebulaCtx.fillRect(0,0,W,H);

  const SCALE=3;
  const w=Math.max(2,Math.ceil(W/SCALE)), h=Math.max(2,Math.ceil(H/SCALE));
  const small=document.createElement('canvas');
  small.width=w; small.height=h;
  const sctx=small.getContext('2d');
  const img=sctx.createImageData(w,h);
  const px=img.data;

  const seed=Math.floor(Math.random()*10000);
  const freq=4.6/Math.max(w,h);
  const warp=2.9;

  // Averaging octaves pulls value noise tightly around 0.5, so the raw field
  // only spans about a quarter of 0..1. Build it first, then stretch it to the
  // full range — without this everything crushes to black.
  const field=new Float32Array(w*h);
  let lo=Infinity, hi=-Infinity;

  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const fx=x*freq, fy=y*freq;
      // Displace the sample point by a second noise field. This is what turns
      // smooth blobs into drawn-out filaments and cavities.
      const wx=nFbm(fx+5.2, fy+1.3, seed+11, 3)-0.5;
      const wy=nFbm(fx+9.7, fy+2.8, seed+29, 3)-0.5;
      const sx=fx+warp*wx, sy=fy+warp*wy;

      const base=nFbm(sx, sy, seed, 5);
      // Ridged noise: folding the field at its midpoint turns smooth humps into
      // creases, which is what reads as gas filament rather than fog.
      const ridge=1-Math.abs(2*nFbm(sx*1.9+3.1, sy*1.9+7.4, seed+53, 4)-1);
      const v=base*0.70+ridge*0.30;

      field[y*w+x]=v;
      if(v<lo)lo=v; if(v>hi)hi=v;
    }
  }

  const span=(hi-lo)||1;
  for(let i=0;i<field.length;i++){
    let d=(field[i]-lo)/span;                     // now genuinely spans 0..1
    d=Math.pow(Math.max(0,(d-0.30)/0.70), 1.45);  // mostly empty space, few bright regions
    const [r,g,b]=nebulaColor(d);
    const o=i*4;
    px[o]=r; px[o+1]=g; px[o+2]=b;
    px[o+3]=Math.min(255, d*225);
  }

  sctx.putImageData(img,0,0);

  nebulaCtx.imageSmoothingEnabled=true;
  nebulaCtx.imageSmoothingQuality='high';
  nebulaCtx.globalAlpha=0.72;   // backdrop, must never compete with the board
  nebulaCtx.drawImage(small,0,0,W,H);

  // A couple of soft emission cores for depth.
  nebulaCtx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const cx=Math.random()*W, cy=Math.random()*H, cr=Math.min(W,H)*(0.35+Math.random()*0.3);
    const g=nebulaCtx.createRadialGradient(cx,cy,0,cx,cy,cr);
    const tint=[[70,30,120],[20,70,110],[120,40,90]][i%3];
    g.addColorStop(0,`rgba(${tint[0]},${tint[1]},${tint[2]},0.20)`);
    g.addColorStop(0.45,`rgba(${tint[0]},${tint[1]},${tint[2]},0.08)`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    nebulaCtx.fillStyle=g; nebulaCtx.fillRect(0,0,W,H);
  }
  nebulaCtx.globalCompositeOperation='source-over';
  nebulaCtx.globalAlpha=1;
}

// ─── CELESTIALS ───
const CEL_TYPES=[
  {name:'asteroid',minR:8,maxR:18,bonus:5},
  {name:'planet',minR:20,maxR:40,bonus:25},
  {name:'sun',minR:30,maxR:50,bonus:50},
  {name:'spaceship',minR:10,maxR:16,bonus:15},
  {name:'nebula_cloud',minR:35,maxR:60,bonus:35},
  {name:'comet',minR:8,maxR:14,bonus:10},
  {name:'space_station',minR:18,maxR:28,bonus:30},
  {name:'dwarf_star',minR:14,maxR:22,bonus:20},
];

// Floating score popups
let scorePopups=[];
function addScorePopup(x,y,pts,color){
  scorePopups.push({x,y,pts,color:color||'rgba(255,200,50,1)',life:1,vy:-60});
}
function updateScorePopups(dt){
  for(let i=scorePopups.length-1;i>=0;i--){
    const p=scorePopups[i]; p.y+=p.vy*dt; p.life-=dt*0.8;
    if(p.life<=0)scorePopups.splice(i,1);
  }
}
function drawScorePopups(){
  for(const p of scorePopups){
    ctx.save();
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    ctx.font=p.isText?'bold 12px Orbitron, monospace':'bold 16px Orbitron, monospace';
    ctx.textAlign='center';
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;
    ctx.shadowBlur=8;
    ctx.fillText(p.isText?p.pts:`+${p.pts}`,p.x,p.y);
    ctx.restore();
  }
}

function spawnCelestial(){
  const type=CEL_TYPES[Math.floor(Math.random()*CEL_TYPES.length)];
  const r=type.minR+Math.random()*(type.maxR-type.minR);
  const side=Math.floor(Math.random()*4);
  let x,y,vx,vy; const speed=15+Math.random()*30;
  if(side===0){x=-r;y=Math.random()*H;vx=speed;vy=(Math.random()-0.5)*speed*0.5;}
  else if(side===1){x=W+r;y=Math.random()*H;vx=-speed;vy=(Math.random()-0.5)*speed*0.5;}
  else if(side===2){x=Math.random()*W;y=-r;vx=(Math.random()-0.5)*speed*0.5;vy=speed;}
  else{x=Math.random()*W;y=H+r;vx=(Math.random()-0.5)*speed*0.5;vy=-speed;}
  celestials.push({x,y,r,vx,vy,type:type.name,rotation:Math.random()*Math.PI*2,
    rotSpeed:(Math.random()-0.5)*2,beingSucked:null,suckProgress:0,opacity:1,
    rings:type.name==='planet'&&Math.random()>0.5,tailAngle:Math.atan2(vy,vx),phase:Math.random()*Math.PI*2});
}

// ════════════════════════════════════════════════════
// ─── THE CELESTIAL WAR (levels 11+)
// Black holes keep coming on the same curve. On top of that, demons hunt
// angels: kill the demons for points, or watch them cost you.
// ════════════════════════════════════════════════════
// ─── VOYADUR 1 RULES ───
// One ruleset. Losing VoyaDur 1 costs the round's x2 bonus; on boss levels it
// is the objective and losing it fails the level.
// (Hard mode was removed — the curve escalates on its own.)

// VoyaDur 1 takes the same three hits an angel does.
const VOYAGER_MAX_HP=3;

const WAR_START_LEVEL=11;
function isWarRealm(){return currentLevel>=WAR_START_LEVEL;}

// Paid levels alternate in blocks of two: 11-12 celestial, 13-14 fleet, and so
// on. Blocks rather than every level, so a theme lasts long enough to settle.
// The paid campaign runs in five-level cycles: two celestial, two fleet, then
// a convergence. Deriving the theme from position in the cycle keeps the pairs
// intact — the earlier every-other-two rule drifted once convergence levels
// started consuming slots.
function cyclePos(level){
  const L=(level===undefined?currentLevel:level);
  return (L-WAR_START_LEVEL)%5;
}
function warTheme(level){
  if(isBossLevel(level)){
    return bossKind(level)==='archdemon'||bossKind(level)==='nullsovereign'?'celestial':'fleet';
  }
  return cyclePos(level)<2 ? 'celestial' : 'fleet';
}
function isFleet(){return warTheme()==='fleet';}

// A full faction cycle is four levels (two celestial, two fleet). Convergence
// closes it, so it lands every fifth level: 15, 20, 25... Every 10 would put
// the first one at 20, which most players would never reach.
function isConvergence(level){
  // Convergence is now the Devourer's fight: every faction dragged into one
  // maw. Regular convergence levels gave their slot to the boss rotation.
  return isBossLevel(level)&&bossKind(level)==='devourer';
}

// Wording follows the theme so nothing reads as the wrong faction.

const WAR_WORDS={
  celestial:{ally:'Angel', allyPlural:'Angels', foe:'Demon',
             lost:'ANGEL LOST', banner:'The Celestial War begins \u2014 defend the angels'},
  fleet:    {ally:'Ship',  allyPlural:'Fleet',  foe:'Raider',
             lost:'SHIP DOWN',  banner:'Raiders inbound \u2014 defend the fleet'},
};
function warWords(){return WAR_WORDS[warTheme()];}

let angels=[], demons=[];
let shots=[];
let boss=null;

// Level 10 stays the free campaign's finale with its cutscene. The paid
// campaign runs in five-level chapters — two celestial, two fleet, one boss —
// so the first boss is at 15, inside the range most buyers actually reach.
const BOSS_FIRST_LEVEL=15;
const FINAL_BOSS_LEVEL=40;
function isFinalBoss(level){return (level===undefined?currentLevel:level)===FINAL_BOSS_LEVEL;}
// Level 10 closes the free campaign with a Devourer of its own — a demo of the
// thing the unlock is selling. It's the gentler variant: five shells, no escort,
// and surviving the clock counts as a win, so nobody is walled out of the
// cutscene or the offer.
const FREE_BOSS_LEVEL=FREE_MAX_LEVEL;
function isFreeBoss(level){
  return (level===undefined?currentLevel:level)===FREE_BOSS_LEVEL;
}
function isBossLevel(level){
  const L=(level===undefined?currentLevel:level);
  if(L===FREE_BOSS_LEVEL)return true;
  return L>=BOSS_FIRST_LEVEL && (L-WAR_START_LEVEL)%5===4;
}

// Each shell escalates, but every visible arm only has to be severed once.
// Requiring more severs than there are arms leaves the boss with no targets
// while the player waits for regrowth, which reads as an invulnerability bug.
const BOSS_SHELLS=[
  {arms:4, hits:5, need:4, regrow:9.0, pull:1.00},
  {arms:5, hits:6, need:5, regrow:7.0, pull:1.30},
  {arms:6, hits:6, need:6, regrow:6.5, pull:1.65},
];
// The free-campaign Devourer: five escalating shells, four visible arms per
// shell, and a softer pull than the paid fight. Five shells makes the finale
// feel like a real boss without blocking newcomers: surviving the clock still
// completes Level 10.
const FREE_BOSS_SHELLS=[
  {arms:4, hits:4, need:4, regrow:11.0, pull:0.80},
  {arms:4, hits:5, need:4, regrow:9.0,  pull:0.92},
  {arms:4, hits:5, need:4, regrow:8.0,  pull:1.02},
  {arms:4, hits:6, need:4, regrow:7.2,  pull:1.12},
  {arms:4, hits:6, need:4, regrow:6.5,  pull:1.22},
];
const BOSS_ARMS=4;   // opening count; each shell rebuilds the ring
const BOSS_NAMES=['The Devourer','The Devourer Reborn','The Elder Maw','The Last Mouth'];
function bossName(level){
  const k=bossKind(level), t=bossTier(level);
  if(k==='nullsovereign')return 'The Null Sovereign';
  const pool=k==='archdemon'?ARCHDEMON_NAMES:k==='dreadnought'?DREADNOUGHT_NAMES:BOSS_NAMES;
  return pool[t%pool.length];
}

function spawnDevourer(){
  const U=unit();
  const free=isFreeBoss();
  boss={
    kind:'devourer', free,
    x:W/2, y:H*0.42,
    r:U*0.20, maxR:U*0.34,
    core:U*0.20,
    rotation:0,
    phase:0,
    arms:[],
    shell:0, severs:0,
    basePull:U*(free?0.42:0.55),
    pull:U*0.55,        // how hard it drags everything inward
    spawnTimer:0,
    stun:0,
    shockTimer:6,
    hurt:0,
    dying:0,
    drift:{x:(Math.random()-0.5)*U*0.02, y:(Math.random()-0.5)*U*0.015},
  };
  bodySparkHints=0; bodySparkCd=0;
  buildShell(0);
  startBossDrone();
}

function armsAlive(){return boss?boss.arms.filter(a=>a.alive).length:0;}
function bossShellSet(){return (boss&&boss.free)?FREE_BOSS_SHELLS:BOSS_SHELLS;}
function shellCfg(){const A=bossShellSet();return A[Math.min(boss.shell,A.length-1)];}
function seversLeft(){return boss?Math.max(0,shellCfg().need-boss.severs):0;}

function buildShell(n){
  boss.shell=n; boss.severs=0;
  const A=bossShellSet();
  const c=A[Math.min(n,A.length-1)];
  boss.pull=boss.basePull*c.pull;
  boss.arms=[];
  for(let i=0;i<c.arms;i++){
    boss.arms.push({
      angle:(i/c.arms)*Math.PI*2,
      hits:0, need:c.hits,
      // Replacement arms arrive fully formed and hittable. A shell transition
      // should never create a hidden no-damage window.
      alive:true, regrow:0, len:1,
    });
  }
}

function breakShell(){
  screenFlash=0.8;
  const pts=1200*currentLevel*(boss.shell+1);
  score+=pts;
  addScorePopup(boss.x,boss.y,pts,'rgba(255,240,160,1)');
  scorePopups.push({x:boss.x,y:boss.y-boss.r-46,
    pts:`SHELL ${boss.shell+1} BROKEN`,color:'rgba(255,230,140,1)',life:2,vy:-30,isText:true});
  emitParticles(boss.x,boss.y,'rgba(255,220,140,1)',50,320);
  if(window.nativeHaptic)window.nativeHaptic('levelComplete');
  // Five free shells used to compound the original three-shell shrink four
  // times, leaving shell 5 much smaller than the hit geometry was designed
  // for. Keep the late free shells readable; their difficulty comes from arm
  // durability, regrowth and pull strength, not a microscopic target.
  const coreFloor=unit()*(boss.free?0.13:0.10);
  boss.core=Math.max(boss.core*0.86,coreFloor);
  boss.r=boss.core;                 // hit and draw geometry agree immediately
  if(boss.shell>=bossShellSet().length-1){
    announceBossDefeated();
    boss.dying=2.2;
    return;
  }
  boss.stun=1.6;                 // brief opening before the next shell hardens
  buildShell(boss.shell+1);
  setBossDronePitch(boss.shell);
}

/// Phase is driven by surviving arms: the fewer left, the more desperate it gets.
function bossPhase(){return boss?Math.min(2,boss.shell):0;}

/// A shockwave every few seconds. Gives the fight a rhythm the player has to
/// work around instead of standing still and sawing.
function bossShockwave(){
  const U=unit();
  boss.shockR=0;
  boss.shockMax=U*0.75;
  emitParticles(boss.x,boss.y,'rgba(255,140,60,1)',26,150);
  playSwipeHit(boss.x);
}

function updateShockwave(dt){
  if(boss.shockR===undefined)return;
  boss.shockR+=unit()*0.85*dt;
  const hitBand=unit()*0.06;
  const check=(o,dmg)=>{
    if(!o)return;
    const d=Math.hypot(o.x-boss.x,o.y-boss.y);
    if(Math.abs(d-boss.shockR)<hitBand&&!o._shocked){
      o._shocked=true;
      dmg(o);
    }
  };
  for(const a of angels)if(a.alive)check(a,o=>{o.hp--;o.hurt=1;if(o.hp<=0)killAngel(o);});
  // The wave shoves VoyaDur 1 outward rather than hurting it — damage it can't
  // dodge made the level a coin flip. Riding the wave clear is the counterplay.
  if(voyager&&voyager.alive&&!voyager.wormhole)check(voyager,v=>{
    const dx=v.x-boss.x, dy=v.y-boss.y, d=Math.hypot(dx,dy)||1;
    v.vx=(dx/d)*220; v.vy=(dy/d)*220;
    v.beingSucked=null; v.suckProgress=0; v.opacity=1;
  });
  if(boss.shockR>boss.shockMax){
    boss.shockR=undefined;
    for(const a of angels)a._shocked=false;
    if(voyager)voyager._shocked=false;
  }
}

function severArm(arm){
  arm.alive=false; arm.hits=0; arm.regrow=shellCfg().regrow;
  boss.severs++;
  const pts=Math.floor(unit()*0.8)+currentLevel*20;
  score+=pts;
  addScorePopup(boss.x,boss.y-boss.r-20,pts,'rgba(255,220,120,1)');
  emitParticles(boss.x+Math.cos(arm.angle)*boss.r*1.6,
                boss.y+Math.sin(arm.angle)*boss.r*1.6,
                'rgba(255,200,100,1)',34,240);
  playPopSound(boss.x);
  if(window.nativeHaptic)window.nativeHaptic('destroy');
  boss.hurt=1;
  // Each severed arm weakens the pull and shrinks the core.
  // Weakens only until the arm grows back — the shell counter is the real
  // progress, so a slow player loses time rather than everything.
  boss.pull*=0.88;
  if(boss.severs>=shellCfg().need)breakShell();
}

function updateDevourer(dt){
  boss.phase+=dt;
  if(bodySparkCd>0)bodySparkCd-=dt;
  for(const a of boss.arms)if(a.flash>0)a.flash=Math.max(0,a.flash-dt*3);
  boss.rotation+=dt*(0.35+bossPhase()*0.16);   // shell 3 used to spin the arms away faster than you could track
  if(boss.hurt>0)boss.hurt=Math.max(0,boss.hurt-dt*1.6);

  if(boss.dying>0){
    boss.dying-=dt;
    boss.core*=1-dt*0.9;
    if(Math.random()<0.4)
      emitParticles(boss.x+(Math.random()-0.5)*boss.r,
                    boss.y+(Math.random()-0.5)*boss.r,
                    'rgba(255,220,140,1)',6,180);
    if(boss.dying<=0){
      stopBossDrone();
      screenFlash=1;
      emitParticles(boss.x,boss.y,'rgba(255,255,220,1)',70,420);
      const pts=2000*currentLevel;
      score+=pts;
      addScorePopup(boss.x,boss.y,pts,'rgba(255,255,150,1)');
      boss=null;
      completeLevel();
    }
    return;
  }

  // Slow wander, clamped to a band that keeps the arms and label on screen.
  boss.r=boss.core;
  boss.x+=boss.drift.x*dt*60; boss.y+=boss.drift.y*dt*60;
  const mx=boss.r*2.7, myTop=Math.max(boss.r*2.9,H*0.26), myBot=H*0.62;
  if(boss.x<mx){boss.x=mx;boss.drift.x=Math.abs(boss.drift.x);}
  if(boss.x>W-mx){boss.x=W-mx;boss.drift.x=-Math.abs(boss.drift.x);}
  if(boss.y<myTop){boss.y=myTop;boss.drift.y=Math.abs(boss.drift.y);}
  if(boss.y>myBot){boss.y=myBot;boss.drift.y=-Math.abs(boss.drift.y);}

  // Arms regrow, so severing all four is a race rather than attrition.
  for(const a of boss.arms){
    a.angle+=dt*0.18;
    if(!a.alive){
      a.regrow-=dt;
      a.len=Math.max(0,1-a.regrow/shellCfg().regrow);
      if(a.regrow<=0){a.alive=true;a.len=1;a.hits=0;boss.pull/=0.88;}
    }else if(a.len<1){a.len=Math.min(1,a.len+dt*0.7);}
  }

  // Gravity well: drags everything toward the mouth.
  const pull=boss.pull*(1+bossPhase()*0.45);
  const drag=(o,mul)=>{
    if(!o)return;
    const dx=boss.x-o.x, dy=boss.y-o.y, d=Math.hypot(dx,dy)||1;
    const f=pull*mul/Math.max(d,boss.r);
    o.vx=(o.vx||0)+(dx/d)*f*dt;
    o.vy=(o.vy||0)+(dy/d)*f*dt;
  };
  for(const a of angels)if(a.alive)drag(a,1);
  for(const d of demons)if(d.dying<=0)drag(d,0.7);
  if(voyager&&voyager.alive&&!voyager.wormhole){
    drag(voyager,1.3);
    if(Math.hypot(voyager.x-boss.x,voyager.y-boss.y)<boss.r*0.85)damageVoyager(boss);
  }
  for(const cel of celestials)drag(cel,0.5);

  // Keeps spawning pressure, so the player can't just farm the arms.
  if(boss.stun>0){boss.stun-=dt;}

  // Shockwaves start after the first shell, and come faster as it degrades.
  if(boss.shell>=1&&boss.stun<=0){
    boss.shockTimer-=dt;
    if(boss.shockTimer<=0){boss.shockTimer=[9,6.5,5][bossPhase()];bossShockwave();}
  }
  updateShockwave(dt);

  boss.spawnTimer+=dt;
  const every=[5.5,4.2,3.4][bossPhase()];
  if(boss.spawnTimer>=every){
    boss.spawnTimer=0;
    if(bossPhase()<2&&blackHoles.length<LV.cap)spawnBlackHole();
    if(isWarRealm()&&demons.length<warCounts().demonCap)spawnDemon();
  }
}

/// Swipes only count on the arms. The body does nothing, which is the whole
/// mechanic — the player has to look for the weak point rather than scrub.
function devourerSwipe(pos,last){
  const U=unit();
  // Band was r*1.15 to r*2.5. The core shrinks with every shell, so by shell 3
  // the hittable ring had shrunk with it and swipes kept landing just outside.
  const inner=boss.r*0.95, outer=Math.max(boss.r*3.0, unit()*0.34);
  const moved=Math.hypot(pos.x-last.x,pos.y-last.y);
  if(moved<20)return false;

  const hitArm=(a,p)=>{
    a.hits++;
    a.flash=1;                       // the arm itself flashes, not just sparks
    emitParticles(p.x,p.y,'rgba(0,255,200,1)',12,140);
    playSwipeHit(p.x);
    if(window.nativeHaptic)window.nativeHaptic('swipe');
    if(a.hits>=a.need)severArm(a);
    return true;
  };

  // Test the actual three curved strands that are painted for each arm. The
  // old angular wedge was forgiving on shells 1–3, but shell 5's smaller core
  // could leave a visibly crossed strand outside the sampled wedge after one
  // or two hits. A touch now damages whatever visible strand it crosses.
  for(const a of boss.arms){
    if(!a.alive||a.len<0.6)continue;
    const ang=a.angle+boss.rotation;
    const cos=Math.cos(ang), sin=Math.sin(ang);
    const R=boss.r, reach=R*(1.15+1.25*a.len);
    const strokePad=Math.max(12,U*0.04);
    for(let k=0;k<3;k++){
      const spread=(0.16+k*0.10)*(k%2?1:-1);
      for(let j=0;j<=12;j++){
        const q=j/12, inv=1-q;
        const lx=inv*inv*(R*1.02)+2*inv*q*(reach*0.66)+q*q*reach;
        const ly=2*inv*q*(reach*spread);
        const target={x:boss.x+lx*cos-ly*sin,y:boss.y+lx*sin+ly*cos};
        if(pointToSwipeDistance(target,last,pos)<=strokePad)return hitArm(a,target);
      }
    }
  }

  // Widen the arc as arms multiply — six arms in a smaller ring were a
  // harder target than four in a big one.
  const tol=Math.max(0.42, (Math.PI*2/boss.arms.length)*0.62);

  // Pointer events report samples, not the continuous path between them. The
  // old test looked only at `pos`, so a quick swipe could visibly cross an arm
  // and still miss when its final sample landed outside the (smaller) next
  // shell. Walk the whole segment at short intervals instead.
  const samples=Math.max(1,Math.ceil(moved/Math.max(8,U*0.025)));
  let bodyPoint=null;
  for(let i=0;i<=samples;i++){
    const t=i/samples;
    const p={x:last.x+(pos.x-last.x)*t, y:last.y+(pos.y-last.y)*t};
    const d=Math.hypot(p.x-boss.x,p.y-boss.y);
    if(d>outer)continue;
    if(d<inner){bodyPoint=p;continue;}

    const ang=Math.atan2(p.y-boss.y,p.x-boss.x);
    for(const a of boss.arms){
      if(!a.alive||a.len<0.6)continue;
      const diff=Math.abs(((ang-(a.angle+boss.rotation))+Math.PI*3)%(Math.PI*2)-Math.PI);
      if(diff<tol)return hitArm(a,p);
    }
  }
  if(bodyPoint){
    // Swiping the mouth itself: say so, rather than eating the swipe silently.
    bossBodySpark(bodyPoint);
    return true;
  }
  return false;
}

/// Feedback for a swipe that hit the boss but not an arm. The first few times,
/// it says why nothing happened.
let bodySparkHints=0, bodySparkCd=0;
function bossBodySpark(pos){
  emitParticles(pos.x,pos.y,'rgba(180,190,210,0.9)',5,70);
  if(bodySparkCd>0||bodySparkHints>=3)return;
  bodySparkCd=2.5; bodySparkHints++;
  scorePopups.push({x:boss.x,y:boss.y-boss.r*1.6,pts:'CUT THE ARMS',
    color:'rgba(255,200,120,0.95)',life:1.6,vy:-26,isText:true});
}

function drawDevourer(t){
  const b=boss, ph=bossPhase();
  const R=b.r;
  ctx.save();
  if(b.dying>0)ctx.globalAlpha=Math.max(0,Math.min(1,b.dying/2.2));

  // Outer well
  const g=ctx.createRadialGradient(b.x,b.y,R*0.6,b.x,b.y,R*3.4);
  g.addColorStop(0,`rgba(255,${90-ph*30},40,${0.20+b.hurt*0.2})`);
  g.addColorStop(0.4,'rgba(180,40,110,0.11)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,R*3.4,0,Math.PI*2);ctx.fill();

  // Feeding arms
  for(const a of b.arms){
    if(a.len<=0.02)continue;
    const ang=a.angle+b.rotation;
    const reach=R*(1.15+1.25*a.len);
    const dmg=a.hits/a.need;
    ctx.save();
    ctx.translate(b.x,b.y);ctx.rotate(ang);
    for(let k=0;k<3;k++){
      const spread=0.16+k*0.10;
      ctx.beginPath();
      ctx.moveTo(R*1.02,0);
      ctx.quadraticCurveTo(reach*0.66, reach*spread*(k%2?1:-1), reach, 0);
      const fl=a.flash||0;
      ctx.strokeStyle=a.alive
        ? (fl>0
            ? `rgba(255,${230-dmg*40},${180-dmg*60},${(0.95-k*0.16)*a.len})`
            : `rgba(255,${175-dmg*110},${70-dmg*40},${(0.8-k*0.16)*a.len})`)
        : `rgba(120,60,90,${0.25*a.len})`;
      ctx.lineWidth=(8-k*1.8)*a.len*(1+fl*0.35);
      ctx.lineCap='round';
      ctx.stroke();
    }
    // Damage pips at the arm tip
    if(a.alive&&a.hits>0){
      // A damage ring at the arm tip — the same language the black holes use,
      // and far easier to read than a column of small dots while it spins.
      ctx.beginPath();
      ctx.arc(reach+12,0,7.5,-Math.PI/2,-Math.PI/2+Math.PI*2*(a.hits/a.need));
      ctx.strokeStyle='rgba(0,255,200,0.95)';ctx.lineWidth=3;ctx.lineCap='butt';ctx.stroke();
      ctx.beginPath();
      ctx.arc(reach+12,0,7.5,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=3;ctx.stroke();
    }
    ctx.restore();
  }

  // Shockwave
  if(b.shockR!==undefined){
    ctx.beginPath();ctx.arc(b.x,b.y,b.shockR,0,Math.PI*2);
    const fade=1-b.shockR/b.shockMax;
    ctx.strokeStyle=`rgba(255,140,60,${0.65*fade})`;
    ctx.lineWidth=6*fade+1.5;ctx.stroke();
    ctx.beginPath();ctx.arc(b.x,b.y,b.shockR,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,230,180,${0.4*fade})`;ctx.lineWidth=1.5;ctx.stroke();
  }

  // Mouth
  const rim=ctx.createRadialGradient(b.x,b.y,R*0.72,b.x,b.y,R*1.1);
  rim.addColorStop(0,'rgba(0,0,0,1)');
  rim.addColorStop(0.82,'rgba(20,4,14,1)');
  rim.addColorStop(1,`rgba(255,${150-ph*45},70,${0.55+0.3*Math.sin(t*3)})`);
  ctx.fillStyle=rim;ctx.beginPath();ctx.arc(b.x,b.y,R*1.1,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(b.x,b.y,R,0,Math.PI*2);
  ctx.fillStyle='#000';ctx.fill();

  if(b.hurt>0){
    ctx.beginPath();ctx.arc(b.x,b.y,R*1.25,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,220,140,${b.hurt*0.8})`;ctx.lineWidth=4;ctx.stroke();
  }
  ctx.restore();

  // Arm counter, the only boss UI
  ctx.save();
  ctx.globalAlpha=0.85;
  ctx.font="700 11px Orbitron, monospace";
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,200,120,0.75)';
  const labelAbove=b.y-R*2.0>66;
  const ly=labelAbove?b.y-R*2.0:b.y+R*2.2;
  ctx.fillText(`${bossName(currentLevel).toUpperCase()}  \u2022  SHELL ${b.shell+1} / ${bossShellSet().length}`,
               b.x, ly);
  // Severs remaining on this shell — the real progress bar.
  const need=shellCfg().need;
  for(let i=0;i<need;i++){
    ctx.beginPath();
    ctx.arc(b.x-(need-1)*6+i*12, ly+13, 3.4, 0, Math.PI*2);
    ctx.fillStyle=i<b.severs?'rgba(0,255,200,0.95)':'rgba(255,255,255,0.20)';
    ctx.fill();
  }
  ctx.restore();
}

// ════════════════════════════════════════════════════
// ─── BOSS ROTATION
// Every fifth paid level is a boss: 15, 20, 25, then the cycle repeats harder.
//   Archdemon   — kill it before its hellfire burns down the angels
//   Dreadnought — kill it before its guns and main cannon gut the fleet
//   Devourer    — sever its arms before time runs out; VoyaDur 1 must live
// Reorder BOSS_ROTATION to change which boss comes first.
// ════════════════════════════════════════════════════
const BOSS_ROTATION=['archdemon','dreadnought','devourer'];
const ARCHDEMON_NAMES=['The Archdemon','The Archdemon Returns','The Crowned Fiend','The Last Seraph-Eater'];
const DREADNOUGHT_NAMES=['The Dreadnought','Dreadnought Mk II','The Black Armada','The Final Keel'];
function bossIndex(level){
  const L=(level===undefined?currentLevel:level);
  return Math.max(0,Math.floor((L-BOSS_FIRST_LEVEL)/5));
}
function bossKind(level){
  if(isFinalBoss(level))return 'nullsovereign';
  if(isFreeBoss(level))return 'devourer';
  return BOSS_ROTATION[bossIndex(level)%BOSS_ROTATION.length];
}
/// How many times this boss has come round before. Each return is tougher.
function bossTier(level){
  if(isFreeBoss(level))return 0;
  return Math.floor(bossIndex(level)/BOSS_ROTATION.length);
}
function bossTimeoutReason(){
  const k=boss?boss.kind:bossKind();
  if(k==='nullsovereign')return 'The Null Sovereign erased this timeline';
  if(k==='archdemon')return 'The Archdemon outlasted you';
  if(k==='dreadnought')return 'The Dreadnought escaped';
  return 'The Devourer could not be broken in time';
}
/// Allies still standing on a protect-them boss level.
function alliesAlive(){return angels.filter(a=>a.alive).length;}

function spawnBoss(){
  const kind=bossKind();
  if(kind==='nullsovereign')return spawnNullSovereign();
  if(kind==='archdemon')return spawnArchdemon();
  if(kind==='dreadnought')return spawnDreadnought();
  spawnDevourer();
}
function updateBoss(dt){
  if(!boss)return;
  if(boss.kind==='nullsovereign')return updateNullSovereign(dt);
  if(boss.kind==='archdemon')return updateArchdemon(dt);
  if(boss.kind==='dreadnought')return updateDreadnought(dt);
  updateDevourer(dt);
}
function bossSwipe(pos,last){
  if(!boss||boss.dying>0)return false;
  if(Math.hypot(pos.x-last.x,pos.y-last.y)<20)return false;
  if(boss.kind==='nullsovereign')return nullSovereignSwipe(pos,last);
  if(boss.kind==='archdemon')return archdemonSwipe(pos);
  if(boss.kind==='dreadnought')return dreadnoughtSwipe(pos);
  return devourerSwipe(pos,last);
}
function drawBoss(t){
  if(!boss)return;
  if(boss.kind==='nullsovereign')return drawNullSovereign(t);
  if(boss.kind==='archdemon')return drawArchdemon(t);
  if(boss.kind==='dreadnought')return drawDreadnought(t);
  drawDevourer(t);
}

// ════════════════════════════════════════════════════
// ─── LEVEL 40: THE NULL SOVEREIGN
// The first narrative ending. Three mechanics, one continuous fight:
//   1. Shatter Past / Present / Future anchors around the Celestial Shell.
//   2. Swipe across the three timeline fractures to stitch them closed while
//      echoes of the earlier bosses fire into the united fleet.
//   3. Break the event-horizon shields, then strike the exposed singularity.
// ════════════════════════════════════════════════════
const NULL_ANCHOR_HP=18;
const NULL_THREAD_HP=8;
const NULL_SHIELD_HP=8;
const NULL_CORE_HP=48;
const NULL_BOSS_ART=['null-sovereign-phase1.png','null-sovereign-phase2.png','null-sovereign-phase3.png'].map((src,i)=>{
  const preloaded=document.getElementById(`null-art-${i+1}`);
  const img=preloaded&&preloaded.tagName==='IMG'?preloaded:new Image();
  if(!img.src)img.src=src;
  return img;
});

function spawnNullSovereign(){
  const U=unit();
  boss={
    kind:'nullsovereign',tier:0,x:W/2,y:-U*0.55,homeY:H*0.235,r:U*0.155,
    stage:0,stun:2.4,hurt:0,dying:0,t:0,attackT:2.15,pulse:0,phaseFlash:0,
    volleyCount:0,riftSpin:0,phaseGuide:0,coreGuide:0,plateBreaks:0,
    anchors:[
      {name:'PAST',angle:Math.PI*0.85,hp:NULL_ANCHOR_HP,maxHp:NULL_ANCHOR_HP,alive:true,color:'255,170,55'},
      {name:'PRESENT',angle:-Math.PI*0.50,hp:NULL_ANCHOR_HP,maxHp:NULL_ANCHOR_HP,alive:true,color:'255,235,175'},
      {name:'FUTURE',angle:Math.PI*0.15,hp:NULL_ANCHOR_HP,maxHp:NULL_ANCHOR_HP,alive:true,color:'90,220,255'},
    ],
    threads:[
      {x:0.24,hp:NULL_THREAD_HP,maxHp:NULL_THREAD_HP,joined:false,color:'255,170,55'},
      {x:0.50,hp:NULL_THREAD_HP,maxHp:NULL_THREAD_HP,joined:false,color:'210,120,255'},
      {x:0.76,hp:NULL_THREAD_HP,maxHp:NULL_THREAD_HP,joined:false,color:'90,220,255'},
    ],
    shields:[0,1,2].map(i=>({angle:-Math.PI/2+i*Math.PI*2/3,hp:NULL_SHIELD_HP,maxHp:NULL_SHIELD_HP,alive:true})),
    coreHp:NULL_CORE_HP,coreMax:NULL_CORE_HP,coreOpen:false,
  };
  startBossDrone();
  setBossDronePitch(0);
}

function nullAnchorPos(a){
  const side=Math.min(W*0.31,unit()*0.33);
  if(a.name==='PAST')return {x:boss.x-side,y:boss.y+boss.r*0.78};
  if(a.name==='FUTURE')return {x:boss.x+side,y:boss.y+boss.r*0.78};
  return {x:boss.x,y:boss.y+boss.r*1.72};
}
function nullThreadBreak(th){
  return {x:W*th.x,y:H*0.49};
}
function nullShieldPos(sh){
  const rr=boss.r*2.0;
  const a=sh.angle+Math.sin(boss.t*0.7+sh.angle)*0.055;
  return {x:boss.x+Math.cos(a)*rr,y:boss.y+Math.sin(a)*rr};
}

function nullPhaseProgress(){
  if(!boss||boss.kind!=='nullsovereign')return 0;
  if(boss.stage===0){
    const left=boss.anchors.reduce((n,a)=>n+Math.max(0,a.hp),0);
    return left/(NULL_ANCHOR_HP*3);
  }
  if(boss.stage===1){
    const left=boss.threads.reduce((n,th)=>n+Math.max(0,th.hp),0);
    return left/(NULL_THREAD_HP*3);
  }
  if(!boss.coreOpen){
    const left=boss.shields.reduce((n,s)=>n+Math.max(0,s.hp),0);
    return left/(NULL_SHIELD_HP*3);
  }
  return Math.max(0,boss.coreHp)/boss.coreMax;
}

function nullObjective(){
  if(!boss||boss.kind!=='nullsovereign')return '';
  if(boss.stage===0)return 'SHATTER THE THREE ANCHORS';
  if(boss.stage===1)return 'RECONNECT SPACETIME';
  return boss.coreOpen?'CORE EXPOSED — SWIPE THE BLACK HOLE':'SWIPE THE 3 CRACKED PLATES';
}

function nullAdvancePhase(){
  const b=boss;
  b.stage++;
  b.stun=1.6;b.attackT=2.2;b.phaseFlash=1;screenFlash=0.75;
  shots=[];demons=[];
  emitParticles(b.x,b.y,'rgba(255,220,150,1)',65,360);
  if(b.stage===1){
    score+=3000*currentLevel;
    scorePopups.push({x:b.x,y:b.y+b.r*2.4,pts:'THE CONTINUUM FRACTURES',
      color:'rgba(210,150,255,1)',life:2.5,vy:-24,isText:true});
    setBossDronePitch(2.2);
    spawnDemon({kind:'celestial'});spawnDemon({kind:'fleet'});
  }else{
    b.stun=4.2;b.attackT=4.4;b.phaseGuide=4.0;
    score+=5000*currentLevel;
    scorePopups.push({x:b.x,y:b.y+b.r*2.5,pts:'BREAK 3 PLATES — THEN SWIPE THE CORE',
      color:'rgba(255,235,170,1)',life:2.5,vy:-24,isText:true});
    setBossDronePitch(4.0);
    spawnDemon({kind:'celestial'});spawnDemon({kind:'fleet'});spawnDemon({kind:'void'});
  }
  if(window.nativeHaptic)window.nativeHaptic('levelComplete');
}

function nullHitAnchor(a,x,y){
  if(!a.alive||boss.stun>0)return false;
  a.hp--;boss.hurt=1;score+=30+currentLevel*5;bossHitFx(x,y);
  if(a.hp<=0){
    a.alive=false;screenFlash=0.35;
    emitParticles(x,y,`rgba(${a.color},1)`,38,250);
    scorePopups.push({x,y:y-22,pts:`${a.name} ANCHOR SHATTERED`,
      color:`rgba(${a.color},1)`,life:1.8,vy:-24,isText:true});
    if(boss.anchors.every(v=>!v.alive))nullAdvancePhase();
  }
  return true;
}

function nullStitchThread(th,x,y){
  if(th.joined||boss.stun>0)return false;
  th.hp--;boss.hurt=1;score+=50+currentLevel*6;bossHitFx(x,y);
  if(th.hp<=0){
    th.joined=true;
    emitParticles(x,y,`rgba(${th.color},1)`,44,230);
    scorePopups.push({x,y:y-20,pts:'TIMELINE RESTORED',
      color:`rgba(${th.color},1)`,life:1.8,vy:-24,isText:true});
    if(boss.threads.every(v=>v.joined))nullAdvancePhase();
  }
  return true;
}

function nullHitShield(sh,x,y){
  if(!sh.alive||boss.stun>0)return false;
  sh.hp--;boss.hurt=1;score+=45+currentLevel*6;bossHitFx(x,y);
  if(sh.hp<=0){
    sh.alive=false;boss.plateBreaks++;screenFlash=0.4;
    emitParticles(x,y,'rgba(255,120,220,1)',45,280);
    scorePopups.push({x,y:y-24,pts:`PLATE ${boss.plateBreaks} / 3 SHATTERED`,
      color:'rgba(255,190,235,1)',life:1.8,vy:-24,isText:true});
    if(boss.shields.every(v=>!v.alive)){
      boss.coreOpen=true;boss.stun=2.6;boss.attackT=3.0;boss.coreGuide=2.8;
      scorePopups.push({x:boss.x,y:boss.y+boss.r*2.2,pts:'CORE EXPOSED — SWIPE CENTER',
        color:'rgba(255,235,175,1)',life:2.2,vy:-24,isText:true});
      screenFlash=0.8;
    }
  }
  return true;
}

function nullHitCore(x,y){
  const b=boss;
  if(!b.coreOpen||b.stun>0||b.dying>0)return false;
  b.coreHp--;b.hurt=1;score+=80+currentLevel*8;bossHitFx(x,y);
  if(b.coreHp<=0){
    announceBossDefeated();
    b.dying=4.2;b.attackT=999;shots=[];demons=[];screenFlash=1;
  }
  return true;
}

function nullSovereignSwipe(pos,last){
  const b=boss,U=unit();
  if(b.stage===0){
    for(const a of b.anchors){
      if(!a.alive)continue;
      const p=nullAnchorPos(a);
      if(pointToSwipeDistance(p,last,pos)<U*0.075)return nullHitAnchor(a,p.x,p.y);
    }
    // The shell is armour, not a hidden hitbox.
    if(pointToSwipeDistance(b,last,pos)<b.r*1.2){
      emitParticles(pos.x,pos.y,'rgba(255,210,150,1)',4,60);return true;
    }
  }else if(b.stage===1){
    for(const th of b.threads){
      if(th.joined)continue;
      const p=nullThreadBreak(th);
      if(pointToSwipeDistance(p,last,pos)<U*0.07)return nullStitchThread(th,p.x,p.y);
    }
  }else{
    if(!b.coreOpen){
      for(const sh of b.shields){
        if(!sh.alive)continue;
        const p=nullShieldPos(sh);
        if(pointToSwipeDistance(p,last,pos)<U*0.14)return nullHitShield(sh,p.x,p.y);
      }
    }else if(pointToSwipeDistance(b,last,pos)<b.r*1.15){
      return nullHitCore(b.x,b.y);
    }
  }
  return false;
}

function nullVolley(){
  const living=angels.filter(a=>a.alive);
  if(!living.length&&(!voyager||!voyager.alive))return;
  const b=boss;
  const origins=b.stage===1
    ?[{x:W*0.14,y:H*0.18},{x:W*0.5,y:H*0.16},{x:W*0.86,y:H*0.18}]
    :[{x:b.x-b.r*0.75,y:b.y},{x:b.x+b.r*0.75,y:b.y}];
  const count=b.stage===0?2:(b.stage===1?4:6);
  b.volleyCount++;
  for(let i=0;i<count;i++){
    const o=origins[(i+Math.floor(b.t))%origins.length];
    o.r=unit()*0.025;o.kind=i%2?'fleet':'celestial';
    const target=(voyager&&voyager.alive&&i===count-1&&b.volleyCount%2===0)
      ?voyager:living[Math.floor(Math.random()*living.length)];
    if(target)fireShot(o,target,false);
  }
  b.pulse=1;
  if(b.stage>0&&b.volleyCount%2===0){
    const cap=b.stage===1?2:3;
    if(demons.length<cap)spawnDemon({kind:b.stage===1?'celestial':'void'});
  }
}

function updateNullSovereign(dt){
  const b=boss;
  b.t+=dt;
  if(b.hurt>0)b.hurt=Math.max(0,b.hurt-dt*3);
  if(b.phaseFlash>0)b.phaseFlash=Math.max(0,b.phaseFlash-dt*1.5);
  if(b.pulse>0)b.pulse=Math.max(0,b.pulse-dt*1.8);
  if(b.phaseGuide>0)b.phaseGuide=Math.max(0,b.phaseGuide-dt);
  if(b.coreGuide>0)b.coreGuide=Math.max(0,b.coreGuide-dt);
  if(b.dying>0){
    b.dying-=dt;b.r*=1-dt*0.16;
    if(Math.random()<0.7)emitParticles(b.x+(Math.random()-0.5)*b.r*3,
      b.y+(Math.random()-0.5)*b.r*3,'rgba(255,220,170,1)',7,260);
    if(b.dying<=0){
      const x=b.x,y=b.y;
      stopBossDrone();screenFlash=1;
      emitParticles(x,y,'rgba(255,255,230,1)',120,520);
      score+=10000*currentLevel;
      boss=null;
      finishNullSovereign();
    }
    return;
  }
  if(b.stun>0)b.stun-=dt;
  b.y+=(b.homeY-b.y)*Math.min(1,dt*0.9);
  b.x=W/2+Math.sin(b.t*0.22)*W*0.035;
  b.riftSpin+=dt*(b.stage===2?0.42:0.16);
  // Phase-three plates hover in the same crown/left/right formation as the
  // painted form; a small breathing wobble keeps them alive without hiding targets.
  herdAlliesBelow(H*0.54,dt);

  b.attackT-=dt;
  if(b.attackT<=0&&b.stun<=0){
    const progress=nullPhaseProgress();
    const base=b.stage===0?2.15:(b.stage===1?1.60:1.12);
    b.attackT=Math.max(0.72,base-(1-progress)*0.28);
    nullVolley();
  }
  if(alliesAlive()===0){endGame('The united defenders were erased');return;}
  if(!voyager||!voyager.alive){endGame('VoyaDur 1 could not carry the final signal');return;}
}

function drawNullCrown(t,alpha){
  const b=boss,R=b.r;
  ctx.save();ctx.globalAlpha=alpha===undefined?1:alpha;
  ctx.translate(b.x,b.y-R*1.28);
  ctx.strokeStyle='rgba(255,205,100,0.92)';ctx.lineWidth=Math.max(1.5,R*0.035);
  ctx.shadowColor='rgba(255,170,60,0.9)';ctx.shadowBlur=12;
  ctx.beginPath();
  for(let i=-3;i<=3;i++){
    const x=i*R*0.30,tip=-R*(0.34+0.22*(1-Math.abs(i)/4));
    if(i===-3)ctx.moveTo(x,R*0.12);
    ctx.lineTo(x,tip);ctx.lineTo(x+R*0.15,R*0.12);
  }
  ctx.stroke();ctx.restore();
}

function drawNullAnchor(a,t){
  if(!a.alive)return;
  const p=nullAnchorPos(a),R=unit()*0.066,pulse=0.75+0.25*Math.sin(t*4+a.angle*3);
  ctx.save();ctx.translate(p.x,p.y);
  const aura=ctx.createRadialGradient(0,0,1,0,0,R*1.55);
  aura.addColorStop(0,'rgba(255,255,240,1)');aura.addColorStop(0.12,`rgba(${a.color},1)`);
  aura.addColorStop(0.48,`rgba(${a.color},0.34)`);aura.addColorStop(1,`rgba(${a.color},0)`);
  ctx.fillStyle=aura;ctx.beginPath();ctx.arc(0,0,R*1.55,0,Math.PI*2);ctx.fill();
  ctx.rotate(t*0.35+a.angle);
  ctx.strokeStyle=`rgba(${a.color},${0.72+0.2*pulse})`;ctx.lineWidth=2.2;
  ctx.shadowColor=`rgba(${a.color},0.85)`;ctx.shadowBlur=14;
  ctx.beginPath();ctx.ellipse(0,0,R*1.35,R*0.48,0,0,Math.PI*2);ctx.stroke();
  ctx.rotate(-t*0.72);
  ctx.beginPath();ctx.ellipse(0,0,R*1.08,R*0.36,Math.PI/2,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,R*0.42,0,Math.PI*2);ctx.fillStyle='rgba(255,255,245,0.95)';ctx.fill();
  ctx.beginPath();ctx.moveTo(-R*0.82,0);ctx.lineTo(R*0.82,0);ctx.moveTo(0,-R*0.82);ctx.lineTo(0,R*0.82);ctx.stroke();ctx.restore();
  ctx.save();ctx.textAlign='center';ctx.font='700 8px Orbitron, monospace';
  ctx.fillStyle=`rgba(${a.color},0.82)`;ctx.fillText(a.name,p.x,p.y+R*1.55);
  ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(p.x-R,p.y+R*1.72,R*2,3);
  ctx.fillStyle=`rgba(${a.color},0.9)`;ctx.fillRect(p.x-R,p.y+R*1.72,R*2*(a.hp/a.maxHp),3);ctx.restore();
}

function drawNullRegalia(t){
  const b=boss,R=b.r;
  ctx.save();

  // A broken chronal halo makes the Sovereign read at a glance, even on a phone.
  ctx.translate(b.x,b.y);
  ctx.rotate(-t*0.045);
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6, gap=0.055+(i%3)*0.018;
    ctx.beginPath();ctx.arc(0,0,R*2.28,a+gap,a+Math.PI/6-gap);
    ctx.strokeStyle=`rgba(${i%3===0?'255,205,105':i%3===1?'170,90,255':'80,210,255'},${0.42+(i%2)*0.12})`;
    ctx.lineWidth=R*(i%3===0?0.105:0.055);
    ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=12;ctx.stroke();
  }
  ctx.rotate(t*0.11+b.riftSpin);
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4,inner=R*1.78,outer=R*(2.05+(i%2)*0.22);
    ctx.beginPath();ctx.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);
    ctx.lineTo(Math.cos(a)*outer,Math.sin(a)*outer);
    ctx.strokeStyle='rgba(255,235,175,0.55)';ctx.lineWidth=1.5;ctx.stroke();
  }
  ctx.restore();

  if(b.stage<2){
    // Vast mantle and giant star-forged claws, matching the phase artwork.
    const cloak=ctx.createLinearGradient(b.x,b.y-R,b.x,b.y+R*3.5);
    cloak.addColorStop(0,'rgba(72,22,108,0.90)');
    cloak.addColorStop(0.45,'rgba(22,8,55,0.82)');
    cloak.addColorStop(1,'rgba(2,2,14,0)');
    ctx.fillStyle=cloak;ctx.beginPath();
    ctx.moveTo(b.x-R*1.55,b.y-R*0.15);
    ctx.bezierCurveTo(b.x-R*2.25,b.y+R*0.7,b.x-R*2.35,b.y+R*2.2,b.x-R*1.25,b.y+R*3.45);
    ctx.quadraticCurveTo(b.x,b.y+R*2.7,b.x+R*1.25,b.y+R*3.45);
    ctx.bezierCurveTo(b.x+R*2.35,b.y+R*2.2,b.x+R*2.25,b.y+R*0.7,b.x+R*1.55,b.y-R*0.15);
    ctx.closePath();ctx.fill();

    for(const side of [-1,1]){
      const sx=b.x+side*R*1.48,sy=b.y+R*0.08;
      const sg=ctx.createRadialGradient(sx,sy,2,sx,sy,R*0.76);
      sg.addColorStop(0,'rgba(255,245,205,0.92)');
      sg.addColorStop(0.13,side<0?'rgba(255,125,55,0.9)':'rgba(80,210,255,0.9)');
      sg.addColorStop(0.5,'rgba(100,45,175,0.65)');sg.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,R*0.82,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,220,160,0.58)';ctx.lineWidth=R*0.10;
      ctx.beginPath();ctx.arc(sx,sy,R*0.68,t*side,t*side+Math.PI*1.45);ctx.stroke();
    }

    ctx.lineCap='round';
    for(const side of [-1,1]){
      const col=side<0?'255,145,65':'85,205,255',wave=Math.sin(t*1.25+side)*R*0.12;
      ctx.beginPath();ctx.moveTo(b.x+side*R*1.05,b.y+R*0.38);
      ctx.bezierCurveTo(b.x+side*R*1.72,b.y+R*0.55+wave,b.x+side*R*2.25,b.y+R*1.25,b.x+side*R*2.52,b.y+R*1.62);
      ctx.strokeStyle=`rgba(${col},0.72)`;ctx.lineWidth=R*0.38;
      ctx.shadowColor=`rgba(${col},0.9)`;ctx.shadowBlur=14;ctx.stroke();
      // Armored palm.
      const px=b.x+side*R*2.48,py=b.y+R*1.68;
      ctx.save();ctx.translate(px,py);ctx.scale(side,1);
      ctx.fillStyle='rgba(18,8,36,0.94)';ctx.strokeStyle=`rgba(${col},0.86)`;ctx.lineWidth=R*0.06;
      ctx.beginPath();ctx.ellipse(0,0,R*0.52,R*0.66,-0.32,0,Math.PI*2);ctx.fill();ctx.stroke();
      // Five articulated claws curl around the battlefield.
      for(let f=0;f<5;f++){
        const fy=(f-2)*R*0.22;
        ctx.beginPath();ctx.moveTo(-R*0.05,fy);
        ctx.quadraticCurveTo(R*(0.48+f*0.035),fy+R*0.08,R*(0.72+f*0.025),fy+R*(0.18+Math.abs(f-2)*0.045));
        ctx.strokeStyle=`rgba(${col},${0.92-f*0.06})`;ctx.lineWidth=R*(0.14-f*0.012);ctx.stroke();
        ctx.beginPath();ctx.moveTo(R*(0.66+f*0.025),fy+R*(0.16+Math.abs(f-2)*0.045));
        ctx.lineTo(R*(0.93+f*0.02),fy+R*(0.05+Math.abs(f-2)*0.03));
        ctx.strokeStyle='rgba(255,225,175,0.9)';ctx.lineWidth=R*0.07;ctx.stroke();
      }
      ctx.restore();
    }
  }else{
    // Final form: the body collapses into a violent, multi-plane accretion engine.
    for(let i=0;i<7;i++){
      ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.riftSpin*(i%2?1:-1)+i*0.42);
      ctx.scale(1,0.34+i*0.035);
      ctx.beginPath();ctx.arc(0,0,R*(1.55+i*0.22),0,Math.PI*2);
      ctx.strokeStyle=`rgba(${i%3===0?'255,220,145':i%3===1?'205,80,255':'75,215,255'},${0.58-i*0.052})`;
      ctx.lineWidth=R*(0.18-i*0.012);ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=12;ctx.stroke();ctx.restore();
    }
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5+t*(i%2?0.15:-0.12),len=R*(2.2+(i%3)*0.35);
      ctx.beginPath();ctx.moveTo(b.x+Math.cos(a)*R,b.y+Math.sin(a)*R);
      ctx.quadraticCurveTo(b.x+Math.cos(a+0.45)*len*0.72,b.y+Math.sin(a+0.45)*len*0.72,
        b.x+Math.cos(a)*len,b.y+Math.sin(a)*len);
      ctx.strokeStyle=`rgba(${i%2?'190,80,255':'255,185,80'},0.36)`;ctx.lineWidth=2;ctx.stroke();
    }
  }
  ctx.restore();
}

function drawNullVisage(t){
  const b=boss,R=b.r;
  if(b.stage===2)return;
  ctx.save();ctx.translate(b.x,b.y);
  // Faceless armor with a living vertical time scar.
  const mask=ctx.createLinearGradient(0,-R,0,R);
  mask.addColorStop(0,'rgba(230,205,255,0.50)');mask.addColorStop(0.45,'rgba(70,35,110,0.38)');mask.addColorStop(1,'rgba(12,5,30,0)');
  ctx.fillStyle=mask;ctx.beginPath();ctx.moveTo(0,-R*0.78);ctx.lineTo(R*0.62,-R*0.14);
  ctx.lineTo(R*0.38,R*0.72);ctx.lineTo(0,R*1.02);ctx.lineTo(-R*0.38,R*0.72);ctx.lineTo(-R*0.62,-R*0.14);ctx.closePath();ctx.fill();
  const flicker=0.72+0.28*Math.sin(t*8);
  ctx.strokeStyle=`rgba(255,225,145,${flicker})`;ctx.lineWidth=Math.max(2,R*0.065);
  ctx.shadowColor='rgba(255,120,70,0.95)';ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(0,-R*0.62);ctx.lineTo(-R*0.10,-R*0.14);ctx.lineTo(R*0.08,R*0.25);ctx.lineTo(0,R*0.68);ctx.stroke();
  ctx.strokeStyle='rgba(120,220,255,0.88)';ctx.lineWidth=Math.max(1.5,R*0.04);
  ctx.beginPath();ctx.moveTo(-R*0.46,-R*0.05);ctx.lineTo(-R*0.12,R*0.03);
  ctx.moveTo(R*0.46,-R*0.05);ctx.lineTo(R*0.12,R*0.03);ctx.stroke();
  ctx.restore();
}

function drawNullBossSprite(){
  const b=boss,img=NULL_BOSS_ART[b.stage];
  const iw=img&&(img.naturalWidth||img.width),ih=img&&(img.naturalHeight||img.height);
  if(!img||!img.complete)return false;
  const ratios=[1468/1071,1492/1054,1364/1153];
  const w=Math.min(W*(b.stage===2?0.97:1.04),unit()*1.08),h=w*(iw&&ih?ih/iw:ratios[b.stage]);
  const focus=b.stage===0?0.255:(b.stage===1?0.22:0.49);
  const x=b.x-w/2,y=b.y-h*focus;
  ctx.save();
  ctx.globalAlpha*=b.hurt>0?0.92:1;
  ctx.drawImage(img,x,y,w,h);
  if(b.hurt>0){ctx.globalCompositeOperation='screen';ctx.globalAlpha=0.18*b.hurt;ctx.drawImage(img,x,y,w,h);}
  ctx.restore();
  return true;
}

function drawNullSovereign(t){
  const b=boss,R=b.r,U=unit();
  ctx.save();
  if(b.dying>0)ctx.globalAlpha=Math.max(0,b.dying/4.2);

  const coreR=b.stage===0?R*0.70:(b.stage===1?R*0.88:R*1.08);
  const phaseArt=NULL_BOSS_ART[b.stage];
  const hasPaintedBoss=!!(phaseArt&&phaseArt.complete&&(phaseArt.naturalWidth||phaseArt.width));
  if(!hasPaintedBoss){
    drawNullRegalia(t);

  // Gravitational lensing shared by all forms.
  for(let i=0;i<5;i++){
    ctx.beginPath();ctx.ellipse(b.x,b.y,R*(1.8+i*0.35),R*(1.15+i*0.2),t*0.08+i*0.5,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${i%2?'115,80,255':'255,185,90'},${0.11-i*0.012})`;
    ctx.lineWidth=1.5;ctx.stroke();
  }

  if(b.stage<2){
    // Celestial shell: a readable armored torso with galaxies in its shoulders.
    const body=ctx.createRadialGradient(b.x,b.y,R*0.15,b.x,b.y,R*2.2);
    body.addColorStop(0,b.hurt>0?'rgba(125,40,115,0.95)':'rgba(50,18,78,0.96)');
    body.addColorStop(0.55,'rgba(18,8,38,0.96)');body.addColorStop(1,'rgba(3,2,12,0)');
    ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(b.x,b.y+R*0.72,R*1.75,R*1.85,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,180,80,0.6)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(b.x-R*1.7,b.y+R*0.25);ctx.lineTo(b.x-R*0.7,b.y-R*0.35);
    ctx.lineTo(b.x,b.y+R*1.65);ctx.lineTo(b.x+R*0.7,b.y-R*0.35);ctx.lineTo(b.x+R*1.7,b.y+R*0.25);ctx.stroke();
  }

  // Eclipse face / revealed core. It grows as the shell breaks.
  const glow=ctx.createRadialGradient(b.x,b.y,coreR*0.75,b.x,b.y,coreR*1.5);
  glow.addColorStop(0,'rgba(0,0,0,1)');
  glow.addColorStop(0.72,'rgba(0,0,0,1)');
  glow.addColorStop(0.83,b.stage===1?'rgba(215,80,255,0.95)':'rgba(255,220,145,1)');
  glow.addColorStop(1,'rgba(120,70,255,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(b.x,b.y,coreR*1.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(b.x,b.y,coreR,0,Math.PI*2);ctx.fill();
  drawNullVisage(t);
  drawNullCrown(t,b.stage===2?0.7:1);
  }
  const paintedBoss=hasPaintedBoss?drawNullBossSprite():false;

  if(b.stage===0){
    for(const a of b.anchors)drawNullAnchor(a,t);
  }else if(b.stage===1){
    // Three eras and three echoes, deliberately ghosted behind the repair targets.
    const bands=[['255,100,45',0,W/3],['185,90,255',W/3,W/3],['70,190,255',W*2/3,W/3]];
    for(const [col,x,w] of bands){ctx.fillStyle=`rgba(${col},0.055)`;ctx.fillRect(x,0,w,H);}
    // Archdemon wings, Devourer arms, Dreadnought wedge.
    ctx.globalAlpha=0.24;ctx.strokeStyle='rgba(255,70,55,0.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(W*0.17,H*0.16);ctx.lineTo(W*0.03,H*0.09);ctx.lineTo(W*0.1,H*0.22);ctx.lineTo(W*0.02,H*0.28);
    ctx.moveTo(W*0.17,H*0.16);ctx.lineTo(W*0.31,H*0.09);ctx.lineTo(W*0.25,H*0.22);ctx.lineTo(W*0.32,H*0.28);ctx.stroke();
    ctx.strokeStyle='rgba(100,210,255,0.9)';ctx.beginPath();ctx.moveTo(W*0.7,H*0.12);ctx.lineTo(W*0.95,H*0.17);ctx.lineTo(W*0.7,H*0.22);ctx.closePath();ctx.stroke();
    ctx.strokeStyle='rgba(255,190,80,0.9)';
    for(let i=0;i<4;i++){const a=i*Math.PI/2+t*0.25;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.quadraticCurveTo(b.x+Math.cos(a+0.4)*R*2,b.y+Math.sin(a+0.4)*R*2,b.x+Math.cos(a)*R*2.8,b.y+Math.sin(a)*R*2.8);ctx.stroke();}
    ctx.globalAlpha=1;
    // The three broken eras are luminous worlds, joined by a repaired golden arc.
    ctx.beginPath();ctx.moveTo(W*0.18,H*0.51);ctx.quadraticCurveTo(W*0.5,H*0.61,W*0.82,H*0.51);
    ctx.strokeStyle='rgba(255,205,95,0.62)';ctx.lineWidth=3;ctx.shadowColor='rgba(255,170,50,0.8)';ctx.shadowBlur=12;ctx.stroke();ctx.shadowBlur=0;
    for(const th of b.threads){
      const p=nullThreadBreak(th),top={x:p.x,y:H*0.31},bot={x:p.x,y:H*0.68};
      ctx.strokeStyle=`rgba(${th.color},${th.joined?0.9:0.5})`;ctx.lineWidth=th.joined?4:2;
      ctx.shadowColor=`rgba(${th.color},0.8)`;ctx.shadowBlur=th.joined?12:5;
      ctx.beginPath();ctx.moveTo(top.x,top.y);ctx.lineTo(p.x,p.y-U*0.045);
      ctx.moveTo(p.x,p.y+U*0.045);ctx.lineTo(bot.x,bot.y);ctx.stroke();ctx.shadowBlur=0;
      const rr=U*0.062,ag=ctx.createRadialGradient(p.x,p.y,1,p.x,p.y,rr*1.6);
      ag.addColorStop(0,'rgba(255,255,245,1)');ag.addColorStop(0.15,`rgba(${th.color},1)`);
      ag.addColorStop(0.52,`rgba(${th.color},0.28)`);ag.addColorStop(1,`rgba(${th.color},0)`);
      ctx.fillStyle=ag;ctx.beginPath();ctx.arc(p.x,p.y,rr*1.6,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(${th.color},${th.joined?0.95:0.72})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(p.x,p.y,rr*1.35,rr*0.45,t*0.25,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(p.x-rr*0.72,p.y);ctx.lineTo(p.x+rr*0.72,p.y);
      ctx.moveTo(p.x,p.y-rr*0.72);ctx.lineTo(p.x,p.y+rr*0.72);ctx.stroke();
      if(!th.joined){
        ctx.beginPath();ctx.arc(p.x,p.y,U*0.074,0,Math.PI*2);ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
      }
    }
  }else{
    // Three breakable event-horizon plates.
    for(let si=0;si<b.shields.length;si++){
      const sh=b.shields[si];
      if(!sh.alive)continue;
      const p=nullShieldPos(sh),a=sh.angle+b.t*0.16;
      if(paintedBoss){
        ctx.beginPath();ctx.arc(p.x,p.y,R*(0.62+0.07*Math.sin(t*6+si)),0,Math.PI*2);
        ctx.strokeStyle='rgba(255,155,225,0.62)';ctx.lineWidth=3;
        ctx.shadowColor='rgba(255,70,220,1)';ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;
      }else{
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(a+Math.PI/2);
        const plate=ctx.createLinearGradient(-R,0,R,0);
        plate.addColorStop(0,'rgba(22,7,45,0.94)');plate.addColorStop(0.55,'rgba(105,30,125,0.82)');plate.addColorStop(1,'rgba(10,3,28,0.96)');
        ctx.beginPath();ctx.arc(0,0,R*0.92,-1.08,1.08);ctx.lineTo(0,0);ctx.closePath();ctx.fillStyle=plate;ctx.fill();
        ctx.beginPath();ctx.arc(0,0,R*0.92,-1.08,1.08);
        ctx.strokeStyle='rgba(255,155,225,0.9)';ctx.lineWidth=R*0.12;
        ctx.shadowColor='rgba(180,70,255,0.95)';ctx.shadowBlur=16;ctx.stroke();
        ctx.strokeStyle='rgba(255,210,145,0.65)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(R*0.72,-R*0.32);ctx.moveTo(0,0);ctx.lineTo(R*0.62,R*0.46);ctx.stroke();ctx.restore();
      }
      // Every plate has an unmistakable target ring and its own remaining health.
      const hp=Math.max(0,sh.hp/sh.maxHp);
      ctx.beginPath();ctx.arc(p.x,p.y,R*0.72,-Math.PI/2,-Math.PI/2+Math.PI*2*hp);
      ctx.strokeStyle='rgba(255,235,170,0.96)';ctx.lineWidth=4;ctx.stroke();
      ctx.save();ctx.textAlign='center';ctx.font='800 8px Orbitron, monospace';
      ctx.fillStyle='rgba(255,245,220,0.96)';ctx.fillText(`PLATE ${si+1} — SWIPE`,p.x,p.y+R*0.94);
      ctx.font='700 7px Orbitron, monospace';ctx.fillStyle='rgba(255,190,230,0.9)';
      ctx.fillText(`${sh.hp} HITS`,p.x,p.y+R*1.10);ctx.restore();
    }
    if(b.coreOpen){
      const k=Math.max(0,b.coreHp/b.coreMax),f=0.65+0.35*Math.sin(t*9);
      ctx.beginPath();ctx.arc(b.x,b.y,coreR*(1.05+(1-k)*0.12),0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,245,205,${0.65+0.3*f})`;ctx.lineWidth=3+(1-k)*5;ctx.stroke();
      ctx.beginPath();ctx.moveTo(b.x-coreR*0.72,b.y);ctx.lineTo(b.x+coreR*0.72,b.y);
      ctx.moveTo(b.x,b.y-coreR*0.72);ctx.lineTo(b.x,b.y+coreR*0.72);
      ctx.strokeStyle=`rgba(255,245,205,${0.5+0.4*f})`;ctx.lineWidth=2;ctx.stroke();
    }
  }
  if(b.pulse>0){
    ctx.beginPath();ctx.arc(b.x,b.y,R*(2.2+(1-b.pulse)*4.5),0,Math.PI*2);
    ctx.strokeStyle=`rgba(220,170,255,${b.pulse*0.55})`;ctx.lineWidth=3*b.pulse;ctx.stroke();
  }
  ctx.restore();

  drawBossBar(b.x,b.y,b.stage===0?R*3.55:R*2.55,'THE NULL SOVEREIGN',3,b.stage,nullPhaseProgress());
  ctx.save();ctx.textAlign='center';ctx.font='800 11px Orbitron, monospace';
  ctx.fillStyle='rgba(255,235,185,0.94)';ctx.shadowColor='rgba(255,120,60,0.8)';ctx.shadowBlur=8;
  ctx.fillText(nullObjective(),W/2,H*0.72);ctx.restore();

  if(b.stage===2&&(b.phaseGuide>0||b.coreGuide>0)){
    const core=b.coreGuide>0;
    const alpha=Math.min(1,Math.max(0,core?b.coreGuide:b.phaseGuide));
    const boxW=Math.min(W*0.88,360),boxH=72,x=(W-boxW)/2,y=H*0.53;
    ctx.save();ctx.globalAlpha=alpha;
    ctx.fillStyle='rgba(8,2,22,0.92)';ctx.strokeStyle=core?'rgba(255,225,130,0.92)':'rgba(255,115,220,0.88)';ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(x,y,boxW,boxH,12);ctx.fill();ctx.stroke();
    ctx.textAlign='center';ctx.fillStyle='rgba(255,245,220,0.98)';ctx.font='900 14px Orbitron, monospace';
    ctx.fillText(core?'CORE EXPOSED':'PHASE 3 — EVENT HORIZON',W/2,y+27);
    ctx.font='700 10px Orbitron, monospace';ctx.fillStyle=core?'rgba(255,225,145,0.94)':'rgba(255,190,235,0.94)';
    ctx.fillText(core?'SWIPE THE CENTER BLACK HOLE':'SWIPE EACH OF THE 3 LABELED PLATES',W/2,y+51);ctx.restore();
  }
}

function announceBossDefeated(){
  bossDefeatBanner=1.8;
}

function drawBossDefeatedBanner(){
  if(bossDefeatBanner<=0)return;
  const duration=1.8;
  const alpha=Math.max(0,Math.min(1,(duration-bossDefeatBanner)/0.14,bossDefeatBanner/0.28));
  const boxW=Math.min(W*0.86,unit()*0.92), boxH=Math.max(70,unit()*0.20);
  const x=(W-boxW)/2, y=H*0.18-boxH/2;
  ctx.save();ctx.globalAlpha=alpha;
  const bg=ctx.createLinearGradient(x,y,x+boxW,y+boxH);
  bg.addColorStop(0,'rgba(8,2,18,0.90)');
  bg.addColorStop(0.5,'rgba(48,8,42,0.92)');
  bg.addColorStop(1,'rgba(12,5,26,0.90)');
  ctx.fillStyle=bg;
  ctx.beginPath();ctx.roundRect(x,y,boxW,boxH,16);ctx.fill();
  ctx.strokeStyle='rgba(255,190,90,0.75)';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(x,y,boxW,boxH,16);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=`900 ${Math.round(Math.max(24,unit()*0.072))}px Orbitron, monospace`;
  ctx.fillStyle='rgba(255,244,205,1)';
  ctx.shadowColor='rgba(255,120,50,0.9)';ctx.shadowBlur=18;
  ctx.fillText('BOSS DEFEATED!',W/2,y+boxH/2);
  ctx.restore();
}

/// Shared death sequence for the two protect bosses.
function tickBossDeath(dt,color){
  boss.dying-=dt;
  if(Math.random()<0.45)
    emitParticles(boss.x+(Math.random()-0.5)*boss.r*2.2,
                  boss.y+(Math.random()-0.5)*boss.r*1.4,color,7,200);
  if(boss.dying<=0){
    stopBossDrone();
    screenFlash=1;
    emitParticles(boss.x,boss.y,'rgba(255,255,220,1)',80,440);
    const pts=2000*currentLevel;
    score+=pts;
    addScorePopup(boss.x,boss.y,pts,'rgba(255,255,150,1)');
    boss=null;
    completeLevel();
  }
}

function bossHitFx(x,y){
  emitParticles(x,y,'rgba(0,255,200,1)',10,130);
  playSwipeHit(x);
  if(window.nativeHaptic)window.nativeHaptic('swipe');
}

/// Keep allies below the boss so they aren't parked on top of its hitbox.
function herdAlliesBelow(line,dt){
  for(const a of angels){
    if(!a.alive)continue;
    if(a.y<line)a.vy+=(line-a.y)*2.6*dt;
  }
}

// ─────────────────────────────────────────────
// ARCHDEMON
// ─────────────────────────────────────────────
// Three phases of health. It hurls hellfire at the angels; every fireball can
// be swiped out of the air. Attack the body or defend the Host — the whole
// fight is that choice.
const ARCH_PHASES=[
  {hp:44, volley:3.0, balls:1, speed:0.32},
  {hp:52, volley:2.5, balls:2, speed:0.35},
  {hp:62, volley:2.0, balls:3, speed:0.38},
];
function spawnArchdemon(){
  const U=unit(), tier=bossTier();
  boss={
    kind:'archdemon', tier,
    x:W/2, y:-U*0.3, homeY:H*0.24,
    r:U*0.10, phase:0,
    hp:0, maxHp:0,
    hurt:0, stun:2.2,            // entrance: can't be hurt while descending
    volleyT:2.5, wp:{x:W/2,y:H*0.24}, wpT:0,
    fireballs:[], dying:0, t:0, roar:0,
  };
  archSetPhase(0);
  startBossDrone();
}
function archSetPhase(n){
  const c=ARCH_PHASES[n];
  boss.phase=n;
  boss.maxHp=Math.round(c.hp*(1+0.25*boss.tier));
  boss.hp=boss.maxHp;
}
function archCfg(){return ARCH_PHASES[boss.phase];}

/// One landed hit on the Archdemon. Shared by swipes and the test harness.
function archdemonHit(amount){
  if(!boss||boss.kind!=='archdemon'||boss.dying>0||boss.stun>0)return false;
  boss.hp-=amount===undefined?1:amount;
  boss.hurt=1;
  if(amount===undefined){
    const pts=15+currentLevel*4;
    score+=pts;
  }
  if(boss.hp<=0)archBreakPhase();
  return true;
}
function archBreakPhase(){
  const pts=1200*currentLevel*(boss.phase+1);
  score+=pts;
  addScorePopup(boss.x,boss.y,pts,'rgba(255,240,160,1)');
  screenFlash=0.7;
  emitParticles(boss.x,boss.y,'rgba(255,120,40,1)',50,320);
  if(window.nativeHaptic)window.nativeHaptic('levelComplete');
  if(boss.phase>=ARCH_PHASES.length-1){
    announceBossDefeated();
    boss.dying=2.4; boss.fireballs=[];
    return;
  }
  scorePopups.push({x:boss.x,y:boss.y-boss.r*2.4,pts:'IT RISES AGAIN',
    color:'rgba(255,140,90,1)',life:2,vy:-30,isText:true});
  archSetPhase(boss.phase+1);
  boss.stun=1.4; boss.roar=1;
  setBossDronePitch(BOSS_ARMS-boss.phase*1.4);
  // Calls its imps.
  for(let i=0;i<1+boss.phase+boss.tier;i++)spawnDemon({kind:'celestial'});
  // The roar throws the angels clear, and burns away incoming fire.
  for(const a of angels){
    if(!a.alive)continue;
    const dx=a.x-boss.x, dy=a.y-boss.y, d=Math.hypot(dx,dy)||1;
    a.vx+=(dx/d)*160; a.vy+=(dy/d)*160;
  }
}
/// Swiping a fireball snuffs it out. One pass is enough.
function snuffFireball(fb){
  if(fb.dead)return false;
  fb.dead=true;
  const pts=10+currentLevel*2;
  score+=pts;
  emitParticles(fb.x,fb.y,'rgba(255,170,60,1)',14,150);
  playPopSound(fb.x);
  if(window.nativeHaptic)window.nativeHaptic('swipe');
  return true;
}
function archVolley(){
  const living=angels.filter(a=>a.alive);
  if(!living.length)return;
  // Picks on the weakest angel, so a wounded one needs covering.
  living.sort((a,b)=>a.hp-b.hp||Math.random()-0.5);
  const c=archCfg(), U=unit();
  const balls=c.balls+(boss.tier>0?1:0);
  for(let i=0;i<balls;i++){
    const target=living[i%living.length];
    const dx=target.x-boss.x, dy=target.y-boss.y, d=Math.hypot(dx,dy)||1;
    const spread=(i-(balls-1)/2)*0.18;
    const ang=Math.atan2(dy,dx)+spread;
    const sp=U*c.speed*(1+0.08*boss.tier);
    boss.fireballs.push({
      x:boss.x+Math.cos(ang)*boss.r*0.9, y:boss.y+Math.sin(ang)*boss.r*0.9,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      target, r:U*0.026, life:6, dead:false, trail:[],
    });
  }
  playLaser(boss.x,false);
}
function updateArchdemon(dt){
  const b=boss, U=unit();
  b.t+=dt;
  if(b.hurt>0)b.hurt=Math.max(0,b.hurt-dt*3);
  if(b.roar>0)b.roar=Math.max(0,b.roar-dt*1.5);
  if(b.dying>0){tickBossDeath(dt,'rgba(255,90,40,1)');return;}

  // Descend on entry, then wander the upper band.
  if(b.stun>0)b.stun-=dt;
  b.wpT-=dt;
  if(b.wpT<=0){
    b.wpT=3.5-b.phase*0.7;
    b.wp={x:W*(0.22+Math.random()*0.56), y:H*(0.16+Math.random()*0.16)};
  }
  const k=Math.min(1,dt*(0.9+b.phase*0.35));
  b.x+=(b.wp.x-b.x)*k; b.y+=(b.wp.y-b.y)*k;

  herdAlliesBelow(H*0.42,dt);

  // Hellfire.
  b.volleyT-=dt;
  if(b.volleyT<=0&&b.stun<=0){
    b.volleyT=archCfg().volley*(1-0.12*b.tier);
    archVolley();
  }
  for(let i=b.fireballs.length-1;i>=0;i--){
    const f=b.fireballs[i];
    if(f.dead){b.fireballs.splice(i,1);continue;}
    // Gentle homing — it can be dodged by an angel's drift, not outrun.
    if(f.target&&f.target.alive){
      const dx=f.target.x-f.x, dy=f.target.y-f.y, d=Math.hypot(dx,dy)||1;
      const sp=Math.hypot(f.vx,f.vy);
      f.vx+=(dx/d)*sp*0.9*dt; f.vy+=(dy/d)*sp*0.9*dt;
      const ns=Math.hypot(f.vx,f.vy)||1; f.vx=f.vx/ns*sp; f.vy=f.vy/ns*sp;
    }
    f.x+=f.vx*dt; f.y+=f.vy*dt; f.life-=dt;
    f.trail.push({x:f.x,y:f.y}); if(f.trail.length>9)f.trail.shift();
    if(f.life<=0||f.x<-60||f.x>W+60||f.y<-60||f.y>H+60){b.fireballs.splice(i,1);continue;}
    let gone=false;
    for(const bh of blackHoles){
      if(bh.forming||bh.shrinking)continue;
      if(Math.hypot(f.x-bh.x,f.y-bh.y)<bh.r*0.9){gone=true;break;}
    }
    if(!gone){
      for(const a of angels){
        if(!a.alive)continue;
        if(Math.hypot(f.x-a.x,f.y-a.y)<a.r+f.r){
          a.hp--; a.hurt=1;
          emitParticles(f.x,f.y,'rgba(255,140,50,1)',16,150);
          playSwipeHit(f.x);
          if(a.hp<=0)killAngel(a);
          gone=true; break;
        }
      }
    }
    if(!gone&&voyager&&voyager.alive&&!voyager.wormhole&&
       Math.hypot(f.x-voyager.x,f.y-voyager.y)<voyager.r+f.r){
      damageVoyager(null); gone=true;
    }
    if(gone)b.fireballs.splice(i,1);
  }

  if(alliesAlive()===0){endGame('The Host has fallen');return;}
}
function archdemonSwipe(pos){
  const b=boss;
  for(const f of b.fireballs){
    if(!f.dead&&Math.hypot(pos.x-f.x,pos.y-f.y)<f.r*2.6){snuffFireball(f);return true;}
  }
  if(Math.hypot(pos.x-b.x,pos.y-b.y)<b.r*1.45){
    if(b.stun>0){emitParticles(pos.x,pos.y,'rgba(255,200,140,1)',4,60);return true;}
    archdemonHit();
    bossHitFx(pos.x,pos.y);
    return true;
  }
  return false;
}
function drawArchdemon(t){
  const b=boss, R=b.r;
  ctx.save();
  if(b.dying>0)ctx.globalAlpha=Math.max(0,Math.min(1,b.dying/2.4));

  // Hellfire aura
  const pulse=0.5+0.5*Math.sin(t*3);
  const g=ctx.createRadialGradient(b.x,b.y,R*0.4,b.x,b.y,R*3.6);
  g.addColorStop(0,`rgba(255,${90-b.phase*25},30,${0.32+b.hurt*0.25})`);
  g.addColorStop(0.45,'rgba(150,10,40,0.16)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,R*3.6,0,Math.PI*2);ctx.fill();

  // Roar ring
  if(b.roar>0){
    ctx.beginPath();ctx.arc(b.x,b.y,R*(1.4+(1-b.roar)*4),0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,150,70,${b.roar*0.7})`;ctx.lineWidth=5*b.roar+1;ctx.stroke();
  }

  ctx.save();ctx.translate(b.x,b.y);
  // Two pairs of great wings
  const flap=Math.sin(t*2.2)*0.16;
  for(const pair of [0,1]){
    for(const dir of [-1,1]){
      ctx.save();ctx.scale(dir,1);ctx.rotate((pair?0.55:-0.1)+flap*(pair?-1:1));
      const s=pair?0.78:1;
      ctx.beginPath();
      ctx.moveTo(R*0.3,-R*0.1);
      ctx.lineTo(R*2.6*s,-R*1.7*s);
      ctx.lineTo(R*2.2*s,-R*0.6*s);
      ctx.lineTo(R*3.0*s,-R*0.2*s);
      ctx.lineTo(R*2.0*s, R*0.15*s);
      ctx.lineTo(R*2.5*s, R*0.8*s);
      ctx.lineTo(R*1.3*s, R*0.5*s);
      ctx.lineTo(R*1.2*s, R*1.1*s);
      ctx.lineTo(R*0.35, R*0.45);
      ctx.closePath();
      ctx.fillStyle=pair?'rgba(36,5,12,0.9)':'rgba(56,9,18,0.95)';ctx.fill();
      ctx.strokeStyle=`rgba(255,${80+pulse*50},40,0.5)`;ctx.lineWidth=1.2;ctx.stroke();
      // Wing bones
      ctx.beginPath();ctx.moveTo(R*0.3,-R*0.1);ctx.lineTo(R*2.6*s,-R*1.7*s);
      ctx.moveTo(R*0.3,0);ctx.lineTo(R*3.0*s,-R*0.2*s);
      ctx.moveTo(R*0.3,R*0.2);ctx.lineTo(R*2.5*s,R*0.8*s);
      ctx.strokeStyle='rgba(120,20,25,0.7)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.restore();
    }
  }
  // Body
  const bg=ctx.createRadialGradient(-R*0.25,-R*0.3,R*0.1,0,0,R*1.05);
  bg.addColorStop(0,b.hurt>0?'#d24a2a':'#9a1a16');
  bg.addColorStop(0.6,'#420912');
  bg.addColorStop(1,'#120205');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,R,0,Math.PI*2);ctx.fill();
  // Crown of horns
  ctx.fillStyle='#1a0308';
  const horns=[[0.18,1.9],[0.5,1.55],[0.8,1.15]];
  for(const dir of [-1,1]){
    for(const [px,len] of horns){
      ctx.beginPath();
      ctx.moveTo(dir*R*(px-0.14),-R*0.8);
      ctx.quadraticCurveTo(dir*R*(px+0.45),-R*(0.9+len*0.6), dir*R*(px+0.12),-R*(0.8+len*0.55));
      ctx.quadraticCurveTo(dir*R*(px+0.05),-R*1.0, dir*R*(px+0.14),-R*0.72);
      ctx.closePath();ctx.fill();
    }
  }
  // Burning chest rune — shows remaining health as it dims
  const hpk=Math.max(0,b.hp/b.maxHp);
  ctx.beginPath();ctx.arc(0,R*0.28,R*0.3,0,Math.PI*2);
  ctx.strokeStyle=`rgba(255,${120+hpk*100},60,${0.35+0.5*hpk})`;ctx.lineWidth=2;ctx.stroke();
  ctx.beginPath();
  for(let i=0;i<3;i++){
    const a=t*0.8+i*Math.PI*2/3;
    ctx.moveTo(Math.cos(a)*R*0.3,R*0.28+Math.sin(a)*R*0.3);
    ctx.lineTo(Math.cos(a+Math.PI)*R*0.3,R*0.28+Math.sin(a+Math.PI)*R*0.3);
  }
  ctx.strokeStyle=`rgba(255,170,80,${0.25+0.4*hpk})`;ctx.lineWidth=1.2;ctx.stroke();
  // Eyes
  const glow=0.7+0.3*Math.sin(t*6);
  for(const dir of [-1,1]){
    ctx.beginPath();ctx.ellipse(dir*R*0.33,-R*0.22,R*0.17,R*0.1,dir*0.35,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${210*glow},60,1)`;
    ctx.shadowColor='rgba(255,120,20,1)';ctx.shadowBlur=14;ctx.fill();
  }
  ctx.shadowBlur=0;
  if(b.stun>0){
    ctx.beginPath();ctx.arc(0,0,R*1.35,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,220,160,${0.35+0.25*Math.sin(t*12)})`;ctx.lineWidth=2;
    ctx.setLineDash([6,6]);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.restore();

  // Fireballs
  for(const f of b.fireballs){
    for(let i=0;i<f.trail.length;i++){
      const p=f.trail[i], k=i/f.trail.length;
      ctx.beginPath();ctx.arc(p.x,p.y,f.r*(0.3+k*0.7),0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${80+k*60},30,${k*0.35})`;ctx.fill();
    }
    const fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*1.6);
    fg.addColorStop(0,'rgba(255,250,210,1)');
    fg.addColorStop(0.35,'rgba(255,170,50,0.95)');
    fg.addColorStop(1,'rgba(255,50,10,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(f.x,f.y,f.r*1.6,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  drawBossBar(b.x,b.y,R*2.3,`${bossName(currentLevel).toUpperCase()}`,
    ARCH_PHASES.length,b.phase,b.hp/b.maxHp);
}

/// Name, phase pips and a health bar under the boss.
function drawBossBar(x,y,below,label,phases,phase,frac){
  const w=Math.min(W*0.62,220);
  let ly=y+below;
  if(ly>H*0.62)ly=y-below;
  ly=Math.max(ly,70);
  const lx=Math.max(w/2+10,Math.min(W-w/2-10,x));
  ctx.save();
  ctx.globalAlpha=0.9;
  ctx.font="700 11px Orbitron, monospace";
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,200,120,0.8)';
  ctx.fillText(`${label}  \u2022  PHASE ${phase+1} / ${phases}`,lx,ly);
  ctx.fillStyle='rgba(255,255,255,0.12)';
  ctx.fillRect(lx-w/2,ly+7,w,5);
  const bg=ctx.createLinearGradient(lx-w/2,0,lx+w/2,0);
  bg.addColorStop(0,'#ff4466');bg.addColorStop(1,'#ffcc00');
  ctx.fillStyle=bg;
  ctx.fillRect(lx-w/2,ly+7,w*Math.max(0,Math.min(1,frac)),5);
  ctx.restore();
}

// ─────────────────────────────────────────────
// DREADNOUGHT
// ─────────────────────────────────────────────
// Stage 1: gun turrets along the hull fire on the fleet. Destroy them.
// Stage 2: the armour splits and the reactor is exposed. It charges a main
// cannon that one-shots a friendly ship — land enough hits on the reactor
// during the charge to break it. Fighters launch from the hangar throughout.
function spawnDreadnought(){
  const U=unit(), tier=bossTier();
  const w=Math.min(W*0.9,U*1.0), h=U*0.15;
  const turrets=[];
  const n=4+tier;
  for(let i=0;i<n;i++){
    const fx=(i+0.5)/n;
    turrets.push({fx:-0.42+fx*0.84, fy:(i%2?0.36:-0.36),
      hits:0, need:Math.round(9*(1+0.2*tier)), alive:true,
      fireT:1.2+i*0.55, aim:Math.PI/2});
  }
  boss={
    kind:'dreadnought', tier,
    x:W/2, y:-h*2, homeY:H*0.2,
    w, h, r:h*1.2,
    stage:0, turrets,
    coreHp:0, coreMax:Math.round(60*(1+0.25*tier)),
    charge:0, chargeT:5, chargeTarget:null, chargeHits:0, beam:0, beamFrom:null, beamTo:null,
    hangarT:5, hurt:0, dying:0, t:0, stun:2.0, open:0,
  };
  boss.coreHp=boss.coreMax;
  startBossDrone();
}
function dreadTurretPos(tu){
  const b=boss;
  return {x:b.x+tu.fx*b.w, y:b.y+tu.fy*b.h};
}
function dreadHitTurret(tu){
  if(!tu.alive||boss.stun>0)return false;
  tu.hits++;
  score+=12+currentLevel*3;
  if(tu.hits>=tu.need){
    tu.alive=false;
    const p=dreadTurretPos(tu);
    const pts=Math.floor(unit()*0.8)+currentLevel*25;
    score+=pts;
    addScorePopup(p.x,p.y,pts,'rgba(255,220,120,1)');
    emitParticles(p.x,p.y,'rgba(255,190,90,1)',34,240);
    emitParticles(p.x,p.y,'rgba(180,190,205,1)',16,150);
    playPopSound(p.x);
    if(window.nativeHaptic)window.nativeHaptic('destroy');
    if(boss.turrets.every(x=>!x.alive))dreadOpenCore();
  }
  return true;
}
function dreadOpenCore(){
  const b=boss;
  b.stage=1; b.stun=1.2; b.chargeT=3.5;
  screenFlash=0.6;
  const pts=1500*currentLevel;
  score+=pts;
  addScorePopup(b.x,b.y,pts,'rgba(255,240,160,1)');
  scorePopups.push({x:b.x,y:b.y+b.h*1.6,pts:'REACTOR EXPOSED',
    color:'rgba(120,230,255,1)',life:2.2,vy:-24,isText:true});
  setBossDronePitch(BOSS_ARMS-2.5);
  if(window.nativeHaptic)window.nativeHaptic('levelComplete');
  for(let i=0;i<1+b.tier;i++)dreadLaunchFighter();
}
function dreadHitCore(){
  const b=boss;
  if(b.stage!==1||b.stun>0||b.dying>0)return false;
  b.coreHp--; b.hurt=1;
  score+=20+currentLevel*4;
  if(b.charge>0){
    b.chargeHits++;
    if(b.chargeHits>=dreadInterruptNeed()){
      b.charge=0; b.chargeHits=0; b.chargeT=dreadChargeEvery();
      scorePopups.push({x:b.x,y:b.y+b.h*1.4,pts:'CANNON DISRUPTED',
        color:'rgba(120,230,255,1)',life:1.4,vy:-26,isText:true});
      emitParticles(b.x,b.y,'rgba(140,230,255,1)',28,220);
    }
  }
  if(b.coreHp<=0){
    announceBossDefeated();
    b.dying=2.6; b.charge=0;
    screenFlash=0.9;
  }
  return true;
}
function dreadInterruptNeed(){return 6+boss.tier;}
function dreadChargeEvery(){return Math.max(3.2,5.0-boss.tier*0.7);}
function dreadLaunchFighter(){
  const b=boss;
  spawnDemon({kind:'fleet'});
  const d=demons[demons.length-1];
  d.x=b.x+(Math.random()-0.5)*b.w*0.3; d.y=b.y+b.h*0.6;
}
function updateDreadnought(dt){
  const b=boss, U=unit();
  b.t+=dt;
  if(b.hurt>0)b.hurt=Math.max(0,b.hurt-dt*3);
  if(b.beam>0)b.beam=Math.max(0,b.beam-dt*2.5);
  if(b.dying>0){tickBossDeath(dt,'rgba(255,170,80,1)');return;}
  if(b.stun>0)b.stun-=dt;

  // Glides in, then holds station with a slow sway.
  b.y+=(b.homeY-b.y)*Math.min(1,dt*1.1);
  const swayX=W/2+Math.sin(b.t*0.35)*Math.max(0,(W-b.w)/2)*0.9;
  b.x+=(swayX-b.x)*Math.min(1,dt*1.5);
  if(b.stage===1)b.open=Math.min(1,b.open+dt*1.2);

  herdAlliesBelow(H*0.4,dt);

  // Turrets track and fire at the nearest friendly ship.
  if(b.stage===0){
    for(const tu of b.turrets){
      if(!tu.alive)continue;
      const p=dreadTurretPos(tu);
      let best=null,bd=Infinity;
      for(const a of angels){
        if(!a.alive)continue;
        const d=Math.hypot(a.x-p.x,a.y-p.y);
        if(d<bd){bd=d;best=a;}
      }
      if(best)tu.aim=Math.atan2(best.y-p.y,best.x-p.x);
      tu.fireT-=dt;
      if(tu.fireT<=0&&best&&b.stun<=0){
        tu.fireT=(3.0-0.3*b.tier)+Math.random()*0.8;
        fireShot({x:p.x,y:p.y,r:U*0.02,kind:'fleet'},best,false);
      }
    }
  }else{
    // Main cannon.
    if(b.charge<=0){
      b.chargeT-=dt;
      if(b.chargeT<=0&&b.stun<=0){
        const living=angels.filter(a=>a.alive);
        if(living.length){
          b.chargeTarget=living[Math.floor(Math.random()*living.length)];
          b.charge=0.0001; b.chargeHits=0;
        }else b.chargeT=1;
      }
    }else{
      b.charge+=dt/1.9;                // 1.9 seconds to fire
      if(!b.chargeTarget||!b.chargeTarget.alive){
        const living=angels.filter(a=>a.alive);
        b.chargeTarget=living[0]||null;
      }
      if(b.charge>=1){
        const tg=b.chargeTarget;
        b.charge=0; b.chargeHits=0; b.chargeT=dreadChargeEvery();
        if(tg&&tg.alive){
          b.beam=1; b.beamFrom={x:b.x,y:b.y}; b.beamTo={x:tg.x,y:tg.y};
          tg.hp=0; tg.hurt=1; killAngel(tg);
          screenFlash=0.35;
          if(voyager&&voyager.alive&&!voyager.wormhole&&
             distToSegment(voyager,b.beamFrom,b.beamTo)<voyager.r)damageVoyager(null);
        }
      }
    }
  }

  // Hangar
  b.hangarT-=dt;
  if(b.hangarT<=0&&b.stun<=0){
    b.hangarT=(b.stage?5.5:7.0)-b.tier*0.6;
    if(demons.filter(d=>d.dying<=0).length<3+b.tier)dreadLaunchFighter();
  }

  if(alliesAlive()===0){endGame('The fleet was destroyed');return;}
}
function distToSegment(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, l=dx*dx+dy*dy||1;
  const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l));
  return Math.hypot(p.x-(a.x+dx*t),p.y-(a.y+dy*t));
}
function dreadnoughtSwipe(pos){
  const b=boss, U=unit();
  if(b.stage===0){
    for(const tu of b.turrets){
      if(!tu.alive)continue;
      const p=dreadTurretPos(tu);
      if(Math.hypot(pos.x-p.x,pos.y-p.y)<U*0.065){
        if(b.stun>0)return true;
        dreadHitTurret(tu); bossHitFx(pos.x,pos.y); return true;
      }
    }
  }else if(Math.hypot(pos.x-b.x,pos.y-b.y)<b.h*0.95){
    if(b.stun>0)return true;
    dreadHitCore(); bossHitFx(pos.x,pos.y); return true;
  }
  // Glancing blows off the armour do nothing, but should feel like armour.
  if(Math.abs(pos.x-b.x)<b.w/2&&Math.abs(pos.y-b.y)<b.h*0.6){
    emitParticles(pos.x,pos.y,'rgba(200,210,230,1)',3,70);
    return true;
  }
  return false;
}
function drawDreadnought(t){
  const b=boss, w=b.w, h=b.h, U=unit();
  ctx.save();
  if(b.dying>0)ctx.globalAlpha=Math.max(0,Math.min(1,b.dying/2.6));

  // Engine glow at the stern ends

    eg.addColorStop(0,`rgba(255,120,60,${0.75*fl})`);
    eg.addColorStop(1,'rgba(255,60,20,0)');
    ctx.fillStyle=eg;ctx.beginPath();ctx.arc(ex,b.y,h*0.9,0,Math.PI*2);ctx.fill();
  }

  ctx.save();ctx.translate(b.x,b.y);
  // Hull
  const hull=new Path2D();
  hull.moveTo(-w*0.5,-h*0.18);
  hull.lineTo(-w*0.42,-h*0.5);
  hull.lineTo(-w*0.12,-h*0.58);
  hull.lineTo(-w*0.06,-h*0.95);   // bridge tower
  hull.lineTo( w*0.06,-h*0.95);
  hull.lineTo( w*0.12,-h*0.58);
  hull.lineTo( w*0.42,-h*0.5);
  hull.lineTo( w*0.5,-h*0.18);
  hull.lineTo( w*0.5, h*0.18);
  hull.lineTo( w*0.4, h*0.55);
  hull.lineTo( w*0.1, h*0.62);
  hull.lineTo( w*0.06, h*0.85);   // hangar mouth
  hull.lineTo(-w*0.06, h*0.85);
  hull.lineTo(-w*0.1, h*0.62);
  hull.lineTo(-w*0.4, h*0.55);
  hull.lineTo(-w*0.5, h*0.18);
  hull.closePath();
  const hg=ctx.createLinearGradient(0,-h,0,h);
  hg.addColorStop(0,b.hurt>0?'#6a3036':'#4a2025');
  hg.addColorStop(0.45,'#2a1418');
  hg.addColorStop(1,'#0e0608');
  ctx.fillStyle=hg;ctx.fill(hull);
  ctx.strokeStyle='rgba(255,90,60,0.5)';ctx.lineWidth=1.2;ctx.stroke(hull);
  // Panel lines
  ctx.strokeStyle='rgba(255,120,90,0.14)';ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=1;i<8;i++){const x=-w*0.5+i*w/8;ctx.moveTo(x,-h*0.45);ctx.lineTo(x,h*0.5);}
  ctx.moveTo(-w*0.48,0);ctx.lineTo(w*0.48,0);
  ctx.stroke();
  // Running lights
  for(let i=0;i<10;i++){
    const on=Math.sin(t*3+i*0.8)>0.3;
    ctx.fillStyle=on?'rgba(255,80,60,0.9)':'rgba(120,40,30,0.5)';
    ctx.fillRect(-w*0.45+i*w*0.1,-h*0.08,2.5,2.5);
  }
  // Bridge windows
  ctx.fillStyle='rgba(255,170,90,0.8)';
  for(let i=-2;i<=2;i++)ctx.fillRect(i*w*0.018-1.5,-h*0.82,3,2);

  // Reactor: armour plates slide apart in stage 2
  const open=b.open;
  const cr=h*0.42;
  if(open>0){
    const pul=0.6+0.4*Math.sin(t*(b.charge>0?20:5));
    const cg=ctx.createRadialGradient(0,0,0,0,0,cr*1.5);
    cg.addColorStop(0,`rgba(230,255,255,${pul})`);
    cg.addColorStop(0.35,`rgba(90,210,255,${0.85*open})`);
    cg.addColorStop(1,'rgba(40,120,255,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(0,0,cr*1.5,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#1c0d10';
  ctx.fillRect(-cr*1.1-open*cr*1.2,-cr*0.9,cr*1.1,cr*1.8);
  ctx.fillRect(open*cr*1.2,-cr*0.9,cr*1.1,cr*1.8);
  ctx.strokeStyle='rgba(255,90,60,0.4)';
  ctx.strokeRect(-cr*1.1-open*cr*1.2,-cr*0.9,cr*1.1,cr*1.8);
  ctx.strokeRect(open*cr*1.2,-cr*0.9,cr*1.1,cr*1.8);
  ctx.restore();

  // Turrets
  for(const tu of b.turrets){
    const p=dreadTurretPos(tu);
    const tr=U*0.028;
    if(!tu.alive){
      ctx.beginPath();ctx.arc(p.x,p.y,tr*0.8,0,Math.PI*2);
      ctx.fillStyle='rgba(20,10,10,0.9)';ctx.fill();
      if(Math.random()<0.2)emitParticles(p.x,p.y,'rgba(120,120,130,1)',1,40);
      continue;
    }
    ctx.save();ctx.translate(p.x,p.y);
    ctx.rotate(tu.aim);
    ctx.fillStyle='#5a2a2e';ctx.fillRect(0,-tr*0.22,tr*1.9,tr*0.44);
    ctx.restore();
    const dg=ctx.createRadialGradient(p.x-tr*0.3,p.y-tr*0.3,0,p.x,p.y,tr);
    dg.addColorStop(0,'#9a4a44');dg.addColorStop(1,'#2a1014');
    ctx.fillStyle=dg;ctx.beginPath();ctx.arc(p.x,p.y,tr,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,110,70,0.65)';ctx.lineWidth=1.2;ctx.stroke();
    if(tu.hits>0){
      ctx.beginPath();
      ctx.arc(p.x,p.y,tr+5,-Math.PI/2,-Math.PI/2+Math.PI*2*(tu.hits/tu.need));
      ctx.strokeStyle='rgba(0,255,200,0.85)';ctx.lineWidth=2.5;ctx.stroke();
