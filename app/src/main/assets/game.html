    if(tu.fireT<0.5&&b.stun<=0){
      ctx.beginPath();ctx.arc(p.x,p.y,tr*(1.3+(0.5-tu.fireT)),0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,80,50,${0.9-tu.fireT})`;ctx.lineWidth=1.5;ctx.stroke();
    }
  }

  // Main cannon charge: telegraph line thickens as it builds
  if(b.charge>0&&b.chargeTarget){
    const tg=b.chargeTarget;
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(tg.x,tg.y);
    ctx.strokeStyle=`rgba(120,220,255,${0.2+b.charge*0.6})`;
    ctx.lineWidth=1+b.charge*4;
    ctx.setLineDash([10,8]);ctx.lineDashOffset=-t*60;ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(tg.x,tg.y,tg.r*(2.4-b.charge*1.2),0,Math.PI*2);
    ctx.strokeStyle=`rgba(120,220,255,${0.3+b.charge*0.6})`;ctx.lineWidth=2;ctx.stroke();
    // Interrupt progress around the reactor
    const need=dreadInterruptNeed();
    for(let i=0;i<need;i++){
      const a=-Math.PI/2+i*(Math.PI*2/need);
      ctx.beginPath();ctx.arc(b.x+Math.cos(a)*h*0.75,b.y+Math.sin(a)*h*0.75,3.2,0,Math.PI*2);
      ctx.fillStyle=i<b.chargeHits?'rgba(0,255,200,0.95)':'rgba(255,255,255,0.3)';ctx.fill();
    }
  }
  if(b.beam>0&&b.beamFrom){
    ctx.beginPath();ctx.moveTo(b.beamFrom.x,b.beamFrom.y);ctx.lineTo(b.beamTo.x,b.beamTo.y);
    ctx.strokeStyle=`rgba(200,245,255,${b.beam})`;ctx.lineWidth=14*b.beam;ctx.lineCap='round';ctx.stroke();
    ctx.strokeStyle=`rgba(90,200,255,${b.beam*0.6})`;ctx.lineWidth=28*b.beam;ctx.stroke();
  }
  ctx.restore();

  const frac=b.stage===0
    ? b.turrets.filter(x=>x.alive).length/b.turrets.length
    : b.coreHp/b.coreMax;
  drawBossBar(b.x,b.y,h*1.35,`${bossName(currentLevel).toUpperCase()}`,2,b.stage,frac);
}

let demonSpawnTimer=0, angelSpawnTimer=0;

// Ranged combat. Both sides hold at a standoff distance and fire; contact is no
// longer the attack. Allies that survive long enough will clear hostiles on
// their own, which is what makes protecting them worth doing.
const SHOT_SPEED_MUL=0.62;   // x screen short edge, per second

function fireShot(from,target,fromAlly){
  const U=unit();
  const dx=target.x-from.x, dy=target.y-from.y, d=Math.hypot(dx,dy)||1;
  // Lead the target a little so moving ships are not trivially missed.
  const speed=U*SHOT_SPEED_MUL;
  const t=d/speed;
  const ax=(target.vx||0)*t*0.6, ay=(target.vy||0)*t*0.6;
  const tx=target.x+ax-from.x, ty=target.y+ay-from.y, td=Math.hypot(tx,ty)||1;
  shots.push({
    x:from.x+(tx/td)*from.r*1.1,
    y:from.y+(ty/td)*from.r*1.1,
    vx:(tx/td)*speed, vy:(ty/td)*speed,
    life:1.6, fromAlly, kind:from.kind||warTheme(), r:U*0.008,
  });
  playLaser(from.x,fromAlly);
}

function updateShots(dt){
  const U=unit();
  for(let i=shots.length-1;i>=0;i--){
    const p=shots[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0||p.x<-40||p.x>W+40||p.y<-40||p.y>H+40){shots.splice(i,1);continue;}

    // Black holes eat incoming fire, which keeps them relevant to the fight.
    let swallowed=false;
    for(const bh of blackHoles){
      if(bh.forming||bh.shrinking)continue;
      if(Math.hypot(p.x-bh.x,p.y-bh.y)<bh.r*0.9){swallowed=true;break;}
    }
    if(swallowed){shots.splice(i,1);continue;}

    if(p.fromAlly){
      for(const d of demons){
        if(d.dying>0)continue;
        if(Math.hypot(p.x-d.x,p.y-d.y)<d.r+U*0.012){
          d.swipeHits++;
          emitParticles(p.x,p.y,'rgba(140,230,255,1)',5,80);
          if(d.swipeHits>=d.hitsToKill)killDemon(d,true);
          shots.splice(i,1);
          break;
        }
      }
    }else{
      let hit=false;
      for(const a of angels){
        if(!a.alive)continue;
        if(Math.hypot(p.x-a.x,p.y-a.y)<a.r+U*0.012){
          a.hp--; a.hurt=1;
          emitParticles(p.x,p.y,'rgba(255,120,60,1)',5,80);
          if(a.hp<=0)killAngel(a);
          hit=true; break;
        }
      }
      if(!hit&&voyager&&voyager.alive&&!voyager.wormhole&&
         Math.hypot(p.x-voyager.x,p.y-voyager.y)<voyager.r+U*0.012){
        damageVoyager(null); hit=true;
      }
      if(hit)shots.splice(i,1);
    }
  }
}

function drawShots(){
  for(const p of shots){
    const len=Math.hypot(p.vx,p.vy)*0.045;
    const a=Math.atan2(p.vy,p.vx);
    const x2=p.x-Math.cos(a)*len, y2=p.y-Math.sin(a)*len;
    const col=p.fromAlly?'140,235,255':'255,110,60';
    const g=ctx.createLinearGradient(p.x,p.y,x2,y2);
    g.addColorStop(0,`rgba(${col},0.95)`);
    g.addColorStop(1,`rgba(${col},0)`);
    ctx.strokeStyle=g; ctx.lineWidth=2.4; ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,Math.PI*2);
    ctx.fillStyle=`rgba(${col},0.95)`;ctx.fill();
  }
}

/// Demons are worth what a black hole is worth, as asked. A black hole pays
/// out on its radius, so this uses the level's maximum radius as the yardstick
/// rather than the demon's own much smaller size.
function demonValue(){
  return Math.floor(unit()*LV.maxR*0.9)+currentLevel*5;
}

function warCounts(){
  // Scales with the level so late war rounds are genuinely under siege.
  const k=currentLevel-WAR_START_LEVEL;
  if(isFinalBoss())return {angels:8,demonCap:0,demonEvery:999};
  if(isBossLevel()&&bossKind()!=='devourer'){
    // The boss brings its own pressure; the background war stays light.
    return {angels:6, demonCap:2+bossTier(), demonEvery:9};
  }
  if(isBossLevel()){
    // Devourer: every faction present, but the maw is the fight.
    return {angels:6, demonCap:4+bossTier()*2, demonEvery:4.8};
  }
  if(isConvergence()){
    return {
      angels:Math.min(8, 4+Math.floor(k/4)),
      demonCap:Math.min(12, 5+Math.floor(k/3)),
      demonEvery:Math.max(2.0, 4.4-k*0.22),
    };
  }
  return {
    angels:Math.min(6, 3+Math.floor(k/3)),
    demonCap:Math.min(9, 3+Math.floor(k/2)),
    demonEvery:Math.max(2.4, 5.5-k*0.28),
  };
}

function spawnAngel(opts){
  opts=opts||{};
  const U=unit(), r=U*0.042;
  const kind=opts.kind||warTheme();
  const m=r*2.5;
  angels.push({
    x:opts.x!==undefined?opts.x:m+Math.random()*(W-m*2),
    y:opts.y!==undefined?opts.y:m+Math.random()*(H-m*2),
    r, kind, hp:3, maxHp:3, alive:true,
    fireCd:0.6+Math.random()*1.2,
    vx:(Math.random()-0.5)*20, vy:(Math.random()-0.5)*20,
    wander:Math.random()*Math.PI*2,
    phase:Math.random()*Math.PI*2,
    hurt:0, opacity:0, born:0,
  });
}

function spawnDemon(opts){
  opts=opts||{};
  const U=unit(), r=U*0.034;
  const kind=opts.kind||warTheme();
  // Enter from off-screen so they read as arriving, not appearing.
  const side=Math.floor(Math.random()*4);
  let x,y;
  if(side===0){x=-r*2;      y=Math.random()*H;}
  else if(side===1){x=W+r*2;y=Math.random()*H;}
  else if(side===2){x=Math.random()*W;y=-r*2;}
  else{x=Math.random()*W;   y=H+r*2;}
  demons.push({
    x,y,r, kind, vx:0, vy:0,
    speed:U*(0.10+Math.random()*0.05),
    swipeHits:0, hitsToKill:2,          // they move, so keep them killable
    attackCd:0, fireCd:0.8+Math.random()*1.4, target:null,
    phase:Math.random()*Math.PI*2,
    rotation:0, opacity:0, dying:0,
  });
}

function killDemon(d,byAlly){
  // An ally kill still pays, at half rate — the player kept that ally alive.
  const pts=byAlly?Math.floor(demonValue()*0.5):demonValue();
  score+=pts;
  addScorePopup(d.x,d.y,pts,byAlly?'rgba(140,235,255,1)':'rgba(255,120,90,1)');
  emitParticles(d.x,d.y,'rgba(255,60,40,1)',24,180);
  emitParticles(d.x,d.y,'rgba(120,0,0,1)',12,90);
  playPopSound(d.x);
  if(window.nativeHaptic)window.nativeHaptic('destroy');
  d.dying=1;
}

function killAngel(a){
  if(!a.alive)return;
  a.alive=false;
  // Losing an angel costs 5% of the points earned this round.
  const loss=Math.max(1,Math.round(score*0.05));
  score=Math.max(0,score-loss);
  scorePopups.push({x:a.x,y:a.y-34,pts:`${warWords().lost} \u2022 -${loss}`,
    color:'rgba(255,70,70,1)',life:2,vy:-28,isText:true});
  if(isFleet()){
    emitParticles(a.x,a.y,'rgba(255,190,90,1)',30,210);
    emitParticles(a.x,a.y,'rgba(180,190,205,1)',20,140);
  }else{
    emitParticles(a.x,a.y,'rgba(255,255,220,1)',30,200);
    emitParticles(a.x,a.y,'rgba(120,180,255,1)',18,120);
  }
  if(window.nativeHaptic)window.nativeHaptic('gameOver');
}

function startWar(){
  angels=[];demons=[];shots=[];
  demonSpawnTimer=0;angelSpawnTimer=0;
  const c=warCounts();
  if(isFinalBoss()){
    // The two wars finally become one defense line. Alternate kinds so the
    // alliance is visible before the Sovereign even enters.
    for(let i=0;i<c.angels;i++){
      spawnAngel({kind:i%2?'fleet':'celestial',x:W*(0.10+0.80*(i+0.5)/c.angels),y:H*(0.58+(i%2)*0.13)});
      const a=angels[angels.length-1];a.hp=a.maxHp=5;
    }
  }else if(isConvergence()){
    // Everything at once. Both factions, alternating, so neither side of the
    // screen becomes a single-faction pocket.
    for(let i=0;i<c.angels;i++)spawnAngel({kind:i%2?'fleet':'celestial'});
    for(let i=0;i<Math.max(2,Math.floor(c.demonCap*0.6));i++)
      spawnDemon({kind:i%2?'fleet':'celestial'});
  }else if(isBossLevel()){
    // Protect-them bosses: the allies start below the boss, and there are no
    // reinforcements — every loss is permanent.
    for(let i=0;i<c.angels;i++){
      spawnAngel({x:W*(0.15+0.7*(i+0.5)/c.angels), y:H*(0.55+Math.random()*0.3)});
      const a=angels[angels.length-1]; a.hp=a.maxHp=(bossKind()==='archdemon'?4:3);   // the Host is tougher for its set piece
    }
    spawnDemon();
  }else{
    for(let i=0;i<c.angels;i++)spawnAngel();
    for(let i=0;i<Math.max(1,Math.floor(c.demonCap/2));i++)spawnDemon();
  }
}

function updateWar(dt){
  const c=warCounts();

  // ── Angels: drift, wander, avoid black holes ──
  for(let i=angels.length-1;i>=0;i--){
    const a=angels[i];
    a.opacity=Math.min(1,a.opacity+dt*2);
    a.phase+=dt*2;
    if(a.hurt>0)a.hurt=Math.max(0,a.hurt-dt*2.5);
    if(!a.alive){
      a.opacity-=dt*2.2;
      if(a.opacity<=0)angels.splice(i,1);
      continue;
    }
    a.wander+=(Math.random()-0.5)*dt*3;
    a.vx+=Math.cos(a.wander)*12*dt;
    a.vy+=Math.sin(a.wander)*12*dt;
    // Angels shy away from black holes rather than feeding them.
    for(const bh of blackHoles){
      if(bh.forming||bh.shrinking)continue;
      const dx=a.x-bh.x, dy=a.y-bh.y, d=Math.hypot(dx,dy)||1;
      if(d<bh.r*2.6){
        const push=(1-d/(bh.r*2.6))*160;
        a.vx+=(dx/d)*push*dt; a.vy+=(dy/d)*push*dt;
      }
    }
    // Return fire at the nearest hostile in range.
    a.fireCd-=dt;
    if(a.fireCd<=0){
      let best=null,bestD=Infinity;
      const range=unit()*0.55;
      for(const d of demons){
        if(d.dying>0)continue;
        const dd=Math.hypot(d.x-a.x,d.y-a.y);
        if(dd<range&&dd<bestD){bestD=dd;best=d;}
      }
      if(best){ fireShot(a,best,true); a.fireCd=1.5+Math.random()*1.1; }
      else a.fireCd=0.35;
    }
    a.vx*=0.985; a.vy*=0.985;
    const cap=unit()*0.09;
    const sp=Math.hypot(a.vx,a.vy);
    if(sp>cap){a.vx=a.vx/sp*cap;a.vy=a.vy/sp*cap;}
    a.x+=a.vx*dt; a.y+=a.vy*dt;
    if(Math.hypot(a.vx,a.vy)>4)a.heading=Math.atan2(a.vy,a.vx);
    const pad=a.r*1.4;
    if(a.x<pad){a.x=pad;a.vx=Math.abs(a.vx);}
    if(a.x>W-pad){a.x=W-pad;a.vx=-Math.abs(a.vx);}
    if(a.y<pad){a.y=pad;a.vy=Math.abs(a.vy);}
    if(a.y>H-pad){a.y=H-pad;a.vy=-Math.abs(a.vy);}
  }

  // Reinforcements, so a bad stretch isn't unrecoverable.
  angelSpawnTimer+=dt;
  const noReinforcements=isBossLevel()&&bossKind()!=='devourer';
  if(!noReinforcements && angels.filter(a=>a.alive).length<c.angels && angelSpawnTimer>7){
    angelSpawnTimer=0;
    spawnAngel(isConvergence()?{kind:angels.length%2?'fleet':'celestial'}:undefined);
  }

  // ── Demons: hunt the nearest angel, or the satellite if it's closer ──
  demonSpawnTimer+=dt;
  if(demonSpawnTimer>=c.demonEvery && demons.length<c.demonCap){
    demonSpawnTimer=0;
    spawnDemon(isConvergence()?{kind:demons.length%2?'fleet':'celestial'}:undefined);
  }

  for(let i=demons.length-1;i>=0;i--){
    const d=demons[i];
    d.opacity=Math.min(1,d.opacity+dt*2.5);
    d.phase+=dt*4; d.rotation+=dt*1.2;
    if(d.dying>0){
      d.dying-=dt*3;
      if(d.dying<=0)demons.splice(i,1);
      continue;
    }
    if(d.attackCd>0)d.attackCd-=dt;

    // Pick a target: nearest living angel, or VoyaDur if it's nearer.
    let best=null, bestD=Infinity;
    for(const a of angels){
      if(!a.alive)continue;
      const dd=Math.hypot(a.x-d.x,a.y-d.y);
      if(dd<bestD){bestD=dd;best=a;}
    }
    // On the Devourer level the satellite is the objective; raiders fight
    // the escort instead of sniping it, so losing it is about the maw.
    if(voyager&&voyager.alive&&!voyager.wormhole&&!isConvergence()){
      const vd=Math.hypot(voyager.x-d.x,voyager.y-d.y);
      if(vd<bestD*0.8){bestD=vd;best=voyager;}
    }
    d.target=best;

    if(best){
      const dx=best.x-d.x, dy=best.y-d.y, dist=Math.hypot(dx,dy)||1;
      // Close to a standoff distance, then hold and fire rather than ramming.
      const standoff=unit()*0.30;
      const closing=(dist-standoff)/Math.max(1,standoff);
      const drive=Math.max(-0.7,Math.min(1,closing));
      d.vx=(dx/dist)*d.speed*drive;
      d.vy=(dy/dist)*d.speed*drive;
      // Drift sideways so they don't stack in a line.
      d.vx+=(-dy/dist)*d.speed*0.35;
      d.vy+=( dx/dist)*d.speed*0.35;

      d.fireCd-=dt;
      if(d.fireCd<=0&&dist<unit()*0.62){
        fireShot(d,best,false);
        d.fireCd=1.5+Math.random()*1.2;
      }

      // Still hurts on contact, so crowding an ally is a real threat.
      const reach=d.r+(best.r||14)+4;
      if(dist<reach && d.attackCd<=0){
        d.attackCd=0.85;
        emitParticles((d.x+best.x)/2,(d.y+best.y)/2,'rgba(255,60,40,1)',8,110);
        playSwipeHit(d.x);
        if(best===voyager){
          // The satellite has no hit points of its own — two strikes and it's gone.
          damageVoyager(d);
        }else{
          best.hp--; best.hurt=1;
          if(best.hp<=0)killAngel(best);
        }
      }
    }else{
      d.vx*=0.97; d.vy*=0.97;
    }
    d.x+=d.vx*dt; d.y+=d.vy*dt;
    if(Math.hypot(d.vx,d.vy)>4)d.heading=Math.atan2(d.vy,d.vx);
  }
}

function drawAlly(a,t){ (a.kind||warTheme())==='fleet'?drawAllyShip(a,t):drawAngel(a,t); }
function drawFoe(d,t){  (d.kind||warTheme())==='fleet'?drawFoeShip(d,t):drawDemon(d,t); }

/// Friendly cruiser: a blunt, armoured wedge with engine glow. Deliberately
/// bulkier than the raiders so the two never get confused mid-panic.
function drawAllyShip(a,t){
  if(a.opacity<=0)return;
  const r=a.r, al=Math.max(0,Math.min(1,a.opacity)), hurt=a.hurt;
  const ang=(a.heading===undefined?-Math.PI/2:a.heading);
  ctx.save();
  ctx.globalAlpha=al;

  const g=ctx.createRadialGradient(a.x,a.y,r*0.3,a.x,a.y,r*3);
  g.addColorStop(0,`rgba(${120+hurt*135},${220-hurt*90},255,0.24)`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(a.x,a.y,r*3,0,Math.PI*2);ctx.fill();

  ctx.translate(a.x,a.y);ctx.rotate(ang+Math.PI/2);

  // Engine wash
  const flare=0.7+0.3*Math.sin(t*11+a.phase);
  const eg=ctx.createLinearGradient(0,r*0.5,0,r*2.2);
  eg.addColorStop(0,`rgba(120,220,255,${0.75*flare})`);
  eg.addColorStop(1,'rgba(120,220,255,0)');
  ctx.fillStyle=eg;
  ctx.beginPath();ctx.moveTo(-r*0.34,r*0.5);ctx.lineTo(r*0.34,r*0.5);
  ctx.lineTo(r*0.16,r*2.1);ctx.lineTo(-r*0.16,r*2.1);ctx.closePath();ctx.fill();

  // Hull
  ctx.beginPath();
  ctx.moveTo(0,-r*1.35);
  ctx.lineTo(r*0.62,-r*0.15);
  ctx.lineTo(r*0.46, r*0.72);
  ctx.lineTo(-r*0.46,r*0.72);
  ctx.lineTo(-r*0.62,-r*0.15);
  ctx.closePath();
  const hg=ctx.createLinearGradient(-r*0.6,0,r*0.6,0);
  hg.addColorStop(0,hurt>0.4?'#8a5a52':'#5d6b80');
  hg.addColorStop(0.45,hurt>0.4?'#e8b0a0':'#dbe6f5');
  hg.addColorStop(1,hurt>0.4?'#7a4a44':'#46536b');
  ctx.fillStyle=hg;ctx.fill();
  ctx.strokeStyle='rgba(200,230,255,0.55)';ctx.lineWidth=1.1;ctx.stroke();

  // Wings
  ctx.fillStyle='rgba(60,80,110,0.9)';
  for(const dir of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(dir*r*0.55,-r*0.1);
    ctx.lineTo(dir*r*1.25, r*0.5);
    ctx.lineTo(dir*r*0.5,  r*0.62);
    ctx.closePath();ctx.fill();
  }

  // Cockpit
  ctx.beginPath();ctx.ellipse(0,-r*0.5,r*0.2,r*0.34,0,0,Math.PI*2);
  ctx.fillStyle=`rgba(140,235,255,${0.85+0.15*Math.sin(t*3+a.phase)})`;
  ctx.shadowColor='rgba(120,220,255,0.9)';ctx.shadowBlur=8;ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();

  if(a.alive&&a.hp<a.maxHp){
    ctx.save();ctx.globalAlpha=al;
    for(let i=0;i<a.maxHp;i++){
      ctx.beginPath();ctx.arc(a.x-(a.maxHp-1)*4+i*8,a.y+r*1.8,2.4,0,Math.PI*2);
      ctx.fillStyle=i<a.hp?'rgba(120,255,180,0.9)':'rgba(255,80,80,0.35)';ctx.fill();
    }
    ctx.restore();
  }
}

/// Enemy raider: lean, dark, forward-swept. Reads as fast even when still.
function drawFoeShip(d,t){
  const al=Math.max(0,Math.min(1,d.opacity))*(d.dying>0?d.dying:1);
  if(al<=0)return;
  const r=d.r*(d.dying>0?1+(1-d.dying)*0.55:1);
  const ang=(d.heading===undefined?Math.PI/2:d.heading);
  ctx.save();
  ctx.globalAlpha=al;

  const g=ctx.createRadialGradient(d.x,d.y,r*0.2,d.x,d.y,r*2.6);
  g.addColorStop(0,'rgba(255,70,40,0.30)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(d.x,d.y,r*2.6,0,Math.PI*2);ctx.fill();

  ctx.translate(d.x,d.y);ctx.rotate(ang+Math.PI/2);

  const flare=0.65+0.35*Math.sin(t*14+d.phase);
  const eg=ctx.createLinearGradient(0,r*0.4,0,r*1.9);
  eg.addColorStop(0,`rgba(255,90,40,${0.8*flare})`);
  eg.addColorStop(1,'rgba(255,90,40,0)');
  ctx.fillStyle=eg;
  ctx.beginPath();ctx.moveTo(-r*0.26,r*0.4);ctx.lineTo(r*0.26,r*0.4);
  ctx.lineTo(r*0.1,r*1.8);ctx.lineTo(-r*0.1,r*1.8);ctx.closePath();ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0,-r*1.5);
  ctx.lineTo(r*0.34,-r*0.3);
  ctx.lineTo(r*1.15, r*0.62);
  ctx.lineTo(r*0.28, r*0.42);
  ctx.lineTo(0,      r*0.72);
  ctx.lineTo(-r*0.28,r*0.42);
  ctx.lineTo(-r*1.15,r*0.62);
  ctx.lineTo(-r*0.34,-r*0.3);
  ctx.closePath();
  const hg=ctx.createLinearGradient(0,-r*1.4,0,r*0.7);
  hg.addColorStop(0,'#6e1414');
  hg.addColorStop(0.5,'#3a0a12');
  hg.addColorStop(1,'#170307');
  ctx.fillStyle=hg;ctx.fill();
  ctx.strokeStyle='rgba(255,80,50,0.55)';ctx.lineWidth=1;ctx.stroke();

  const glow=0.6+0.4*Math.sin(d.phase*2);
  ctx.beginPath();ctx.ellipse(0,-r*0.55,r*0.3,r*0.14,0,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,${150*glow},50,${glow})`;
  ctx.shadowColor='rgba(255,90,20,1)';ctx.shadowBlur=9;ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();

  if(d.swipeHits>0&&d.dying<=0){
    ctx.beginPath();
    ctx.arc(d.x,d.y,r+7,-Math.PI/2,-Math.PI/2+Math.PI*2*(d.swipeHits/d.hitsToKill));
    ctx.strokeStyle='rgba(0,255,200,0.8)';ctx.lineWidth=2.5;ctx.stroke();
  }
  if(d.target&&d.dying<=0){
    ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.target.x,d.target.y);
    ctx.strokeStyle='rgba(255,60,40,0.12)';ctx.lineWidth=1;
    ctx.setLineDash([4,7]);ctx.stroke();ctx.setLineDash([]);
  }
}

function drawAngel(a,t){
  if(a.opacity<=0)return;
  const bob=Math.sin(a.phase)*2.5;
  const y=a.y+bob, r=a.r;
  const al=Math.max(0,Math.min(1,a.opacity));
  ctx.save();
  ctx.globalAlpha=al;

  // Aura
  const g=ctx.createRadialGradient(a.x,y,r*0.3,a.x,y,r*3.2);
  const hurt=a.hurt;
  g.addColorStop(0,`rgba(255,${240-hurt*140},${200-hurt*120},0.30)`);
  g.addColorStop(0.45,'rgba(150,200,255,0.10)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(a.x,y,r*3.2,0,Math.PI*2);ctx.fill();

  // Wings
  ctx.save();ctx.translate(a.x,y);
  const flap=0.35+Math.sin(a.phase*1.6)*0.16;
  for(const dir of [-1,1]){
    ctx.save();ctx.scale(dir,1);ctx.rotate(-flap);
    ctx.beginPath();
    ctx.moveTo(r*0.25,-r*0.1);
    ctx.quadraticCurveTo(r*1.7,-r*1.5, r*2.25, r*0.15);
    ctx.quadraticCurveTo(r*1.5, r*0.15, r*0.3, r*0.45);
    ctx.closePath();
    const wg=ctx.createLinearGradient(r*0.3,0,r*2.2,0);
    wg.addColorStop(0,'rgba(255,255,255,0.85)');
    wg.addColorStop(1,'rgba(170,210,255,0.18)');
    ctx.fillStyle=wg;ctx.fill();
    ctx.strokeStyle='rgba(220,240,255,0.5)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // Body
  const bg=ctx.createRadialGradient(a.x-r*0.25,y-r*0.3,r*0.1,a.x,y,r);
  bg.addColorStop(0,'#ffffff');
  bg.addColorStop(0.6,hurt>0.4?'#ffd0c0':'#e8f2ff');
  bg.addColorStop(1,hurt>0.4?'#c07060':'#8fb8e8');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(a.x,y,r,0,Math.PI*2);ctx.fill();

  // Halo
  ctx.beginPath();ctx.ellipse(a.x,y-r*1.35,r*0.72,r*0.24,0,0,Math.PI*2);
  ctx.strokeStyle=`rgba(255,235,150,${0.9*al})`;ctx.lineWidth=2.4;
  ctx.shadowColor='rgba(255,220,120,0.9)';ctx.shadowBlur=10;ctx.stroke();
  ctx.shadowBlur=0;

  // Health pips
  if(a.alive&&a.hp<a.maxHp){
    for(let i=0;i<a.maxHp;i++){
      ctx.beginPath();
      ctx.arc(a.x-(a.maxHp-1)*4+i*8, y+r*1.75, 2.4, 0, Math.PI*2);
      ctx.fillStyle=i<a.hp?'rgba(120,255,180,0.9)':'rgba(255,80,80,0.35)';
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawDemon(d,t){
  const al=Math.max(0,Math.min(1,d.opacity))*(d.dying>0?d.dying:1);
  if(al<=0)return;
  const r=d.r*(d.dying>0?1+(1-d.dying)*0.6:1);
  ctx.save();
  ctx.globalAlpha=al;

  const g=ctx.createRadialGradient(d.x,d.y,r*0.2,d.x,d.y,r*2.8);
  g.addColorStop(0,'rgba(255,70,30,0.35)');
  g.addColorStop(0.5,'rgba(150,10,40,0.14)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(d.x,d.y,r*2.8,0,Math.PI*2);ctx.fill();

  ctx.save();ctx.translate(d.x,d.y);

  // Ragged wings
  const flap=0.3+Math.sin(d.phase)*0.22;
  for(const dir of [-1,1]){
    ctx.save();ctx.scale(dir,1);ctx.rotate(flap);
    ctx.beginPath();
    ctx.moveTo(r*0.2,-r*0.2);
    ctx.lineTo(r*1.9,-r*1.1);
    ctx.lineTo(r*1.5,-r*0.15);
    ctx.lineTo(r*2.0, r*0.35);
    ctx.lineTo(r*1.15, r*0.2);
    ctx.lineTo(r*1.35, r*0.95);
    ctx.lineTo(r*0.3, r*0.4);
    ctx.closePath();
    ctx.fillStyle='rgba(48,8,16,0.92)';ctx.fill();
    ctx.strokeStyle='rgba(255,70,40,0.45)';ctx.lineWidth=1;ctx.stroke();
    ctx.restore();
  }

  // Body
  const bg=ctx.createRadialGradient(-r*0.2,-r*0.25,r*0.1,0,0,r);
  bg.addColorStop(0,'#8a1616');
  bg.addColorStop(0.65,'#3d0810');
  bg.addColorStop(1,'#140206');
  ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();

  // Horns
  ctx.fillStyle='#20040a';
  for(const dir of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(dir*r*0.45,-r*0.72);
    ctx.quadraticCurveTo(dir*r*1.15,-r*1.55, dir*r*0.55,-r*1.75);
    ctx.quadraticCurveTo(dir*r*0.72,-r*1.15, dir*r*0.12,-r*0.85);
    ctx.closePath();ctx.fill();
  }

  // Eyes
  const glow=0.65+0.35*Math.sin(d.phase*2);
  for(const dir of [-1,1]){
    ctx.beginPath();ctx.ellipse(dir*r*0.34,-r*0.1,r*0.19,r*0.13,dir*0.3,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,${140*glow},40,${glow})`;
    ctx.shadowColor='rgba(255,90,20,1)';ctx.shadowBlur=9;ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.restore();

  // Damage arc, same language as the black holes
  if(d.swipeHits>0&&d.dying<=0){
    ctx.beginPath();
    ctx.arc(d.x,d.y,r+7,-Math.PI/2,-Math.PI/2+Math.PI*2*(d.swipeHits/d.hitsToKill));
    ctx.strokeStyle='rgba(0,255,200,0.8)';ctx.lineWidth=2.5;ctx.stroke();
  }

  // Line to whatever it's hunting
  if(d.target&&d.dying<=0){
    ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.target.x,d.target.y);
    ctx.strokeStyle='rgba(255,60,40,0.12)';ctx.lineWidth=1;
    ctx.setLineDash([4,7]);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.restore();
}

// Plays on the main canvas using the game's own draw functions rather than a
// separate illustrated panel, so the shapes taught are the shapes played.

const PROGRESS_KEY='fing_progress';
function savedProgress(){
  try{const n=parseInt(localStorage.getItem(PROGRESS_KEY),10);return n>1?n:1;}catch(e){return 1;}
}
function saveProgress(level){
  try{
    if(level>savedProgress())localStorage.setItem(PROGRESS_KEY,String(level));
  }catch(e){}
}

const TUTORIAL_KEY='fing_tutorial_seen';
function tutorialSeen(){
  try{return localStorage.getItem(TUTORIAL_KEY)==='1';}catch(e){return false;}
}
function markTutorialSeen(){
  try{localStorage.setItem(TUTORIAL_KEY,'1');}catch(e){}
}

  {

function startTutorial(){
  state=STATE.TUTORIAL;
  initAudio();
  resumeAudio();   // covers iOS 'interrupted' as well as 'suspended'
  currentLevel=1; applyLevelConfig(1);
  blackHoles=[];celestials=[];particles=[];swipeTrails=[];scorePopups=[];
  angels=[];demons=[];voyager=null;
  for(let i=0;i<4;i++)spawnCelestial();   // keep focus on the lesson
  document.body.classList.add('tutorial');
  tut={step:0,t:0,fingers:[],demo:[],voy:null,total:TUTORIAL_STEPS.length};
  buildTutorialStep();
  showTutorialOverlay();
}

function endTutorial(startPlaying){
  markTutorialSeen();
  document.body.classList.remove('tutorial');
  tut=null;
  const o=document.getElementById('tutorial-overlay');
  if(o)o.classList.add('hidden');
  blackHoles=[];particles=[];swipeTrails=[];scorePopups=[];voyager=null;
  if(startPlaying)startGame(pendingStartLevel||1);
  else{state=STATE.MENU;document.getElementById('screen-overlay').classList.remove('hidden');
       if(typeof paintBestLine==='function')paintBestLine();}
}

function nextTutorialStep(){
  if(!tut)return;
  tut.step++;
  if(tut.step>=TUTORIAL_STEPS.length){endTutorial(true);return;}
  tut.t=0;
  buildTutorialStep();
  paintTutorialOverlay();
}

/// Each step stages its own props. Radii are fractions of the short edge, the
/// same as the real spawner, so nothing looks off-scale.
function buildTutorialStep(){
  const U=unit();
  blackHoles=[];swipeTrails=[];particles=[];scorePopups=[];
  tut.fingers=[];tut.voy=null;

  const mk=(x,y,r,hits)=>({
    x,y,r,maxR:U*0.45,growRate:0,swipeHits:0,hitsToKill:hits,
    vx:0,vy:0,drifts:false,canSplit:false,
    rotation:0,rotSpeed:1.0,pulsePhase:0,
    formingTimer:0,forming:false,formDuration:0.6,
    opacity:1,shrinking:false,shrinkSpeed:0,consumed:0,
  });

  switch(tut.step){
    case 0: {   // forming and growing
      const bh=mk(W*0.5,H*0.44,U*0.06,3);
      bh.forming=true;bh.opacity=0;bh.growRate=U*0.055;
      blackHoles.push(bh);
      break;
    }
    case 1: {   // one swipe, one kill
      blackHoles.push(mk(W*0.5,H*0.44,U*0.13,1));
      tut.fingers.push({from:{x:W*0.22,y:H*0.52},to:{x:W*0.78,y:H*0.36},
                        delay:1.0,dur:0.85,loop:2.0,hit:0});
      break;
    }
    case 2: {   // several passes, damage arc filling
      blackHoles.push(mk(W*0.5,H*0.44,U*0.17,4));
      for(let i=0;i<4;i++){
        const up=i%2===0;
        tut.fingers.push({
          from:{x:W*0.20,y:H*(up?0.52:0.36)},
          to:  {x:W*0.80,y:H*(up?0.36:0.52)},
          delay:0.8+i*0.75,dur:0.5,loop:0,hit:0});
      }
      break;
    }
    case 3: {   // shove the satellite clear
      blackHoles.push(mk(W*0.70,H*0.50,U*0.15,6));
      tut.voy={x:W*0.42,y:H*0.44,r:28,alive:true,opacity:1,hp:3,maxHp:3,hurt:0,
               blinkPhase:0,angle:0,vx:0,vy:0,wormhole:false,pushed:0};
      tut.fingers.push({from:{x:W*0.50,y:H*0.44},to:{x:W*0.16,y:H*0.34},
                        delay:1.2,dur:0.7,loop:2.6,hit:0,pushes:true});
      break;
    }
    case 4: {   // two fingers at once
      blackHoles.push(mk(W*0.30,H*0.38,U*0.12,1));
      blackHoles.push(mk(W*0.70,H*0.54,U*0.12,1));
      tut.fingers.push({from:{x:W*0.12,y:H*0.30},to:{x:W*0.48,y:H*0.46},
                        delay:1.0,dur:0.7,loop:2.4,hit:0});
      tut.fingers.push({from:{x:W*0.88,y:H*0.62},to:{x:W*0.52,y:H*0.46},
                        delay:1.0,dur:0.7,loop:2.4,hit:1});
      break;
    }
  }
}

function updateTutorial(dt){
  if(!tut)return;
  tut.t+=dt;
  updateStars(dt);
  updateParticles(dt);
  updateScorePopups(dt);
  for(const cel of celestials){cel.x+=cel.vx*dt;cel.y+=cel.vy*dt;cel.rotation+=cel.rotSpeed*dt;}

  // Black holes: forming fade-in, growth, and death shrink.
  for(let i=blackHoles.length-1;i>=0;i--){
    const bh=blackHoles[i];
    if(bh.forming){
      bh.formingTimer+=dt;
      bh.opacity=Math.min(1,bh.formingTimer/bh.formDuration);
      if(bh.formingTimer>=bh.formDuration){bh.forming=false;bh.opacity=1;}
    }else if(bh.shrinking){
      bh.r-=bh.shrinkSpeed*dt;
      if(bh.r<=2){blackHoles.splice(i,1);continue;}
    }else if(bh.growRate){
      bh.r=Math.min(bh.maxR,bh.r+bh.growRate*dt);
    }
    bh.rotation+=bh.rotSpeed*dt;
  }

  // Ghost fingers trace their swipe, landing a hit at the midpoint.
  for(const f of tut.fingers){
    const cycle=f.loop>0?(f.delay+f.dur+f.loop):Infinity;
    let local=tut.t-f.delay;
    if(f.loop>0&&tut.t>=f.delay)local=((tut.t-f.delay)%cycle);
    f.active=local>=0&&local<=f.dur;
    f.p=f.active?Math.min(1,local/f.dur):-1;

    if(f.active){
      const e=f.p<0.5?2*f.p*f.p:1-Math.pow(-2*f.p+2,2)/2;   // ease in-out
      f.x=f.from.x+(f.to.x-f.from.x)*e;
      f.y=f.from.y+(f.to.y-f.from.y)*e;
      if(!f.trail||f.lastP>f.p){f.trail={points:[],life:1};swipeTrails.push(f.trail);f.landed=false;}
      f.trail.points.push({x:f.x,y:f.y});
      f.trail.life=1;

      if(!f.landed&&f.p>0.5){
        f.landed=true;
        if(f.pushes&&tut.voy){
          const dx=f.to.x-f.from.x,dy=f.to.y-f.from.y,d=Math.hypot(dx,dy)||1;
          tut.voy.vx=dx/d*230;tut.voy.vy=dy/d*230;tut.voy.pushed=1;
          emitParticles(tut.voy.x,tut.voy.y,'rgba(50,255,120,1)',8,80);
        }else{
          const bh=blackHoles[Math.min(f.hit,blackHoles.length-1)];
          if(bh&&!bh.shrinking){
            bh.swipeHits++;
            emitParticles(f.x,f.y,'rgba(0,255,200,1)',9,110);
            if(bh.swipeHits>=bh.hitsToKill){
              bh.shrinking=true;bh.shrinkSpeed=Math.max(90,bh.r*2.4);
              emitParticles(bh.x,bh.y,'rgba(255,200,100,1)',26,190);
              addScorePopup(bh.x,bh.y,Math.floor(bh.r*2),'rgba(255,220,120,1)');
            }
          }
        }
      }
    }else{ f.trail=null; f.landed=false; }
    f.lastP=f.p;
  }

  // Demo satellite drifts back toward centre after a shove.
  if(tut.voy){
    const v=tut.voy;
    v.blinkPhase+=dt*3;
    if(v.pushed>0)v.pushed=Math.max(0,v.pushed-dt);
    v.x+=v.vx*dt; v.y+=v.vy*dt;
    v.vx*=0.94; v.vy*=0.94;
    const tx=W*0.42, ty=H*0.44;
    v.vx+=(tx-v.x)*0.5*dt; v.vy+=(ty-v.y)*0.5*dt;
  }

  if(tut.t>=TUTORIAL_STEPS[tut.step].dur)nextTutorialStep();
}

function renderTutorial(t){
  const secs=t/1000;
  if(nebulaCanvas)ctx.drawImage(nebulaCanvas,0,0);
  else{ctx.clearRect(0,0,W,H);ctx.fillStyle='#030308';ctx.fillRect(0,0,W,H);}
  drawStars(secs);
  for(const cel of celestials)drawCelestial(cel,secs);
  for(const bh of blackHoles)drawBlackHole(bh,secs);
  if(tut&&tut.voy)drawVoyager(tut.voy,secs);
  drawParticles();
  drawSwipeTrails(secs);
  drawScorePopups();

  // Ghost fingers, drawn last so they read as being above the board.
  if(tut){
    for(const f of tut.fingers){
      if(!f.active)continue;
      const fade=Math.sin(Math.min(1,f.p)*Math.PI);
      ctx.save();
      ctx.globalAlpha=Math.max(0,fade);
      const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,26);
      g.addColorStop(0,'rgba(255,255,255,0.55)');
      g.addColorStop(0.5,'rgba(140,230,255,0.22)');
      g.addColorStop(1,'rgba(140,230,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,26,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(f.x,f.y,11,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.9)';ctx.fill();
      ctx.strokeStyle='rgba(120,220,255,0.9)';ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
    }
  }
}

// ─── VOYADUR 1 ───
function spawnVoyager(){
  const margin=140;
  const sx=margin+Math.random()*(W-margin*2);
  const sy=margin+Math.random()*(H-margin*2);
  voyager={
    x:sx,y:sy,
    vx:(Math.random()-0.5)*8,
    vy:(Math.random()-0.5)*8,
    r:28, // double size
    rotation:Math.random()*Math.PI*2,
    rotSpeed:0.15,
    beingSucked:null,
    suckProgress:0,
    opacity:0, // starts invisible, fades in from wormhole
    alive:true,
    hp:VOYAGER_MAX_HP, maxHp:VOYAGER_MAX_HP, hurt:0,
    blinkPhase:Math.random()*Math.PI*2,
    // Wormhole animation
    wormhole:true,
    wormholeTimer:0,
    wormholeDuration:2.0,
    wormholeX:sx,
    wormholeY:sy,
  };
  voyagerSurvivedRound=true;
}

function drawWormhole(v,t){
  if(!v||!v.wormhole)return;
  const progress=Math.min(1,v.wormholeTimer/v.wormholeDuration);
  const wx=v.wormholeX,wy=v.wormholeY;

  // Outer swirl
  const maxR=50;
  const r=maxR*(1-progress*0.6);
  const alpha=(1-progress);

  // Swirling rings
  ctx.save();
  ctx.translate(wx,wy);
  ctx.rotate(t*3);
  for(let i=0;i<3;i++){
    const ringR=r*(0.6+i*0.25);
    const ringAlpha=alpha*(0.4-i*0.1);
    ctx.beginPath();
    ctx.ellipse(0,0,ringR,ringR*0.6,i*0.5,0,Math.PI*2);
    ctx.strokeStyle=`rgba(100,200,255,${ringAlpha})`;
    ctx.lineWidth=2-i*0.4;
    ctx.stroke();
  }
  ctx.restore();

  // Inner glow
  const glow=ctx.createRadialGradient(wx,wy,0,wx,wy,r);
  glow.addColorStop(0,`rgba(150,220,255,${alpha*0.4})`);
  glow.addColorStop(0.4,`rgba(80,150,220,${alpha*0.2})`);
  glow.addColorStop(0.7,`rgba(40,80,180,${alpha*0.08})`);
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;
  ctx.beginPath();ctx.arc(wx,wy,r,0,Math.PI*2);ctx.fill();

  // Center bright spot
  ctx.beginPath();ctx.arc(wx,wy,3*(1-progress),0,Math.PI*2);
  ctx.fillStyle=`rgba(200,240,255,${alpha*0.8})`;
  ctx.fill();

  // Sparkle particles spiraling in
  for(let i=0;i<8;i++){
    const a=t*5+i*0.785;
    const sd=r*(0.3+0.7*(1-progress))*Math.sin(t*3+i*2);
    const sx=wx+Math.cos(a)*sd,sy=wy+Math.sin(a)*sd*0.6;
    ctx.beginPath();ctx.arc(sx,sy,1+Math.sin(t*6+i)*0.5,0,Math.PI*2);
    ctx.fillStyle=`rgba(180,220,255,${alpha*0.5})`;ctx.fill();
  }
}

function drawVoyager(v,t){
  if(!v||!v.alive)return;

  // Draw wormhole if still animating
  if(v.wormhole)drawWormhole(v,t);

  ctx.save();
  ctx.globalAlpha=v.opacity;
  ctx.translate(v.x,v.y);

  // Scale factor for double-size drawing
  const s=2;
  ctx.scale(s,s);
  ctx.rotate(v.rotation);

  // ── Main bus (central body) ──
  ctx.fillStyle='#c8cdd4';
  ctx.fillRect(-4,-5,8,10);

  // Antenna dish (top)
  ctx.fillStyle='#e0e4ea';
  ctx.beginPath();
  ctx.arc(0,-8,6,Math.PI,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#a0a8b4';
  ctx.lineWidth=0.5;
  ctx.stroke();
  // Dish feed
  ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,-13);
  ctx.strokeStyle='#888';ctx.lineWidth=0.8;ctx.stroke();
  ctx.beginPath();ctx.arc(0,-13,1,0,Math.PI*2);
  ctx.fillStyle='#aab';ctx.fill();

  // ── RTG boom (extending down-right) ──
  ctx.beginPath();ctx.moveTo(3,4);ctx.lineTo(12,12);
  ctx.strokeStyle='#999';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#555';
  ctx.fillRect(10,10,5,4);

  // ── Magnetometer boom (extending down-left) ──
  ctx.beginPath();ctx.moveTo(-3,3);ctx.lineTo(-14,10);
  ctx.strokeStyle='#888';ctx.lineWidth=0.6;ctx.stroke();

  // ── Solar/science boom (left) ──
  ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(-16,-2);
  ctx.strokeStyle='#777';ctx.lineWidth=0.6;ctx.stroke();

  // ── Voyager golden record (small circle on body) ──
  ctx.beginPath();ctx.arc(0,0,2.5,0,Math.PI*2);
  ctx.fillStyle='#d4a520';ctx.fill();
  ctx.strokeStyle='#b8860b';ctx.lineWidth=0.5;ctx.stroke();

  // ── Thrusters (small nozzles at bottom) ──
  ctx.fillStyle='#778';
  ctx.fillRect(-2,5,1.5,3);
  ctx.fillRect(0.5,5,1.5,3);

  ctx.restore();

  // ── Status indicator glow (outside rotation/scale) ──
  const blink=0.4+0.6*Math.abs(Math.sin(t*2+v.blinkPhase));
  ctx.beginPath();
  ctx.arc(v.x,v.y-36,3,0,Math.PI*2);
  ctx.fillStyle=`rgba(50,255,120,${blink*v.opacity})`;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(v.x,v.y-36,7,0,Math.PI*2);
  ctx.fillStyle=`rgba(50,255,120,${blink*0.12*v.opacity})`;
  ctx.fill();

  // Label
  ctx.save();
  ctx.globalAlpha=v.opacity*0.6;
  ctx.font='9px Orbitron, monospace';
  ctx.textAlign='center';
  ctx.fillStyle='rgba(150,220,180,0.8)';
  ctx.fillText('VOYADUR 1',v.x,v.y+40);
  ctx.restore();

  // Double points aura when alive — turns amber as it takes damage
  if(v.alive&&v.opacity>0.5){
    const auraR=36+Math.sin(t*3)*4;
    const maxHp=v.maxHp||VOYAGER_MAX_HP;
    const dmg=1-(v.hp||maxHp)/maxHp;
    ctx.beginPath();ctx.arc(v.x,v.y,auraR,0,Math.PI*2);
    ctx.strokeStyle=`rgba(${50+205*dmg},255,${120-80*dmg},${0.12+0.06*Math.sin(t*4)})`;
    ctx.lineWidth=1.5;ctx.stroke();
  }

  // Hit flash
  if(v.hurt>0){
    ctx.beginPath();ctx.arc(v.x,v.y,34,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,140,60,${v.hurt*0.85})`;ctx.lineWidth=3;ctx.stroke();
  }

  // Health pips, only once it has actually been hit
  if(v.alive&&v.hp<(v.maxHp||VOYAGER_MAX_HP)){
    ctx.save();ctx.globalAlpha=v.opacity;
    const pips=v.maxHp||VOYAGER_MAX_HP;
    for(let i=0;i<pips;i++){
      ctx.beginPath();
      ctx.arc(v.x-(pips-1)*5+i*10, v.y+52, 3, 0, Math.PI*2);
      ctx.fillStyle=i<v.hp?'rgba(120,255,180,0.95)':'rgba(255,80,80,0.35)';
      ctx.fill();
    }
    ctx.restore();
  }
}

/// One point of damage from any source. Returns true if that was the last one.
/// `from` is only used to shove the satellite clear of a black hole so it gets
/// a fighting chance instead of being eaten the instant it drifts in.
function damageVoyager(from){
  if(!voyager||!voyager.alive)return false;
  if(voyager.invuln>0)return false;
  voyager.hp--;
  voyager.hurt=1;
  voyager.invuln=0.8;          // brief mercy window so one hazard can't chain-hit
  emitParticles(voyager.x,voyager.y,'rgba(255,180,80,1)',14,120);
  playSwipeHit(voyager.x);
  if(window.nativeHaptic)window.nativeHaptic('destroy');
  if(voyager.hp<=0){destroyVoyager();return true;}
  // Kicked clear of whatever just hit it.
  if(from){
    const dx=voyager.x-from.x, dy=voyager.y-from.y, d=Math.hypot(dx,dy)||1;
    const kick=(from.r||30)*3+80;
    voyager.x+=(dx/d)*(from.r||30)*1.2;
    voyager.y+=(dy/d)*(from.r||30)*1.2;
    voyager.vx=(dx/d)*kick; voyager.vy=(dy/d)*kick;
  }
  voyager.beingSucked=null; voyager.suckProgress=0; voyager.opacity=1;
  scorePopups.push({x:voyager.x,y:voyager.y-44,
    pts:`VOYADUR HIT \u2022 ${voyager.hp} LEFT`,
    color:'rgba(255,170,60,1)',life:1.4,vy:-26,isText:true});
  return false;
}

function destroyVoyager(){
  if(!voyager||!voyager.alive)return;
  voyager.alive=false;
  voyagerSurvivedRound=false;
  emitParticles(voyager.x,voyager.y,'rgba(200,220,180,1)',25,140);
  emitParticles(voyager.x,voyager.y,'rgba(255,200,50,1)',15,100);
  addScorePopup(voyager.x,voyager.y-30,0,'rgba(255,100,100,1)');
  scorePopups.push({x:voyager.x,y:voyager.y-50,
    pts:isBossLevel()?'VOYADUR 1 LOST':'VOYADUR LOST \u2022 NO x2 THIS ROUND',
    color:'rgba(255,80,80,1)',life:2,vy:-25,isText:true});
  // On a convergence level the satellite is the objective, not a bonus, so
  // losing it fails the level even in Easy.
  if(isFinalBoss())endGame('VoyaDur 1 could not carry the final signal');
  else if(isBossLevel()&&bossKind()==='devourer'&&!isFreeBoss())endGame('VoyaDur 1 was swallowed');
}

// ─── BLACK HOLE ───
function spawnBlackHole(opts){
  opts=opts||{};
  const U=unit();
  const r=opts.r!==undefined?opts.r:U*0.048+Math.random()*U*0.022;
  const margin=U*0.16;
  const x=opts.x!==undefined?opts.x:margin+Math.random()*(W-margin*2);
  const y=opts.y!==undefined?opts.y:margin+Math.random()*(H-margin*2);
  // Drifting holes force you to track a moving target instead of camping one spot.
  const drifts=opts.drifts!==undefined?opts.drifts:(Math.random()<LV.drift);
  const speed=drifts?U*(0.016+Math.random()*0.026):0;
  const ang=opts.ang!==undefined?opts.ang:Math.random()*Math.PI*2;
  const bh={x,y,r,
    maxR:U*LV.maxR,
    growRate:U*LV.grow*(0.88+Math.random()*0.28),
    swipeHits:0,
    hitsToKill:opts.hits!==undefined?opts.hits:LV.hits,
    vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed, drifts,
    canSplit:opts.canSplit!==undefined?opts.canSplit:(Math.random()<LV.split),
    rotation:0,rotSpeed:0.8+Math.random()*1.2,pulsePhase:Math.random()*Math.PI*2,
    formingTimer:0,forming:true,formDuration:Math.max(0.32,1.2-currentLevel*0.06),
    opacity:0,shrinking:false,shrinkSpeed:0,consumed:0};
  blackHoles.push(bh);
  startBHDrone(bh);
  playSpawnSound();
  return bh;
}

function spawnBlackHoleBatch(){
  // The cap is what keeps late levels hard instead of hopeless: pressure comes
  // from tougher, faster-growing holes, not from an unclearable pile.
  const room=LV.cap-blackHoles.length;
  if(room<=0)return;
  const want=LV.bMin+Math.floor(Math.random()*(LV.bMax-LV.bMin+1));
  for(let i=0;i<Math.min(want,room);i++)spawnBlackHole();
}

// Destroying a splitter buys you nothing unless you finish both halves.
function splitBlackHole(bh){
  if(blackHoles.length>=LV.cap+2)return;
  const U=unit(), childR=Math.max(U*0.035,bh.r*0.42);
  const base=Math.random()*Math.PI*2;
  for(let i=0;i<2;i++){
    const ang=base+i*Math.PI;
    spawnBlackHole({
      x:Math.max(childR,Math.min(W-childR,bh.x+Math.cos(ang)*bh.r*0.6)),
      y:Math.max(childR,Math.min(H-childR,bh.y+Math.sin(ang)*bh.r*0.6)),
      r:childR, ang, drifts:true, canSplit:false,
      hits:Math.max(2,Math.ceil(LV.hits*0.4)),
    });
  }
  scorePopups.push({x:bh.x,y:bh.y-30,pts:'SPLIT!',color:'rgba(255,90,120,1)',life:1.1,vy:-30,isText:true});
}

// ─── MEGA COMET (once per level) ───
function spawnMegaComet(){
  const r=16;
  // Always cross through the middle area so it's visible
  // Pick entry from one edge, exit toward opposite side
  const side=Math.floor(Math.random()*4);
  let x,y,tx,ty;
  const margin=50;
  if(side===0){      // enter left
    x=-margin; y=H*0.2+Math.random()*H*0.6;
    tx=W+margin; ty=H*0.2+Math.random()*H*0.6;
  } else if(side===1){ // enter right
    x=W+margin; y=H*0.2+Math.random()*H*0.6;
    tx=-margin; ty=H*0.2+Math.random()*H*0.6;
  } else if(side===2){ // enter top
    x=W*0.2+Math.random()*W*0.6; y=-margin;
    tx=W*0.2+Math.random()*W*0.6; ty=H+margin;
  } else {             // enter bottom
    x=W*0.2+Math.random()*W*0.6; y=H+margin;
    tx=W*0.2+Math.random()*W*0.6; ty=-margin;
  }
  const dx=tx-x, dy=ty-y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const speed=40+Math.random()*25; // much slower — takes ~5-8 seconds to cross
  const vx=(dx/dist)*speed, vy=(dy/dist)*speed;
  megaComet={
    x,y,r,vx,vy,
    rotation:0,rotSpeed:2,
    tailAngle:Math.atan2(vy,vx),
    opacity:1,
    active:true,
    trail:[], // position history for the long tail
  };
}

function drawMegaComet(mc,t){
  if(!mc||!mc.active)return;
  ctx.save();

  // Tail points OPPOSITE to travel direction
  // Velocity is (vx, vy), so tail direction is (-vx, -vy) normalized
  const vMag=Math.sqrt(mc.vx*mc.vx+mc.vy*mc.vy);
  const tdx=-mc.vx/vMag, tdy=-mc.vy/vMag;
  // Perpendicular to tail (for width)
  const tpx=-tdy, tpy=tdx;

  // ── LONG FLOWING TAIL ──
  const tailLen=mc.r*35;

  // Wide outer tail glow
  for(let layer=0;layer<3;layer++){
    const width=mc.r*(3-layer*0.7);
    const alpha=[0.08,0.12,0.2][layer];
    const colors=[
      [`rgba(80,120,255,${alpha})`,`rgba(60,80,200,${alpha*0.3})`,`rgba(40,40,150,0)`],
      [`rgba(100,180,255,${alpha})`,`rgba(60,120,220,${alpha*0.4})`,`rgba(30,60,180,0)`],
      [`rgba(200,220,255,${alpha})`,`rgba(120,180,255,${alpha*0.5})`,`rgba(60,100,220,0)`],
    ][layer];
    const len=tailLen*(1-layer*0.15);

    ctx.beginPath();
    // Start at one side of the comet head
    ctx.moveTo(mc.x+tpx*width,mc.y+tpy*width);
    // Curve outward then taper to tail tip
    const cx1=mc.x+tdx*len*0.3+tpx*width*1.5;
    const cy1=mc.y+tdy*len*0.3+tpy*width*1.5;
    const cx2=mc.x+tdx*len*0.7+tpx*width*0.3;
    const cy2=mc.y+tdy*len*0.7+tpy*width*0.3;
    const ex=mc.x+tdx*len, ey=mc.y+tdy*len;
    ctx.bezierCurveTo(cx1,cy1,cx2,cy2,ex,ey);
    // Other side — mirror
    const cx3=mc.x+tdx*len*0.7-tpx*width*0.3;
    const cy3=mc.y+tdy*len*0.7-tpy*width*0.3;
    const cx4=mc.x+tdx*len*0.3-tpx*width*1.5;
    const cy4=mc.y+tdy*len*0.3-tpy*width*1.5;
    ctx.bezierCurveTo(cx3,cy3,cx4,cy4,mc.x-tpx*width,mc.y-tpy*width);
    ctx.closePath();

    const grad=ctx.createLinearGradient(mc.x,mc.y,ex,ey);
    grad.addColorStop(0,colors[0]);
    grad.addColorStop(0.4,colors[1]);
    grad.addColorStop(1,colors[2]);
    ctx.fillStyle=grad;
    ctx.fill();
  }

  // Bright inner plasma stream
  ctx.beginPath();
  ctx.moveTo(mc.x,mc.y);
  const innerLen=tailLen*0.7;
  const wave1=Math.sin(t*5)*mc.r*0.5;
  const wave2=Math.sin(t*7+2)*mc.r*0.3;
  const imx=mc.x+tdx*innerLen*0.5+tpx*wave1;
  const imy=mc.y+tdy*innerLen*0.5+tpy*wave1;
  const iex=mc.x+tdx*innerLen+tpx*wave2;
  const iey=mc.y+tdy*innerLen+tpy*wave2;
  ctx.quadraticCurveTo(imx,imy,iex,iey);
  ctx.strokeStyle='rgba(180,220,255,0.35)';
  ctx.lineWidth=mc.r*0.8;
  ctx.lineCap='round';
  ctx.stroke();

  // Secondary thin stream with slight offset
  ctx.beginPath();
  ctx.moveTo(mc.x+tpx*mc.r*0.3,mc.y+tpy*mc.r*0.3);
  const s2x=mc.x+tdx*innerLen*0.6+tpx*(wave2+mc.r*0.3);
  const s2y=mc.y+tdy*innerLen*0.6+tpy*(wave2+mc.r*0.3);
  ctx.quadraticCurveTo(
    mc.x+tdx*innerLen*0.3+tpx*mc.r*0.5,mc.y+tdy*innerLen*0.3+tpy*mc.r*0.5,
    s2x,s2y);
  ctx.strokeStyle='rgba(100,160,255,0.2)';
  ctx.lineWidth=mc.r*0.4;
  ctx.lineCap='round';
  ctx.stroke();

  // ── Dust tail (angled slightly off main tail) ──
  const dustAngle=Math.atan2(tdy,tdx)+0.25;
  const dustLen=tailLen*0.5;
  const ddx=Math.cos(dustAngle), ddy=Math.sin(dustAngle);
  const dpx=-ddy, dpy=ddx; // dust perpendicular
  ctx.beginPath();
  ctx.moveTo(mc.x,mc.y);
  ctx.quadraticCurveTo(
    mc.x+ddx*dustLen*0.5+dpx*mc.r*2,mc.y+ddy*dustLen*0.5+dpy*mc.r*2,
    mc.x+ddx*dustLen,mc.y+ddy*dustLen);
  ctx.strokeStyle='rgba(200,180,120,0.1)';
  ctx.lineWidth=mc.r*2;
  ctx.lineCap='round';
  ctx.stroke();

  // ── COMA (bright halo around head) ──
  const coma=ctx.createRadialGradient(mc.x,mc.y,mc.r*0.5,mc.x,mc.y,mc.r*6);
  coma.addColorStop(0,'rgba(255,240,200,0.4)');
  coma.addColorStop(0.2,'rgba(200,220,255,0.15)');
  coma.addColorStop(0.5,'rgba(100,150,255,0.05)');
  coma.addColorStop(1,'rgba(50,80,200,0)');
  ctx.fillStyle=coma;
  ctx.beginPath();ctx.arc(mc.x,mc.y,mc.r*6,0,Math.PI*2);ctx.fill();

  // ── NUCLEUS (bright core) ──
  const core=ctx.createRadialGradient(mc.x,mc.y,0,mc.x,mc.y,mc.r);
  core.addColorStop(0,'rgba(255,255,240,1)');
  core.addColorStop(0.3,'#ffee88');
  core.addColorStop(0.7,'#ffaa33');
  core.addColorStop(1,'rgba(255,120,20,0.6)');
  ctx.fillStyle=core;
  ctx.beginPath();ctx.arc(mc.x,mc.y,mc.r,0,Math.PI*2);ctx.fill();

  // Inner bright spot
  ctx.beginPath();ctx.arc(mc.x,mc.y,mc.r*0.4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fill();

  // ── Sparkle particles around head ──
  for(let i=0;i<10;i++){
    const a=t*3+i*0.63;
    const sparkDist=mc.r*(1.5+Math.sin(t*5+i*1.7)*1.2);
    const sx=mc.x+Math.cos(a)*sparkDist;
    const sy=mc.y+Math.sin(a)*sparkDist;
    const sr=1+Math.sin(t*8+i*2.3)*0.8;
    ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,220,${0.3+0.3*Math.sin(t*6+i)})`;ctx.fill();
  }

  ctx.restore();
}

function triggerCometExplosion(){
  if(!megaComet)return;
  const cx=megaComet.x, cy=megaComet.y;

  // Screen flash
  screenFlash=1;

  // Massive particle burst — multi-colored
  emitParticles(cx,cy,'rgba(255,255,200,1)',50,400);
  emitParticles(cx,cy,'rgba(255,150,50,1)',40,300);
  emitParticles(cx,cy,'rgba(255,100,200,1)',30,250);
  emitParticles(cx,cy,'rgba(100,200,255,1)',20,350);

  // Sound
  playCometExplosion();
  if(window.nativeHaptic)window.nativeHaptic('comet');

  // Score: bonus for every BH and celestial destroyed
  let explosionScore=0;

  // Destroy all black holes
  for(const bh of blackHoles){
    const pts=Math.floor(bh.r*3)+bh.consumed*15+currentLevel*10;
    explosionScore+=pts;
    emitParticles(bh.x,bh.y,'rgba(255,200,100,1)',15,150);
    stopBHDrone(bh);
    bhDestroyedThisLevel++;totalBHDestroyed++;
  }

  // Destroy all celestials for bonus
  for(const cel of celestials){
    const celType=CEL_TYPES.find(t=>t.name===cel.type);
    const pts=celType?celType.bonus*currentLevel*2:10*currentLevel;
    explosionScore+=pts;
    emitParticles(cel.x,cel.y,'rgba(200,220,255,1)',4,80);
  }

  // Comet swipe bonus
  explosionScore+=100*currentLevel;

  // Everything hostile goes, not just the black holes.
  for(const d of demons){
    if(d.dying>0)continue;
    explosionScore+=demonValue();
    emitParticles(d.x,d.y,'rgba(255,60,40,1)',14,160);
  }
  demons=[];
  shots=[];
  explosionScore+=bossCometDamage();

  blackHoles=[];
  celestials=[];
  megaComet.active=false;
  megaComet=null;

  // Applied last, so the demon and boss bonuses count. They were tallied after
  // the score was added before, which silently threw them away.
  score+=explosionScore;
  addScorePopup(cx,cy-30,explosionScore,'rgba(255,255,100,1)');
}

/// The comet hits the boss for two swipes' worth of damage, wherever the boss
/// is currently vulnerable. Returns the points earned.
function bossCometDamage(){
  if(!boss||boss.dying>0)return 0;
  const before=score;
  const HITS=2;
  if(boss.kind==='nullsovereign'){
    for(let i=0;i<HITS;i++){
      if(!boss||boss.dying>0)break;
      if(boss.stage===0){
        const a=boss.anchors.find(v=>v.alive);if(a){const p=nullAnchorPos(a);nullHitAnchor(a,p.x,p.y);}
      }else if(boss.stage===1){
        const th=boss.threads.find(v=>!v.joined);if(th){const p=nullThreadBreak(th);nullStitchThread(th,p.x,p.y);}
      }else if(!boss.coreOpen){
        const sh=boss.shields.find(v=>v.alive);if(sh){const p=nullShieldPos(sh);nullHitShield(sh,p.x,p.y);}
      }else nullHitCore(boss.x,boss.y);
    }
  }else if(boss.kind==='archdemon'){
    for(let i=0;i<HITS;i++)archdemonHit();
  }else if(boss.kind==='dreadnought'){
    for(let i=0;i<HITS;i++){
      if(boss.stage===0){
        const tu=boss.turrets.find(t=>t.alive);
        if(tu)dreadHitTurret(tu);
      }else dreadHitCore();
      if(!boss)break;
    }
  }else{
    // Devourer: two hits spread across whatever arms are exposed.
    for(let i=0;i<HITS;i++){
      if(!boss||boss.dying>0)break;
      const a=boss.arms.find(x=>x.alive&&x.len>=0.6);
      if(!a)break;
      a.hits++;
      if(a.hits>=a.need)severArm(a);
    }
  }
  if(boss)boss.hurt=1;
  emitParticles(W/2,H/2,'rgba(255,240,180,1)',12,180);
  return Math.max(0,score-before);
}

// ─── DRAW BLACK HOLE ───
function drawBlackHole(bh,t){
  const alpha=bh.opacity; if(alpha<=0)return;
  const pulse=1+0.04*Math.sin(t*3+bh.pulsePhase), drawR=bh.r*pulse;
  const glowR=drawR*3;
  const glow=ctx.createRadialGradient(bh.x,bh.y,drawR*0.5,bh.x,bh.y,glowR);
  glow.addColorStop(0,`rgba(255,100,30,${0.15*alpha})`);glow.addColorStop(0.3,`rgba(200,50,80,${0.08*alpha})`);
  glow.addColorStop(0.6,`rgba(100,20,150,${0.03*alpha})`);glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(bh.x,bh.y,glowR,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(bh.x,bh.y);ctx.rotate(bh.rotation);
  for(let i=0;i<3;i++){const ringR=drawR*(1.4+i*0.35);ctx.beginPath();ctx.ellipse(0,0,ringR,ringR*0.3,0,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,${120+i*40},${30+i*30},${(0.3-i*0.08)*alpha})`;ctx.lineWidth=2-i*0.4;ctx.stroke();}
  ctx.restore();
  const ig=ctx.createRadialGradient(bh.x,bh.y,0,bh.x,bh.y,drawR);
  ig.addColorStop(0,`rgba(0,0,0,${alpha})`);ig.addColorStop(0.7,`rgba(0,0,0,${alpha})`);
  ig.addColorStop(0.85,`rgba(10,5,20,${alpha*0.9})`);ig.addColorStop(1,`rgba(40,10,60,${alpha*0.5})`);
  ctx.fillStyle=ig;ctx.beginPath();ctx.arc(bh.x,bh.y,drawR,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(bh.x,bh.y,drawR*1.05,0,Math.PI*2);
  ctx.strokeStyle=`rgba(255,180,100,${0.5*alpha})`;ctx.lineWidth=1.5;ctx.stroke();
  // Dashed crimson ring = this one splits in two when destroyed. Kill it early.
  if(bh.canSplit){
    ctx.save();ctx.setLineDash([6,7]);ctx.lineDashOffset=-t*14;
    ctx.beginPath();ctx.arc(bh.x,bh.y,drawR*1.22,0,Math.PI*2);
    ctx.strokeStyle=`rgba(255,70,110,${(0.5+0.25*Math.sin(t*4+bh.pulsePhase))*alpha})`;
    ctx.lineWidth=2;ctx.stroke();ctx.restore();
  }
  if(bh.swipeHits>0){const pct=bh.swipeHits/bh.hitsToKill;ctx.beginPath();
    ctx.arc(bh.x,bh.y,drawR+8,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);
    ctx.strokeStyle=`rgba(0,255,200,${0.7*alpha})`;ctx.lineWidth=2;ctx.stroke();}
}
