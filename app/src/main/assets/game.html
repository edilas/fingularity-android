// ─── PARTICLES ───
function emitParticles(x,y,color,count,speed){
  for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*speed;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*3,life:1,decay:0.01+Math.random()*0.03,color});}
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.decay;p.r*=0.995;if(p.life<=0)particles.splice(i,1);}
}
function drawParticles(){
  for(const p of particles){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color.replace('1)',`${p.life})`);ctx.fill();}
}
function drawSwipeTrails(t){
  for(let i=swipeTrails.length-1;i>=0;i--){const tr=swipeTrails[i];tr.life-=0.03;if(tr.life<=0){swipeTrails.splice(i,1);continue;}if(tr.points.length<2)continue;
    ctx.beginPath();ctx.moveTo(tr.points[0].x,tr.points[0].y);for(let j=1;j<tr.points.length;j++)ctx.lineTo(tr.points[j].x,tr.points[j].y);
    ctx.strokeStyle=`rgba(0,255,200,${tr.life*0.6})`;ctx.lineWidth=3*tr.life;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
}

// ─── INPUT ───
// Multi-touch: every finger gets its own swipe trail and can damage holes
// independently. Two thumbs is the difference between level 10 being hard
// and level 10 being impossible.
const pointers=new Map();   // pointer id -> {last:{x,y}, trail}

function killBlackHole(bh){
  bh.shrinking=true; bh.shrinkSpeed=Math.max(80,bh.r*2.2);
  score+=Math.floor(bh.r*2)+bh.consumed*10+currentLevel*5;
  bhDestroyedThisLevel++; totalBHDestroyed++;
  emitParticles(bh.x,bh.y,'rgba(255,200,100,1)',30,200);
  playPopSound(bh.x);
  if(window.nativeHaptic)window.nativeHaptic('destroy');
  stopBHDrone(bh);
  if(bh.canSplit)splitBlackHole(bh);
}

/// Distance from a target point to the continuous swipe segment. Touch events
/// can be dozens of pixels apart on a fast move, so endpoint-only checks skip
/// small targets even when the visible trail passes straight through them.
function pointToSwipeDistance(target,start,end){
  const dx=end.x-start.x, dy=end.y-start.y;
  const len2=dx*dx+dy*dy;
  if(len2===0)return Math.hypot(target.x-start.x,target.y-start.y);
  const t=Math.max(0,Math.min(1,((target.x-start.x)*dx+(target.y-start.y)*dy)/len2));
  return Math.hypot(target.x-(start.x+dx*t),target.y-(start.y+dy*t));
}

function swipeAt(id,pos){
  const p=pointers.get(id);
  if(!p)return;
  const start=p.last;
  if(p.trail)p.trail.points.push(pos);

  // Boss and field hazards are allowed to evaluate the same swipe. Returning
  // here used to make the Devourer's large hit region steal touches from black
  // holes that happened to be in front of or beside it.
  const bossHandled=!!(boss&&bossSwipe(pos,start));

  for(const bh of blackHoles){
    if(bh.forming||bh.shrinking)continue;
    if(pointToSwipeDistance(bh,start,pos)<bh.r*1.5){
      const sdx=pos.x-start.x,sdy=pos.y-start.y;
      if(Math.sqrt(sdx*sdx+sdy*sdy)>20){
        bh.swipeHits++;
        emitParticles(pos.x,pos.y,'rgba(0,255,200,1)',8,100);
        playSwipeHit(pos.x);
        if(window.nativeHaptic)window.nativeHaptic('swipe');
        p.last=pos;
        if(bh.swipeHits>=bh.hitsToKill)killBlackHole(bh);
      }
    }
  }

  // Demons — same swipe mechanic, same payout as a black hole
  for(const d of demons){
    if(d.dying>0)continue;
    const dx=pos.x-d.x, dy=pos.y-d.y;
    if(Math.hypot(dx,dy)<d.r*2.0){
      const sdx=pos.x-p.last.x, sdy=pos.y-p.last.y;
      if(Math.hypot(sdx,sdy)>18){
        d.swipeHits++;
        emitParticles(pos.x,pos.y,'rgba(255,120,60,1)',8,110);
        playSwipeHit(pos.x);
        if(window.nativeHaptic)window.nativeHaptic('swipe');
        p.last=pos;
        if(d.swipeHits>=d.hitsToKill)killDemon(d);
      }
    }
  }

  // Hostile fire — raider bolts, turret shots, anything aimed at your side.
  // Swipe it out of the air. Friendly fire passes through untouched.
  for(let i=shots.length-1;i>=0;i--){
    const sh=shots[i];
    if(sh.fromAlly)continue;
    if(Math.hypot(pos.x-sh.x,pos.y-sh.y)<Math.max(unit()*0.035,sh.r*3)){
      const sdx=pos.x-p.last.x, sdy=pos.y-p.last.y;
      if(Math.hypot(sdx,sdy)>15){
        shots.splice(i,1);
        score+=4+currentLevel;
        emitParticles(sh.x,sh.y,'rgba(255,170,90,1)',8,120);
        playSwipeHit(sh.x);
        if(window.nativeHaptic)window.nativeHaptic('swipe');
        p.last=pos;
      }
    }
  }

  // Mega comet
  if(megaComet&&megaComet.active){
    const dx=pos.x-megaComet.x,dy=pos.y-megaComet.y;
    if(Math.sqrt(dx*dx+dy*dy)<megaComet.r*3){
      const sdx=pos.x-p.last.x,sdy=pos.y-p.last.y;
      if(Math.sqrt(sdx*sdx+sdy*sdy)>15){triggerCometExplosion();p.last=pos;}
    }
  }

  // VoyaDur 1 — swipe to shove it clear of a black hole
  if(voyager&&voyager.alive&&!voyager.wormhole){
    const vdx=pos.x-voyager.x,vdy=pos.y-voyager.y;
    if(Math.sqrt(vdx*vdx+vdy*vdy)<voyager.r*2){
      const sdx=pos.x-p.last.x,sdy=pos.y-p.last.y;
      const d=Math.sqrt(sdx*sdx+sdy*sdy);
      if(d>15){
        const push=240;
        voyager.vx=sdx/d*push; voyager.vy=sdy/d*push;
        if(voyager.beingSucked){voyager.beingSucked=null;voyager.suckProgress=0;voyager.opacity=1;}
        emitParticles(voyager.x,voyager.y,'rgba(50,255,120,1)',6,60);
        if(window.nativeHaptic)window.nativeHaptic('voyagerPush');
        p.last=pos;
      }
    }
  }

  if(bossHandled)p.last=pos;
}

function addPointer(id,pos){
  const trail={points:[pos],life:1};
  swipeTrails.push(trail);
  pointers.set(id,{last:pos,trail});
}

function evPos(t){return {x:t.clientX,y:t.clientY};}

function onTouchStart(e){
  if(state!==STATE.PLAYING)return;
  e.preventDefault();
  for(const t of e.changedTouches)addPointer(t.identifier,evPos(t));
}
function onTouchMove(e){
  if(state!==STATE.PLAYING)return;
  e.preventDefault();
  for(const t of e.changedTouches)swipeAt(t.identifier,evPos(t));
}
function onTouchEnd(e){
  // touchcancel fires instead of touchend on an incoming call or a Control
  // Centre swipe — without handling it, input sticks until the next tap.
  for(const t of e.changedTouches)pointers.delete(t.identifier);
}

let mouseDown=false;
function onDown(e){
  if(state!==STATE.PLAYING)return;
  mouseDown=true; addPointer('mouse',evPos(e));
}
function onMove(e){
  if(!mouseDown||state!==STATE.PLAYING)return;
  e.preventDefault(); swipeAt('mouse',evPos(e));
}
function onUp(){mouseDown=false;pointers.delete('mouse');}

canvas.addEventListener('mousedown',onDown);
canvas.addEventListener('mousemove',onMove);
canvas.addEventListener('mouseup',onUp);
canvas.addEventListener('mouseleave',onUp);
canvas.addEventListener('touchstart',onTouchStart,{passive:false});
canvas.addEventListener('touchmove',onTouchMove,{passive:false});
canvas.addEventListener('touchend',onTouchEnd);
canvas.addEventListener('touchcancel',onTouchEnd);

// ─── PAUSE (spacebar) ───
let prePauseState=null;
/// Ramps the master gain safely. Ramping without cancelling first stacks
/// scheduled values, and a ramp left over from the pause can land *after* the
/// one from the resume and re-mute everything.
function rampMaster(target,secs){
  if(!audioCtx||!masterGain)return;
  const g=masterGain.gain, now=audioCtx.currentTime;
  try{
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value,now);
    g.linearRampToValueAtTime(target,now+secs);
  }catch(e){ g.value=target; }
}

/// iOS reports an interrupted audio session as state 'interrupted', which is
/// non-standard and is NOT 'suspended'. Checking only for 'suspended' meant an
/// interruption was never recovered from and the game came back silent.
function resumeAudio(){
  if(!audioCtx)return Promise.resolve();
  if(audioCtx.state==='running')return Promise.resolve();
  return audioCtx.resume().catch(()=>{});
}

// Pausable from play, from the level banner and from the warp — the gaps
// between levels used to swallow the tap and look like a dead button.
const PAUSABLE=[STATE.PLAYING,STATE.LEVEL_TRANS,STATE.WARP];
function togglePause(){
  if(PAUSABLE.indexOf(state)>=0){
    prePauseState=state;
    state=STATE.PAUSED;
    document.getElementById('pause-overlay').classList.add('show');
    if(!audioMuted)rampMaster(0.05,0.2);
    // Park the music scheduler. Left running across a long pause it wakes up
    // owing dozens of bars and schedules them all with start times in the past,
    // which fires them at once.
    if(musicScheduler){clearInterval(musicScheduler);musicScheduler=null;}
  } else if(state===STATE.PAUSED){
    state=prePauseState||STATE.PLAYING;
    prePauseState=null;
    document.getElementById('pause-overlay').classList.remove('show');
    pointers.clear();            // drop any touch state from before the pause
    lastTime=performance.now();  // don't hand the loop a multi-second dt
    // Must happen inside the tap: iOS only lets a suspended context restart
    // from a user gesture.
    resumeAudio().then(()=>{
      if(!audioCtx)return;
      // The audio clock froze while suspended; bring the music timeline back to
      // the present or it stays silent until currentTime catches up.
      if(musicPlaying){
        musicNextTime=Math.max(musicNextTime,audioCtx.currentTime+0.1);
        if(!musicScheduler)musicScheduler=setInterval(scheduleMusicChunk,100);
      }
      if(!audioMuted)rampMaster(0.5,0.2);
    });
  }
}
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(PAUSABLE.indexOf(state)>=0||state===STATE.PAUSED)togglePause();
  }
});

// ─── LEVEL BANNER ───
function showLevelBanner(level,callback){
  const banner=document.getElementById('level-banner');
  document.getElementById('level-announce-text').textContent=`Level ${level}`;
  document.getElementById('level-announce-sub').textContent=levelName(level)||'';
  // Announce each time the faction changes, not only at level 11.
  document.getElementById('level-announce-warn').textContent='';
  if(isBossLevel(level)){
    const k=bossKind(level);
    document.getElementById('level-announce-warn').textContent=
      k==='nullsovereign'?'Past, present and future converge — the factions unite':
      k==='archdemon'  ?'Slay it before the angels fall':
      k==='dreadnought'?'Guns first, then the reactor':
      isFreeBoss(level)?'Break its shells \u2014 or just survive the round':
                        'Sever its arms \u2014 keep VoyaDur 1 alive';
  }else if(level>=WAR_START_LEVEL&&(cyclePos(level)===0||cyclePos(level)===2)){
    document.getElementById('level-announce-warn').textContent=warWords().banner;
  }
  banner.classList.add('show');
  setTimeout(()=>{banner.classList.remove('show');if(callback)callback();},1400);
}

// ─── GAME FLOW ───
let pendingStartLevel=1;
function startGame(startAt){
  document.body.classList.remove('results');
  initAudio();
  resumeAudio();   // covers iOS 'interrupted' as well as 'suspended'
  if(!audioMuted)rampMaster(0.5,0.2);
  currentLevel=Math.max(1,startAt||1);
  totalScore=0;score=0;totalBHDestroyed=0;levelRetries=0;
  voyager=null;
  document.getElementById('screen-overlay').classList.add('hidden');
  document.getElementById('darkness-overlay').style.opacity=0;
  initStars();generateNebula();
  startAmbient();
  startMusic();
  startLevel(currentLevel);
}

function startLevel(level){
  document.body.classList.add('playing');
  state=STATE.LEVEL_TRANS;
  applyLevelConfig(level);
  saveProgress(level);
  pointers.clear();
  stopAllBHDrones();
  blackHoles=[];celestials=[];particles=[];swipeTrails=[];scorePopups=[];
  bhSpawnTimer=0;celSpawnTimer=0;gameTimer=0;timeLeft=ROUND_DURATION;
  bhDestroyedThisLevel=0;score=0;
  megaComet=null;megaCometSpawned=false;megaCometTimer=0;
  megaCometDelay=8+Math.random()*15;
  screenFlash=0;
  bossDefeatBanner=0;
  voyager=null;voyagerSurvivedRound=false;
  angels=[];demons=[];shots=[];
  if(boss){stopBossDrone();boss=null;}
  if(isBossLevel(level)){
    // One fight, not a survival window — fewer distractions, longer round.
    for(let i=0;i<(isFreeBoss(level)?8:4);i++)spawnCelestial();
    if(isWarRealm())startWar();
    spawnBoss();
  }else if(isWarRealm()){
    // The sky is busier with combatants, so thin out the scenery.
    for(let i=0;i<5;i++)spawnCelestial();
    startWar();
  }else{
    for(let i=0;i<10+level;i++)spawnCelestial();
  }
  spawnVoyager(); // spawn if still alive
  if(isFreeBoss(level)&&voyager){
    voyager.x=voyager.wormholeX=W*(0.25+Math.random()*0.5);
    voyager.y=voyager.wormholeY=H*0.84;
  }
  if(isBossLevel(level)&&bossKind(level)==='devourer'&&voyager&&!isFreeBoss(level)){
    // It's the objective here, so it gets a little more armour.
    voyager.hp=voyager.maxHp=5;
    // And it arrives well clear of the maw instead of wherever chance puts it.
    voyager.x=voyager.wormholeX=W*(0.25+Math.random()*0.5);
    voyager.y=voyager.wormholeY=H*0.84;
  }
  if(isFinalBoss(level)&&voyager){
    voyager.hp=voyager.maxHp=5;
    voyager.x=voyager.wormholeX=W/2;
    voyager.y=voyager.wormholeY=H*0.86;
  }
  // If the player paused while the banner was up, resume owes them PLAYING
  // rather than the banner state they paused from.
  showLevelBanner(level,()=>{
    if(state===STATE.PAUSED)prePauseState=STATE.PLAYING;
    else state=STATE.PLAYING;
  });
  setMusicIntensity(level);
}

function completeLevel(){
  // Check if Voyager survived this round
  const vSurvived=voyager&&voyager.alive;
  if(vSurvived){
    const doubleBonus=score; // double the entire round score
    score+=doubleBonus;
    addScorePopup(W/2,H/2,doubleBonus,'rgba(50,255,120,1)');
    scorePopups.push({x:W/2,y:H/2-40,pts:'VOYADUR BONUS x2',color:'rgba(50,255,120,1)',life:2,vy:-25,isText:true});
  }
  totalScore+=score;
  levelRetries=0; // reset retry counter for next level
  playLevelComplete();
  if(window.nativeHaptic)window.nativeHaptic('levelComplete');
  // Levels 1-10 are the free campaign. Past that, the Endless Collapse.
  if(currentLevel>=FREE_MAX_LEVEL&&!isUnlocked()){startEndCutscene();return;}
  currentLevel++;
  // Clear the field, then warp to the next level
  blackHoles=[];celestials=[];particles=[];swipeTrails=[];scorePopups=[];
  stopAllBHDrones();
  startWarp(()=>startLevel(currentLevel));
}

// ════════════════════════════════════════════════════
// ─── END CUTSCENE: Random Galaxy Formation
// Four types: spiral · elliptical · lenticular · irregular
// BH always forms first at centre, then the galaxy builds around it.
// ════════════════════════════════════════════════════
let cutscene=null;

// ── Galaxy type definitions ──
// Each type drives particle spawning + colour palette + render shape.
const GALAXY_TYPES=['spiral','elliptical','lenticular','irregular'];

function pickGalaxyType(){
  return GALAXY_TYPES[Math.floor(Math.random()*GALAXY_TYPES.length)];
}

// Colour palettes per galaxy type
const GALAXY_PALETTES={
  spiral:   ['rgba(150,180,255,','rgba(200,210,255,','rgba(255,200,220,','rgba(180,220,255,','rgba(255,255,220,'],
  elliptical:['rgba(255,220,170,','rgba(255,200,140,','rgba(240,190,130,','rgba(255,235,180,','rgba(220,180,120,'],
  lenticular:['rgba(200,210,240,','rgba(180,190,230,','rgba(220,210,200,','rgba(200,190,210,','rgba(210,200,220,'],
  irregular: ['rgba(180,255,200,','rgba(255,180,120,','rgba(120,200,255,','rgba(255,140,180,','rgba(200,255,160,'],
};

// Galaxy label shown in phase 2
const GALAXY_LABELS={
  spiral:    'Spiral Galaxy',
  elliptical:'Elliptical Galaxy',
  lenticular:'Lenticular Galaxy',
  irregular: 'Irregular Galaxy',
};

function startEndCutscene(){
  state=STATE.CUTSCENE;
  stopAllBHDrones();
  stopAmbient();
  stopMusic();
  blackHoles=[];celestials=[];particles=[];swipeTrails=[];scorePopups=[];
  document.getElementById('darkness-overlay').style.opacity=0;
  document.getElementById('ui-overlay').style.opacity='0';

  const galaxyType=pickGalaxyType();

  cutscene={
    time:0, phase:0,
    galaxyType,
    bhR:0, bhMaxR:18, bhGrowSpeed:14,
    bhX:W/2, bhY:H/2, bhRotation:0,
    orbiters:[],
    textAlpha:0, textPhase:0,
    fadeAlpha:0, galaxyGlow:0,
    spawnTimer:0, armParticles:[],
    // elliptical / lenticular bulge seed (randomise axes each run)
    ellipseA: 0.55+Math.random()*0.35,   // x-axis scale 0.55–0.90
    ellipseB: 0.28+Math.random()*0.28,   // y-axis scale (flattening) 0.28–0.56
    ellipseTilt: Math.random()*Math.PI,   // tilt angle for elliptical/lenticular
    // irregular — pre-seeded offset vectors so the shape is stable each frame
    irregularSeeds: Array.from({length:8},()=>({
      angle:Math.random()*Math.PI*2,
      radiusMult:0.5+Math.random()*1.2,
      drift:(Math.random()-0.5)*0.4,
    })),
    // barred spiral variant
    hasBar: galaxyType==='spiral' && Math.random()>0.45,
  };

  // ── Soundtrack ──
  if(audioCtx){
    const now=audioCtx.currentTime;
    const o1=audioCtx.createOscillator(),g1=audioCtx.createGain();
    o1.type='sine';o1.frequency.value=55;
    g1.gain.setValueAtTime(0,now);g1.gain.linearRampToValueAtTime(0.08,now+3);
    g1.gain.setValueAtTime(0.08,now+12);g1.gain.linearRampToValueAtTime(0,now+16);
    o1.connect(g1);g1.connect(masterGain);o1.start(now);o1.stop(now+17);

    const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
    o2.type='sine';o2.frequency.value=110;
    g2.gain.setValueAtTime(0,now);g2.gain.linearRampToValueAtTime(0.04,now+4);
    g2.gain.setValueAtTime(0.04,now+12);g2.gain.linearRampToValueAtTime(0,now+16);
    o2.connect(g2);g2.connect(masterGain);o2.start(now);o2.stop(now+17);

    const o3=audioCtx.createOscillator(),g3=audioCtx.createGain(),f3=audioCtx.createBiquadFilter();
    o3.type='sawtooth';o3.frequency.setValueAtTime(80,now);o3.frequency.linearRampToValueAtTime(220,now+10);
    f3.type='lowpass';f3.frequency.setValueAtTime(100,now);f3.frequency.linearRampToValueAtTime(500,now+10);f3.Q.value=2;
    g3.gain.setValueAtTime(0,now+2);g3.gain.linearRampToValueAtTime(0.03,now+6);
    g3.gain.setValueAtTime(0.03,now+11);g3.gain.linearRampToValueAtTime(0,now+15);
    o3.connect(f3);f3.connect(g3);g3.connect(masterGain);o3.start(now);o3.stop(now+16);

    [440,554.37,659.25,880].forEach((fr,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=fr;
      const t=now+8+i*0.8;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.025,t+1);
      g.gain.setValueAtTime(0.025,t+3);g.gain.linearRampToValueAtTime(0,t+6);
      o.connect(g);g.connect(masterGain);o.start(t);o.stop(t+7);
    });
  }
}

// ── Particle spawners — one per galaxy type ──

function spawnSpiralParticle(cs,armCount){
  // Classic log-spiral with optional bar down the centre
  const arm=Math.floor(Math.random()*armCount);
  let baseAngle=(arm/armCount)*Math.PI*2+cs.time*0.3;
  const dist=30+Math.random()*Math.min(280,(cs.time-3)*50);
  // Bar: particles within bar zone placed along x-axis instead of spiral
  let spiralAngle, px, py;
  if(cs.hasBar && dist<70){
    const sign=Math.random()>0.5?1:-1;
    px=cs.bhX + sign*(dist*0.8)+(Math.random()-0.5)*10;
    py=cs.bhY + (Math.random()-0.5)*18;
    spiralAngle=Math.atan2(py-cs.bhY,px-cs.bhX);
  } else {
    spiralAngle=baseAngle+dist*0.009;
    const spread=(Math.random()-0.5)*28;
    px=cs.bhX+Math.cos(spiralAngle)*(dist+spread);
    py=cs.bhY+Math.sin(spiralAngle)*(dist+spread)*0.52;
  }
  const colors=GALAXY_PALETTES.spiral;
  return{x:px,y:py,baseAngle:spiralAngle,dist,
    orbitSpeed:0.15+0.3/(1+dist*0.005),
    size:0.5+Math.random()*2,brightness:0.3+Math.random()*0.7,
    col:colors[Math.floor(Math.random()*colors.length)],
    twinkle:Math.random()*Math.PI*2,twinkleSpeed:2+Math.random()*3,
    yScale:0.52,
  };
}

function spawnEllipticalParticle(cs){
  // Smooth ellipsoidal blob — randomly elongated, tilted, older star palette
  const angle=Math.random()*Math.PI*2;
  // Density falls off with radius (de Vaucouleurs-ish: more stars near centre)
  const r=Math.pow(Math.random(),0.5)*Math.min(280,(cs.time-3)*50+30);
  const tilt=cs.ellipseTilt;
  const ax=r*cs.ellipseA, ay=r*cs.ellipseB;
  const px=cs.bhX + Math.cos(angle)*ax*Math.cos(tilt) - Math.sin(angle)*ay*Math.sin(tilt);
  const py=cs.bhY + Math.cos(angle)*ax*Math.sin(tilt) + Math.sin(angle)*ay*Math.cos(tilt);
  const colors=GALAXY_PALETTES.elliptical;
  return{x:px,y:py,baseAngle:angle,dist:r,
    orbitSpeed:0.04+0.06*Math.random(), // slow drift — old stars, not much rotation
    size:0.4+Math.random()*1.5,brightness:0.35+Math.random()*0.65,
    col:colors[Math.floor(Math.random()*colors.length)],
    twinkle:Math.random()*Math.PI*2,twinkleSpeed:0.5+Math.random()*1.5,
    yScale:cs.ellipseB/cs.ellipseA, tilt:cs.ellipseTilt,
    useEllipse:true, ellipseA:cs.ellipseA, ellipseB:cs.ellipseB,
  };
}

function spawnLenticularParticle(cs){
  // Disk + bulge but NO spiral arms — smooth gradient, muted palette
  const angle=Math.random()*Math.PI*2;
  const maxDist=Math.min(260,(cs.time-3)*48+20);
  // Bias towards equatorial plane (disk) with small vertical scatter
  const r=Math.pow(Math.random(),0.6)*maxDist;
  const diskFlatten=0.18+Math.random()*0.08; // very flat disk
  const px=cs.bhX + Math.cos(angle)*r;
  const py=cs.bhY + Math.sin(angle)*r*diskFlatten;
  const colors=GALAXY_PALETTES.lenticular;
  return{x:px,y:py,baseAngle:angle,dist:r,
    orbitSpeed:0.10+0.18/(1+r*0.006),
    size:0.4+Math.random()*1.5,brightness:0.3+Math.random()*0.6,
    col:colors[Math.floor(Math.random()*colors.length)],
    twinkle:Math.random()*Math.PI*2,twinkleSpeed:0.8+Math.random()*1.5,
    yScale:diskFlatten,
  };
}

function spawnIrregularParticle(cs,seeds){
  // Chaotic clumps — no symmetry, bright star-forming colours, multiple off-centre blobs
  const seed=seeds[Math.floor(Math.random()*seeds.length)];
  const maxDist=Math.min(260,(cs.time-3)*46+20);
  const r=(0.2+Math.random()*0.8)*maxDist*seed.radiusMult;
  const angle=seed.angle+seed.drift*cs.time+(Math.random()-0.5)*1.2;
  const scatter=(Math.random()-0.5)*60;
  const px=cs.bhX+Math.cos(angle)*(r+scatter);
  const py=cs.bhY+Math.sin(angle)*(r+scatter)*(0.5+Math.random()*0.5);
  const colors=GALAXY_PALETTES.irregular;
  return{x:px,y:py,baseAngle:angle,dist:r,
    orbitSpeed:0.05+(Math.random()-0.5)*0.25, // some counter-rotate!
    size:0.5+Math.random()*2.5,brightness:0.4+Math.random()*0.7,
    col:colors[Math.floor(Math.random()*colors.length)],
    twinkle:Math.random()*Math.PI*2,twinkleSpeed:1.5+Math.random()*3.5,
    yScale:0.5+Math.random()*0.5,
  };
}

function updateCutscene(dt){
  if(!cutscene)return;
  const cs=cutscene;
  cs.time+=dt;

  if(cs.time<3){
    cs.phase=0;
    cs.bhR=Math.min(cs.bhMaxR,cs.bhR+cs.bhGrowSpeed*dt);
    cs.bhRotation+=1.5*dt;
  }
  else if(cs.time<10){
    cs.phase=1;
    cs.bhRotation+=0.8*dt;
    cs.galaxyGlow=Math.min(1,(cs.time-3)/4);

    cs.spawnTimer+=dt;
    const spawnRate= cs.galaxyType==='elliptical'?0.05:0.08; // elliptical spawns denser
    if(cs.spawnTimer>spawnRate){
      cs.spawnTimer=0;

      const batchSize= cs.galaxyType==='elliptical'?6:
                       cs.galaxyType==='lenticular'?5:
                       cs.galaxyType==='irregular'?5:4; // spiral=4 arms

      for(let i=0;i<batchSize;i++){
        let p;
        switch(cs.galaxyType){
          case 'spiral':    p=spawnSpiralParticle(cs,4); break;
          case 'elliptical':p=spawnEllipticalParticle(cs); break;
          case 'lenticular':p=spawnLenticularParticle(cs); break;
          case 'irregular': p=spawnIrregularParticle(cs,cs.irregularSeeds); break;
        }
        if(p) cs.armParticles.push(p);
      }

      // Occasional orbiting celestials — fewer for elliptical (old stars, no young objects)
      const spawnChance= cs.galaxyType==='elliptical'?0.06:
                         cs.galaxyType==='lenticular'?0.09:0.15;
      if(Math.random()<spawnChance){
        const dist=80+Math.random()*200;
        const angle=Math.random()*Math.PI*2;
        // Elliptical: only old-type stars; spiral/irregular: full mix
        const types= cs.galaxyType==='elliptical'
          ?['dwarf_star','sun','asteroid']
          :['planet','sun','dwarf_star','nebula_cloud','asteroid'];
        const type=types[Math.floor(Math.random()*types.length)];
        const r=type==='sun'?4+Math.random()*5:type==='planet'?3+Math.random()*4:type==='nebula_cloud'?6+Math.random()*6:2+Math.random()*2;
        const yScale= cs.galaxyType==='elliptical'?cs.ellipseB/cs.ellipseA:
                      cs.galaxyType==='lenticular'?0.22:0.52;
        cs.orbiters.push({
          type,baseAngle:angle,dist,
          orbitSpeed:0.10+0.22/(1+dist*0.005),
          r,x:0,y:0,rotation:Math.random()*Math.PI*2,
          rotSpeed:(Math.random()-0.5)*2,
          rings:type==='planet'&&Math.random()>0.6,
          yScale,tilt:cs.ellipseTilt||0,
        });
      }
    }
  }
  else if(cs.time<13){
    cs.phase=2;
    cs.bhRotation+=0.5*dt;
    cs.galaxyGlow=1;
    if(cs.time<11.5)cs.textPhase=1;else cs.textPhase=2;
    cs.textAlpha=Math.min(1,(cs.time-10)*2);
  }
  else if(cs.time<15){
    cs.phase=3;
    cs.fadeAlpha=Math.min(1,(cs.time-13)/2);
    cs.bhRotation+=0.3*dt;
  }
  else{
    cutscene=null;
    document.getElementById('ui-overlay').style.opacity='1';
    showVictoryScreen();
    return;
  }

  // Update particles — each type orbits differently
  for(const p of cs.armParticles){
    p.baseAngle+=p.orbitSpeed*dt;
    if(p.useEllipse){
      // Elliptical: re-derive position from ellipse axes + tilt
      p.x=cs.bhX+Math.cos(p.baseAngle)*p.ellipseA*p.dist*Math.cos(p.tilt)-Math.sin(p.baseAngle)*p.ellipseB*p.dist*Math.sin(p.tilt);
      p.y=cs.bhY+Math.cos(p.baseAngle)*p.ellipseA*p.dist*Math.sin(p.tilt)+Math.sin(p.baseAngle)*p.ellipseB*p.dist*Math.cos(p.tilt);
    } else {
      p.x=cs.bhX+Math.cos(p.baseAngle)*p.dist;
      p.y=cs.bhY+Math.sin(p.baseAngle)*p.dist*(p.yScale||0.52);
    }
  }

  for(const o of cs.orbiters){
    o.baseAngle+=o.orbitSpeed*dt;
    if(o.tilt){
      o.x=cs.bhX+Math.cos(o.baseAngle)*o.dist*Math.cos(o.tilt)-Math.sin(o.baseAngle)*o.dist*o.yScale*Math.sin(o.tilt);
      o.y=cs.bhY+Math.cos(o.baseAngle)*o.dist*Math.sin(o.tilt)+Math.sin(o.baseAngle)*o.dist*o.yScale*Math.cos(o.tilt);
    } else {
      o.x=cs.bhX+Math.cos(o.baseAngle)*o.dist;
      o.y=cs.bhY+Math.sin(o.baseAngle)*o.dist*(o.yScale||0.52);
    }
    o.rotation+=o.rotSpeed*dt;
  }
}

// ── Galaxy-type-specific background glow renderer ──
function renderGalaxyGlow(cs){
  const {bhX,bhY,galaxyGlow,galaxyType,ellipseA,ellipseB,ellipseTilt}=cs;
  if(galaxyGlow<=0)return;

  ctx.save();
  ctx.globalAlpha=galaxyGlow;

  if(galaxyType==='spiral'){
    // Two-tone disc glow — blue-purple core, wider haze
    const gg=ctx.createRadialGradient(bhX,bhY,10,bhX,bhY,340);
    gg.addColorStop(0,`rgba(70,55,120,0.18)`);
    gg.addColorStop(0.35,`rgba(40,30,85,0.10)`);
    gg.addColorStop(0.7,`rgba(20,15,55,0.05)`);
    gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;
    ctx.save();ctx.translate(bhX,bhY);ctx.scale(1,0.52);ctx.translate(-bhX,-bhY);
    ctx.beginPath();ctx.arc(bhX,bhY,340,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  else if(galaxyType==='elliptical'){
    // Warm golden-orange blob, tilted ellipse
    const gg=ctx.createRadialGradient(bhX,bhY,15,bhX,bhY,300);
    gg.addColorStop(0,`rgba(180,130,60,0.18)`);
    gg.addColorStop(0.4,`rgba(130,90,40,0.09)`);
    gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;
    ctx.save();
    ctx.translate(bhX,bhY);ctx.rotate(ellipseTilt);
    ctx.scale(ellipseA,(ellipseB/ellipseA));
    ctx.translate(-bhX,-bhY);
    ctx.beginPath();ctx.arc(bhX,bhY,300,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  else if(galaxyType==='lenticular'){
    // Cool silver-grey, very flat disc
    const gg=ctx.createRadialGradient(bhX,bhY,12,bhX,bhY,280);
    gg.addColorStop(0,`rgba(130,130,160,0.18)`);
    gg.addColorStop(0.5,`rgba(80,80,110,0.08)`);
    gg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gg;
    ctx.save();ctx.translate(bhX,bhY);ctx.scale(1,0.18);ctx.translate(-bhX,-bhY);
    ctx.beginPath();ctx.arc(bhX,bhY,280,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // central bulge — slightly rounder
    const bg=ctx.createRadialGradient(bhX,bhY,0,bhX,bhY,90);
    bg.addColorStop(0,`rgba(180,170,200,0.14)`);
    bg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(bhX,bhY,90,0,Math.PI*2);ctx.fill();
  }
  else if(galaxyType==='irregular'){
    // Multi-blob chaotic glow from seed positions
    for(const seed of cs.irregularSeeds){
      const bx=bhX+Math.cos(seed.angle+seed.drift*cs.time)*seed.radiusMult*110;
      const by=bhY+Math.sin(seed.angle+seed.drift*cs.time)*seed.radiusMult*70;
      const r=60+seed.radiusMult*80;
      const ig=ctx.createRadialGradient(bx,by,0,bx,by,r);
      ig.addColorStop(0,`rgba(60,120,80,0.10)`);
      ig.addColorStop(0.5,`rgba(80,60,120,0.06)`);
      ig.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=ig;ctx.beginPath();ctx.arc(bx,by,r,0,Math.PI*2);ctx.fill();
    }
  }

  ctx.restore();
}

function renderCutscene(t){
  if(!cutscene)return;
  const cs=cutscene;
  const secs=t/1000;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#020206';ctx.fillRect(0,0,W,H);
  drawStars(secs);

  // Galaxy-type background glow
  renderGalaxyGlow(cs);

  // ── Arm / body particles ──
  for(const p of cs.armParticles){
    const tw=0.5+0.5*Math.sin(secs*p.twinkleSpeed+p.twinkle);
    const a=p.brightness*tw*cs.galaxyGlow;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=p.col+a+')';ctx.fill();
    if(p.size>1.2){
      ctx.beginPath();ctx.arc(p.x,p.y,p.size*3,0,Math.PI*2);
      ctx.fillStyle=p.col+(a*0.08)+')';ctx.fill();
    }
  }

  // ── Orbiting celestials ──
  for(const o of cs.orbiters){
    ctx.save();ctx.globalAlpha=cs.galaxyGlow;
    ctx.translate(o.x,o.y);ctx.rotate(o.rotation);
    if(o.type==='sun'){
      const sg=ctx.createRadialGradient(0,0,0,0,0,o.r*2);
      sg.addColorStop(0,'rgba(255,255,200,0.8)');sg.addColorStop(0.4,'rgba(255,200,50,0.4)');sg.addColorStop(1,'rgba(255,100,20,0)');
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(0,0,o.r*2,0,Math.PI*2);ctx.fill();
      const sc=ctx.createRadialGradient(0,0,0,0,0,o.r);
      sc.addColorStop(0,'#ffffee');sc.addColorStop(1,'#ff8800');
      ctx.fillStyle=sc;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
    } else if(o.type==='planet'){
      const pg=ctx.createRadialGradient(-o.r*0.2,-o.r*0.2,0,0,0,o.r);
      pg.addColorStop(0,'#6ab4e8');pg.addColorStop(1,'#1a3d5c');
      ctx.fillStyle=pg;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
      if(o.rings){ctx.beginPath();ctx.ellipse(0,0,o.r*1.6,o.r*0.25,0.3,0,Math.PI*2);ctx.strokeStyle='rgba(200,180,150,0.4)';ctx.lineWidth=1;ctx.stroke();}
    } else if(o.type==='dwarf_star'){
      const dg=ctx.createRadialGradient(0,0,0,0,0,o.r*1.3);
      dg.addColorStop(0,'rgba(255,200,180,0.7)');dg.addColorStop(1,'rgba(255,50,20,0)');
      ctx.fillStyle=dg;ctx.beginPath();ctx.arc(0,0,o.r*1.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffddcc';ctx.beginPath();ctx.arc(0,0,o.r*0.6,0,Math.PI*2);ctx.fill();
    } else if(o.type==='nebula_cloud'){
      const ng=ctx.createRadialGradient(0,0,0,0,0,o.r);
      ng.addColorStop(0,'rgba(160,80,200,0.12)');ng.addColorStop(1,'rgba(60,20,100,0)');
      ctx.fillStyle=ng;ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle='#8a7d6b';ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // ── Central black hole (identical across all types) ──
  if(cs.bhR>0){
    const agR=cs.bhR*2.8;
    const ag=ctx.createRadialGradient(cs.bhX,cs.bhY,cs.bhR*0.3,cs.bhX,cs.bhY,agR);
    ag.addColorStop(0,`rgba(255,160,60,${0.55*Math.min(1,cs.bhR/10)})`);
    ag.addColorStop(0.3,`rgba(220,90,140,${0.25*Math.min(1,cs.bhR/10)})`);
    ag.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ag;ctx.beginPath();ctx.arc(cs.bhX,cs.bhY,agR,0,Math.PI*2);ctx.fill();

    ctx.save();ctx.translate(cs.bhX,cs.bhY);ctx.rotate(cs.bhRotation);
    for(let i=0;i<3;i++){
      const rr=cs.bhR*(1.4+i*0.35);
      ctx.beginPath();ctx.ellipse(0,0,rr,rr*0.22,0,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,${150+i*35},${60+i*40},${0.55-i*0.1})`;
      ctx.lineWidth=1.8-i*0.3;ctx.stroke();
    }
    ctx.restore();

    const ehg=ctx.createRadialGradient(cs.bhX,cs.bhY,0,cs.bhX,cs.bhY,cs.bhR);
    ehg.addColorStop(0,'rgba(0,0,0,1)');ehg.addColorStop(0.7,'rgba(0,0,0,1)');
    ehg.addColorStop(0.9,'rgba(10,5,20,0.9)');ehg.addColorStop(1,'rgba(40,10,60,0.4)');
    ctx.fillStyle=ehg;ctx.beginPath();ctx.arc(cs.bhX,cs.bhY,cs.bhR,0,Math.PI*2);ctx.fill();

    ctx.beginPath();ctx.arc(cs.bhX,cs.bhY,cs.bhR*1.08,0,Math.PI*2);
    ctx.strokeStyle='rgba(255,210,130,0.6)';ctx.lineWidth=1.2;ctx.stroke();
  }

  // ── Text overlays: galaxy type label + "from destruction / comes creation" ──
  if(cs.textPhase>=1&&cs.time<14){
    ctx.save();
    const textFade=cs.textAlpha*(cs.phase===3?1-cs.fadeAlpha:1);
    ctx.globalAlpha=textFade;
    ctx.textAlign='center';

    // Galaxy type label — appears first in phase 1, stays through phase 2
    ctx.font='700 '+Math.floor(Math.min(13,W*0.022))+'px "Orbitron", monospace';
    ctx.fillStyle='rgba(200,220,255,0.55)';
    ctx.fillText(GALAXY_LABELS[cs.galaxyType].toUpperCase(),cs.bhX,cs.bhY-160);

    // "From destruction..." line
    ctx.font='300 '+Math.floor(Math.min(22,W*0.038))+'px "Exo 2", sans-serif';
    if(cs.textPhase===1){
      ctx.fillStyle='rgba(200,180,255,0.8)';
      ctx.fillText('From destruction...',cs.bhX,cs.bhY+155);
    } else {
      ctx.fillStyle='rgba(200,180,255,0.65)';
      ctx.fillText('From destruction...',cs.bhX,cs.bhY+148);
      ctx.fillStyle='rgba(255,220,180,0.9)';
      ctx.fillText('...comes creation',cs.bhX,cs.bhY+180);
    }
    ctx.restore();
  }

  // ── Fade to black ──
  if(cs.fadeAlpha>0){
    ctx.fillStyle=`rgba(0,0,0,${cs.fadeAlpha})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ─── LEVEL 40 NARRATIVE ENDING / CREDITS
// This is a real ending, not a game-over screen. The same run can continue at
// level 41 after the credits, where the old escalating system resumes forever.
// ═══════════════════════════════════════════════════
let continuumEnding=null;

function finishNullSovereign(){
  if(voyager&&voyager.alive)score*=2;
  totalScore+=score;score=0;levelRetries=0;
  saveProgress(FINAL_BOSS_LEVEL+1);
  gcSubmit(totalScore);
  playLevelComplete();
  if(window.nativeHaptic)window.nativeHaptic('levelComplete');
  startContinuumEnding();
}

function startContinuumEnding(){
  state=STATE.CUTSCENE;cutscene=null;
  stopAllBHDrones();stopAmbient();stopMusic();
  blackHoles=[];demons=[];shots=[];particles=[];swipeTrails=[];scorePopups=[];
  document.getElementById('darkness-overlay').style.opacity=0;
  document.getElementById('ui-overlay').style.opacity='0';
  continuumEnding={time:0,coreR:unit()*0.18,flash:1,signal:0,fade:0};
  playVictorySound();
}

function updateContinuumEnding(dt){
  if(!continuumEnding)return;
  const e=continuumEnding;e.time+=dt;
  e.coreR=Math.max(0,e.coreR-dt*unit()*0.018);
  e.flash=Math.max(0,e.flash-dt*0.6);
  if(e.time>8)e.signal=Math.min(1,e.signal+dt*0.45);
  if(e.time>15)e.fade=Math.min(1,e.fade+dt/2.5);
  if(e.time>=18){continuumEnding=null;showContinuumVictoryScreen();}
}

function endingText(text,y,size,alpha,color){
  if(alpha<=0)return;
  ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.textAlign='center';
  ctx.font=`700 ${Math.round(size)}px Orbitron, monospace`;
  ctx.fillStyle=color||'rgba(255,235,190,1)';
  ctx.shadowColor=color||'rgba(255,170,70,0.8)';ctx.shadowBlur=15;
  ctx.fillText(text,W/2,y);ctx.restore();
}

function renderContinuumEnding(t){
  const e=continuumEnding;if(!e)return;
  const secs=t/1000;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#010106';ctx.fillRect(0,0,W,H);drawStars(secs);
  for(const side of [-1,1]){
    const g=ctx.createLinearGradient(W/2,0,side<0?0:W,H);
    g.addColorStop(0,'rgba(110,40,160,0.18)');
    g.addColorStop(1,side<0?'rgba(255,120,30,0.03)':'rgba(40,170,255,0.03)');
    ctx.fillStyle=g;ctx.fillRect(side<0?0:W/2,0,W/2,H);
  }
  const cx=W/2,cy=H*0.34;
  if(e.coreR>1){
    const ring=ctx.createRadialGradient(cx,cy,e.coreR*0.6,cx,cy,e.coreR*2.8);
    ring.addColorStop(0,'rgba(0,0,0,1)');ring.addColorStop(0.38,'rgba(0,0,0,1)');
    ring.addColorStop(0.52,`rgba(255,235,180,${0.9-e.time*0.025})`);
    ring.addColorStop(0.7,'rgba(150,80,255,0.28)');ring.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=ring;ctx.beginPath();ctx.arc(cx,cy,e.coreR*2.8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx,cy,e.coreR,0,Math.PI*2);ctx.fill();
  }
  const oldAlpha=ctx.globalAlpha;ctx.globalAlpha=Math.min(1,e.time/2);
  for(let i=0;i<6;i++){
    const x=W*(0.18+0.64*i/5),y=H*(0.67+(i%2)*0.055),kind=i%2;
    if(kind){
      ctx.fillStyle='rgba(150,220,255,0.9)';ctx.beginPath();ctx.moveTo(x,y-8);ctx.lineTo(x-12,y+9);ctx.lineTo(x,y+5);ctx.lineTo(x+12,y+9);ctx.closePath();ctx.fill();
    }else{
      ctx.fillStyle='rgba(225,240,255,0.95)';ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(255,225,120,0.9)';ctx.beginPath();ctx.ellipse(x,y-12,9,3,0,0,Math.PI*2);ctx.stroke();
    }
  }
  ctx.globalAlpha=oldAlpha;
  if(e.signal>0){
    const sy=H*0.82;
    ctx.strokeStyle=`rgba(80,235,255,${0.75*e.signal})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cx,sy);ctx.lineTo(cx,cy+Math.max(2,e.coreR));ctx.stroke();
    for(let i=0;i<4;i++){
      ctx.beginPath();ctx.arc(cx,sy,18+i*18*e.signal,0,Math.PI*2);
      ctx.strokeStyle=`rgba(80,235,255,${(0.5-i*0.08)*e.signal})`;ctx.stroke();
    }
    ctx.fillStyle='rgba(220,245,255,0.95)';ctx.beginPath();ctx.arc(cx,sy,8,0,Math.PI*2);ctx.fill();
  }
  if(e.time<5){
    const a=Math.min(1,e.time/0.8)*Math.min(1,(5-e.time)/0.8);
    endingText('THE THREE WARS WERE ONE',H*0.16,Math.min(20,W*0.045),a,'rgba(220,190,255,1)');
  }else if(e.time<9){
    const a=Math.min(1,(e.time-5)/0.8)*Math.min(1,(9-e.time)/0.8);
    endingText('THE NULL SOVEREIGN IS CAST BEYOND TIME',H*0.16,Math.min(15,W*0.034),a);
  }else if(e.time<13){
    const a=Math.min(1,(e.time-9)/0.7)*Math.min(1,(13-e.time)/0.8);
    endingText('THE CONTINUUM ENDURES',H*0.17,Math.min(26,W*0.058),a,'rgba(255,235,175,1)');
  }else{
    const a=Math.min(1,(e.time-13)/0.8)*(1-e.fade);
    endingText('BUT BEYOND ITS EDGE, SOMETHING AWAKENS',H*0.16,Math.min(15,W*0.034),a,'rgba(150,215,255,1)');
  }
  if(e.flash>0){ctx.fillStyle=`rgba(255,250,230,${e.flash*0.5})`;ctx.fillRect(0,0,W,H);}
  if(e.fade>0){ctx.fillStyle=`rgba(0,0,0,${e.fade})`;ctx.fillRect(0,0,W,H);}
}

function continueBeyondEnding(){
  document.body.classList.remove('results');

  document.getElementById('ui-overlay').style.opacity='1';

  startAmbient();startMusic();currentLevel=FINAL_BOSS_LEVEL+1;startLevel(currentLevel);
}

// ─── LEADERBOARD  (Claude persistent shared storage)
// ═══════════════════════════════════════════════════
const LB_KEY = 'fing_leaderboard_v1';
const LB_BEST_KEY = 'fing_personal_best';

// Scores persist on the device. The previous implementation used
// `window.storage`, which is specific to Claude's artifact sandbox and does not
// exist in a WKWebView — every save failed silently and the board was always
// empty in the app. localStorage works offline and needs no backend.
//
// For a cross-device board, Game Center is the right move: no server, no
// account handling, and no user-generated names to moderate.

function lbLoad(){
  try{
    const raw = localStorage.getItem(LB_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  }catch(e){ return []; }
}

function lbSave(entries){
  try{ localStorage.setItem(LB_KEY, JSON.stringify(entries)); }catch(e){}
}

function lbBest(){
  const list = lbLoad();
  return list.length ? list[0].score : 0;

function lbSubmit(name, score, retries){
  const entries = lbLoad();
  entries.push({
    name: (name||'Anonymous').trim().slice(0,20) || 'Anonymous',
    score,
    retries,
    level: currentLevel,
    date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})
  });
  entries.sort((a,b) => b.score - a.score);
  entries.splice(20);
  lbSave(entries);
  gcSubmit(score);   // local board and Game Center stay in step
  try{ localStorage.setItem(LB_BEST_KEY, String(entries[0].score)); }catch(e){}
  return entries;
}

          font-weight:${isYou?600:400};">

// ─── UNLOCK: Endless Collapse (levels 11+)
// Levels 1-10 are free and are a complete game. The native layer owns the
// actual StoreKit transaction; everything here is the bridge to it.
// ════════════════════════════════════════════════════
// ─────────────────────────────────────────────
// SET BOTH OF THESE TO false BEFORE ARCHIVING FOR THE APP STORE.
// DEV_UNLOCK_ALL bypasses the paywall entirely (every level playable, no
// purchase needed). DEV_LEVEL_PICKER only adds the jump-to-level row on the
// title screen, leaving the real paywall in place — that's the one to use
// when testing bosses and the purchase flow together.
const DEV_UNLOCK_ALL = false;
const DEV_LEVEL_PICKER = false;
// ─────────────────────────────────────────────

const UNLOCK_KEY='fing_endless_unlocked';
const UNLOCK_PRODUCT_ID='com.agosllc.fingularity.endless';

function isUnlocked(){
  if(DEV_UNLOCK_ALL)return true;
  try{return localStorage.getItem(UNLOCK_KEY)==='1';}catch(e){return false;}
}
function setUnlocked(v){
  try{localStorage.setItem(UNLOCK_KEY,v?'1':'0');}catch(e){}
  MAX_LEVEL=v?Infinity:FREE_MAX_LEVEL;
}

// The native side calls this after a purchase or restore resolves.
// Native pushes the localised price string once StoreKit has the product.
// Never hardcode a price — the App Store shows local currency and Apple's
// pricing tiers differ by region.
let unlockPriceText='';
function paintPrices(){
  document.querySelectorAll('[data-unlock-price]').forEach(el=>{
    el.textContent=unlockPriceText?('\u2014 '+unlockPriceText):'';
  });
}
window.fingOnPrice=function(priceText){
  if(priceText)unlockPriceText=String(priceText);
  paintPrices();
};

// Native pushes StoreKit's authoritative answer after its first entitlement
// scan on every launch. This covers reinstalls/new phones and also clears a
// cached local flag after a refund or revoked family purchase.
window.fingOnEntitlement=function(owned){
  if(owned)grantUnlock();
  else setUnlocked(false);
  if(typeof paintStartButtons==='function')paintStartButtons();
  paintMenuUnlock();
};

// A paying player who just cleared level 10 goes straight on to 11 — they've
// already earned it, so Continue should never send them back to replay 10.
function grantUnlock(){
  setUnlocked(true);
  // Only advance a player parked at the free wall. Never reduce progress for
  // a returning owner who has already reached a later paid level.
  if(savedProgress()===FREE_MAX_LEVEL)saveProgress(FREE_MAX_LEVEL+1);
  if(typeof paintStartButtons==='function')paintStartButtons();
}

window.fingOnPurchaseResult=function(ok,message){
  const note=document.getElementById('unlock-note');
  if(ok){
    grantUnlock();
    const card=document.getElementById('unlock-card');
    if(card){
      // Victory screen: swap the purchase buttons for a way straight in.
      const row=card.querySelector('.unlock-buttons');
      if(row)row.innerHTML=`<button class="btn" data-action="enter-endless"
        style="border-color:rgba(100,255,180,0.45);color:rgba(100,255,200,0.95);font-size:14px;padding:12px 26px;">
        Enter Level ${FREE_MAX_LEVEL+1}</button>`;
      if(note){note.style.color='rgba(100,255,200,0.9)';note.textContent='Unlocked. Thank you for supporting Fingularity.';}
    }
    const menu=document.getElementById('menu-unlock');
    if(menu){
      menu.innerHTML=`<div style="font-family:'Exo 2',-apple-system,sans-serif;font-size:12px;letter-spacing:2px;
        text-transform:uppercase;color:rgba(100,255,200,0.9);">The Endless Collapse is unlocked</div>`;
    }
  }else if(note){
    note.style.color='rgba(255,140,120,0.9)';
    note.textContent=message||'That did not go through. You have not been charged.';
  }
};

function handleUnlockAction(a){
  const note=document.getElementById('unlock-note');
  if(note){
    note.style.color='rgba(180,210,255,0.6)';
    note.textContent=(a==='restore')?'Checking your purchases…':'Opening Google Play…';
  }
  if(window.nativeIAP&&typeof window.nativeIAP[a]==='function'){
    window.nativeIAP[a](UNLOCK_PRODUCT_ID);
  }else if(note){
    note.textContent='The Endless Collapse is available in the Android app from Google Play.';
  }
}


// ─── UNLOCK CARD ART ───
// Ghost silhouettes of what's behind the wall, drawn with code rather than
// shipped images — same shapes the fights use, so the card can't go stale.
// Cached as data URLs; each one is drawn once per session.
const ghostCache={};
function ghostArt(kind,size){
  if(ghostCache[kind])return ghostCache[kind];
  const S=size||96, d=2;
  const c=document.createElement('canvas');
  c.width=S*d; c.height=S*d;
  const g=c.getContext('2d');
  g.scale(d,d);
  g.translate(S/2,S/2);
  const R=S*0.3;
  const ink=(a)=>`rgba(255,150,90,${a})`;
  const glow=(a)=>`rgba(255,210,150,${a})`;

  if(kind==='devourer'){
    const halo=g.createRadialGradient(0,0,R*0.5,0,0,R*2.2);
    halo.addColorStop(0,'rgba(255,110,50,0.28)');
    halo.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=halo;g.beginPath();g.arc(0,0,R*2.2,0,Math.PI*2);g.fill();
    for(let i=0;i<4;i++){
      const a=i*Math.PI/2+0.4;
      g.save();g.rotate(a);
      g.beginPath();
      g.moveTo(R*1.0,0);
      g.quadraticCurveTo(R*1.6,R*0.5,R*2.3,R*0.12);
      g.strokeStyle=ink(0.9);g.lineWidth=5.5;g.lineCap='round';g.stroke();
      g.restore();
    }
    g.beginPath();g.arc(0,0,R,0,Math.PI*2);
    g.fillStyle='rgba(0,0,0,0.92)';g.fill();
    g.strokeStyle=glow(0.85);g.lineWidth=2.4;g.stroke();
  }else if(kind==='archdemon'){
    const halo=g.createRadialGradient(0,0,R*0.3,0,0,R*2.4);
    halo.addColorStop(0,'rgba(255,80,40,0.22)');
    halo.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=halo;g.beginPath();g.arc(0,0,R*2.4,0,Math.PI*2);g.fill();
    // Wings: one smooth sweep up and back, scalloped trailing edge
    for(const dir of [-1,1]){
      g.save();g.scale(dir,1);
      g.beginPath();
      g.moveTo(R*0.35,-R*0.2);
      g.quadraticCurveTo(R*1.5,-R*1.6, R*2.25,-R*1.15);   // leading edge
      g.quadraticCurveTo(R*1.95,-R*0.5, R*2.05,-R*0.05);  // wing tip
      g.quadraticCurveTo(R*1.5,-R*0.35, R*1.35, R*0.25);  // scallop
      g.quadraticCurveTo(R*1.0,-R*0.05, R*0.85, R*0.6);   // scallop
      g.quadraticCurveTo(R*0.6, R*0.2,  R*0.4,  R*0.3);
      g.closePath();
      g.fillStyle='rgba(52,8,16,0.92)';g.fill();
      g.strokeStyle=ink(0.8);g.lineWidth=1.5;g.lineJoin='round';g.stroke();
      g.restore();
    }
    // Horns
    g.fillStyle='rgba(30,4,10,0.96)';
    for(const dir of [-1,1]){
      g.beginPath();
      g.moveTo(dir*R*0.12,-R*0.48);
      g.quadraticCurveTo(dir*R*0.95,-R*1.05, dir*R*0.78,-R*1.55);
      g.quadraticCurveTo(dir*R*0.62,-R*0.95, dir*R*0.42,-R*0.62);
      g.closePath();g.fill();
      g.strokeStyle=ink(0.7);g.lineWidth=1.3;g.stroke();
    }
    // Head
    g.beginPath();g.arc(0,0,R*0.62,0,Math.PI*2);
    g.fillStyle='rgba(28,4,10,0.96)';g.fill();
    g.strokeStyle=ink(0.9);g.lineWidth=2;g.stroke();
    for(const dir of [-1,1]){
      g.beginPath();g.ellipse(dir*R*0.24,-R*0.06,R*0.14,R*0.075,dir*0.35,0,Math.PI*2);
      g.fillStyle=glow(1);g.fill();
    }
  }else if(kind==='dreadnought'){
    const w=R*3.0, h=R*0.78;
    g.beginPath();
    g.moveTo(-w*0.5,-h*0.2); g.lineTo(-w*0.4,-h*0.55); g.lineTo(-w*0.1,-h*0.62);
    g.lineTo(-w*0.05,-h*1.15); g.lineTo(w*0.05,-h*1.15); g.lineTo(w*0.1,-h*0.62);
    g.lineTo(w*0.4,-h*0.55); g.lineTo(w*0.5,-h*0.2); g.lineTo(w*0.5,h*0.2);
    g.lineTo(w*0.38,h*0.6); g.lineTo(w*0.06,h*0.7); g.lineTo(w*0.05,h*1.0);
    g.lineTo(-w*0.05,h*1.0); g.lineTo(-w*0.06,h*0.7); g.lineTo(-w*0.38,h*0.6);
    g.lineTo(-w*0.5,h*0.2); g.closePath();
    g.fillStyle='rgba(38,14,18,0.92)';g.fill();
    g.strokeStyle=ink(0.85);g.lineWidth=1.8;g.stroke();
    g.strokeStyle=ink(0.25);g.lineWidth=1;
    g.beginPath();
    for(let i=1;i<6;i++){const x=-w*0.5+i*w/6;g.moveTo(x,-h*0.5);g.lineTo(x,h*0.55);}
    g.stroke();
    for(const [tx,ty] of [[-0.3,-0.5],[-0.09,0.5],[0.14,-0.5],[0.34,0.5]]){
      g.beginPath();g.arc(tx*w,ty*h,R*0.15,0,Math.PI*2);
      g.fillStyle='rgba(140,55,50,0.98)';g.fill();
      g.strokeStyle=glow(0.85);g.lineWidth=1.4;g.stroke();
      g.beginPath();g.moveTo(tx*w,ty*h);g.lineTo(tx*w,ty*h+Math.sign(ty)*R*0.34);
      g.strokeStyle=ink(0.9);g.lineWidth=2.2;g.stroke();
    }
    for(const dir of [-1,1]){
      const eg=g.createRadialGradient(dir*w*0.52,0,0,dir*w*0.52,0,h*1.1);
      eg.addColorStop(0,'rgba(255,140,70,0.6)');
      eg.addColorStop(1,'rgba(255,60,20,0)');
      g.fillStyle=eg;g.beginPath();g.arc(dir*w*0.52,0,h*1.1,0,Math.PI*2);g.fill();
    }
  }else if(kind==='war'){
    // An angel and a raider trading fire — the war behind the bosses.
    g.beginPath();g.arc(-R*0.9,0,R*0.34,0,Math.PI*2);
    g.fillStyle='rgba(190,225,255,0.85)';g.fill();
    g.beginPath();g.ellipse(-R*0.9,-R*0.55,R*0.3,R*0.1,0,0,Math.PI*2);
    g.strokeStyle='rgba(255,230,160,0.9)';g.lineWidth=2;g.stroke();
    for(const dir of [-1,1]){
      g.beginPath();
      g.moveTo(-R*0.9,-R*0.1);
      g.quadraticCurveTo(-R*0.9+dir*R*0.75,-R*0.7,-R*0.9+dir*R*0.62,R*0.3);
      g.closePath();g.fillStyle='rgba(210,235,255,0.55)';g.fill();
    }
    g.beginPath();g.moveTo(R*1.25,-R*0.1);g.lineTo(-R*0.2,-R*0.02);
    g.strokeStyle=ink(0.9);g.lineWidth=2.4;g.lineCap='round';g.stroke();
    g.save();g.translate(R*1.0,R*0.15);g.rotate(Math.PI*0.5);
    g.beginPath();
    g.moveTo(0,-R*0.6);g.lineTo(R*0.22,-R*0.1);g.lineTo(R*0.6,R*0.3);
    g.lineTo(R*0.12,R*0.18);g.lineTo(0,R*0.35);g.lineTo(-R*0.12,R*0.18);
    g.lineTo(-R*0.6,R*0.3);g.lineTo(-R*0.22,-R*0.1);g.closePath();
    g.fillStyle='rgba(70,16,20,0.95)';g.fill();
    g.strokeStyle=ink(0.85);g.lineWidth=1.4;g.stroke();
    g.restore();
  }
  ghostCache[kind]=c.toDataURL('image/png');
  return ghostCache[kind];
}

  // No autofocus: on a phone it raised the keyboard immediately and scrolled

          color:rgba(180,210,255,0.4);margin-bottom:20px;">Fingularity · Top 20</div>
      <div style="width:min(520px,92vw);max-height:34vh;overflow-y:auto;

          color:rgba(180,210,255,0.3);margin-top:24px;text-transform:uppercase;"></div>`;

    // Scroll to player's row
    setTimeout(()=>{
      const rows = o.querySelectorAll('tr');

    }, 200);

    o.addEventListener('click', function handler(e){

      if(!action) return;

      if(a === 'unlock' || a === 'restore'){ handleUnlockAction(a); return; }
      o.removeEventListener('click', handler);
      if(a === 'enter-endless') startGame(FREE_MAX_LEVEL+1);
      else if(a === 'menu') quitToMenu();
      else if(a === 'newgame') startGame(1);
    });
  }

  o.addEventListener('click', function handler(e){
    const action = e.target.closest('[data-action]');
    if(!action) return;
    const a = action.dataset.action;
    // Unlock/restore stay on this screen — don't tear down the handler.
    if(a === 'unlock' || a === 'restore'){ handleUnlockAction(a); return; }
    o.removeEventListener('click', handler);
    if(a === 'enter-endless'){ startGame(FREE_MAX_LEVEL+1); return; }
    if(a === 'menu'){ quitToMenu(); return; }
    if(a === 'submit') submitScore(false);
    else if(a === 'skip') submitScore(true);
  });

  // Allow Enter key to submit
  o.addEventListener('keydown', function kHandler(e){
    if(e.key === 'Enter'){
      o.removeEventListener('keydown', kHandler);
      submitScore(false);
    }
  });
}



const MAX_RETRIES=3;

function retryLevel(){
  document.body.classList.remove('results');
  levelRetries++;
  resumeAudio();
  if(!audioMuted)rampMaster(0.5,0.2);
  document.getElementById('screen-overlay').classList.add('hidden');
  document.getElementById('darkness-overlay').style.opacity=0;
  // Remove the failed level's score that was added in endGame
  totalScore-=score;
  score=0;
  // A failed final-boss frame can contain Phase 3 and ending state. Retry must
  // always reconstruct Level 40 from Phase 1, never resume those objects.
  continuumEnding=null;
  boss=null;
  prePauseState=null;
  stopAllBHDrones();
  startAmbient();
  startMusic();
  startLevel(currentLevel);
}

function endGame(reason){
  document.body.classList.remove('playing');
  setTimeout(()=>{if(typeof paintStartButtons==='function')paintStartButtons();},50);
  state=STATE.OVER;totalScore+=score;pointers.clear();angels=[];demons=[];shots=[];
  // Paid runs end here rather than on the level 10 victory screen, so this is
  // where their score reaches Game Center. It keeps each player's best.
  gcSubmit(totalScore);
  if(boss){stopBossDrone();boss=null;}
  stopAmbient();stopAllBHDrones();stopMusic();
  playGameOverSound();
  if(window.nativeHaptic)window.nativeHaptic('gameOver');

  const retriesLeft=MAX_RETRIES-levelRetries;
  const canRetry=retriesLeft>0;

  // Retry dots
  let dots='';
  for(let i=0;i<MAX_RETRIES;i++){
    const used=i<levelRetries;
    dots+=`<span style="display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px;
      background:${used?'rgba(255,100,100,0.7)':'rgba(100,180,255,0.5)'};
      box-shadow:${used?'0 0 6px rgba(255,100,100,0.4)':'0 0 6px rgba(100,180,255,0.3)'};"></span>`;
  }
  const retryBadge=`<div style="margin-bottom:20px;">
    <div style="font-family:'Exo 2',-apple-system,'Helvetica Neue',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(180,210,255,0.45);margin-bottom:8px;">Level Retries</div>
    <div>${dots}</div>
    <div style="font-family:'Exo 2',-apple-system,'Helvetica Neue',sans-serif;font-size:11px;letter-spacing:2px;color:${canRetry?'rgba(255,180,100,0.6)':'rgba(255,100,100,0.5)'};margin-top:6px;">
      ${canRetry?`${retriesLeft} retr${retriesLeft>1?'ies':'y'} remaining for Level ${currentLevel}`:'No retries left for this level'}
    </div>
  </div>`;

  const voyagerStatus=(voyager&&voyager.alive)
    ?'<div style="color:rgba(50,255,120,0.5);font-size:12px;letter-spacing:3px;margin-bottom:12px;">&#x1f6f0; VoyaDur 1 still drifts on...</div>'
    :'<div style="color:rgba(255,100,100,0.4);font-size:12px;letter-spacing:3px;margin-bottom:12px;">VoyaDur 1 was lost to the void</div>';

  const o=document.getElementById('screen-overlay');
  o.classList.remove('hidden');
  o.scrollTop=0;   // start every screen at its title, never mid-scroll
  document.body.classList.add('results');
  o.innerHTML=`
    <div class="screen-title title-main">Game Over</div>
    <div class="game-over-reason">${reason}</div>
    <div class="level-stats">Died on Level ${currentLevel}${currentLevel<=FREE_MAX_LEVEL?` of ${FREE_MAX_LEVEL}`:' — Endless Collapse'}</div>
    ${voyagerStatus}
    <div class="screen-score">${totalScore}</div>
    <div class="screen-score-label">Total Score</div>
    <div class="final-stats">
      <div class="stat-item"><span class="stat-val">${totalBHDestroyed}</span><span class="stat-label">Black Holes Destroyed</span></div>
      <div class="stat-item"><span class="stat-val">${currentLevel}</span><span class="stat-label">Level Reached</span></div>
    </div>
    ${retryBadge}
    <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
      ${canRetry?`<button class="btn" data-action="retry" style="border-color:rgba(255,180,100,0.4);color:rgba(255,220,160,0.9);">↺ &nbsp;Retry Level ${currentLevel}</button>`:''}
      <button class="btn" data-action="newgame" style="${canRetry?'background:rgba(0,0,0,0.2);color:rgba(180,210,255,0.5);font-size:12px;padding:12px 28px;':''}">New Game</button>
      <button class="btn" data-action="menu" style="background:rgba(0,0,0,0.2);border-color:rgba(180,210,255,0.18);color:rgba(180,210,255,0.45);font-size:12px;padding:12px 28px;">Main Menu</button>
    </div>
    <div style="font-family:'Exo 2',-apple-system,'Helvetica Neue',sans-serif;font-size:12px;font-weight:300;letter-spacing:4px;color:rgba(180,210,255,0.4);margin-top:32px;text-transform:uppercase;"></div>`;

  // Single delegated listener — no getElementById needed, no cross-fire possible
  o.addEventListener('click', function handler(e){
    const action = e.target.closest('[data-action]');
    if(!action) return;
    o.removeEventListener('click', handler); // remove immediately so it can't double-fire
    const a = action.dataset.action;
    if(a === 'retry') retryLevel();
    else if(a === 'menu') quitToMenu();
    else startGame();
  });
}

// ─── UPDATE ───
function update(dt){
  // LV is set by startLevel(). If anything ever reaches PLAYING without it,
  // fail soft rather than throwing on every frame.
  if(!LV)applyLevelConfig(currentLevel||1);
  if(state!==STATE.PLAYING)return;
  if(bossDefeatBanner>0)bossDefeatBanner=Math.max(0,bossDefeatBanner-dt);
  updateStars(dt);
  gameTimer+=dt; timeLeft=Math.max(0,ROUND_DURATION-gameTimer);
  if(timeLeft<=0){
    if(isBossLevel()&&!isFreeBoss()){
      // A paid boss has to be beaten. Let a death animation already underway finish.
      if(!(boss&&boss.dying>0)){endGame(bossTimeoutReason());return;}
    }else{
      // The free Devourer: outlasting it is a win. Killing it pays far better.
      if(boss&&boss.dying>0)return;
      if(boss){stopBossDrone();boss=null;}
      completeLevel();return;
    }
  }

  bhSpawnTimer+=dt;
  if(bhSpawnTimer>=BH_SPAWN_INTERVAL){bhSpawnTimer=0;spawnBlackHoleBatch();}

  celSpawnTimer+=dt;
  const celInterval=isWarRealm()?2.6:Math.max(0.25,1.0-currentLevel*0.06);
  if(celSpawnTimer>=celInterval){celSpawnTimer=0;spawnCelestial();}

  if(isWarRealm()){updateWar(dt);updateShots(dt);}
  if(boss)updateBoss(dt);
  // A boss attack may have called endGame(). Do not let the rest of this same
  // frame trigger another game-over overlay and leave duplicate retry handlers.
  if(state!==STATE.PLAYING)return;

  // Repurpose the right-hand HUD block during the war.
  {
    const lbl=document.getElementById('bh-label');
    if(lbl)lbl.textContent=boss
      ?(boss.kind==='devourer'?'To Break':boss.kind==='nullsovereign'?'Objective':warWords().allyPlural)
      :(isWarRealm()?(isConvergence()?'Allies':warWords().allyPlural):'Black Holes');
  }

  // Mega comet — once per level at random time
  if(!megaCometSpawned){
    megaCometTimer+=dt;
    if(megaCometTimer>=megaCometDelay){
      megaCometSpawned=true;
      spawnMegaComet();
    }
  }
  // Update mega comet
  if(megaComet&&megaComet.active){
    megaComet.x+=megaComet.vx*dt;
    megaComet.y+=megaComet.vy*dt;
    megaComet.rotation+=megaComet.rotSpeed*dt;
    // Large margin so tail is fully offscreen before removing
    const m=600;
    if(megaComet.x<-m||megaComet.x>W+m||megaComet.y<-m||megaComet.y>H+m){
      megaComet.active=false;megaComet=null;
    }
  }
  // Screen flash decay
  if(screenFlash>0)screenFlash=Math.max(0,screenFlash-dt*4);

  screenArea=W*H;totalBHArea=0;
  for(let i=blackHoles.length-1;i>=0;i--){
    const bh=blackHoles[i];
    if(bh.forming){
      bh.formingTimer+=dt;bh.opacity=Math.min(1,bh.formingTimer/bh.formDuration);
      if(bh.formingTimer>=bh.formDuration){bh.forming=false;bh.opacity=1;}
    } else if(bh.shrinking){
      bh.r-=bh.shrinkSpeed*dt;bh.opacity=Math.max(0,bh.r/30);
      if(bh.r<=0){blackHoles.splice(i,1);continue;}
    } else {
      if(bh.r<bh.maxR)bh.r+=bh.growRate*dt;
    }
    bh.rotation+=bh.rotSpeed*dt;
    // Drift with a soft bounce off the edges
    if(bh.drifts&&!bh.shrinking){
      bh.x+=bh.vx*dt; bh.y+=bh.vy*dt;
      const pad=bh.r*0.5;
      if(bh.x<pad){bh.x=pad;bh.vx=Math.abs(bh.vx);}
      if(bh.x>W-pad){bh.x=W-pad;bh.vx=-Math.abs(bh.vx);}
      if(bh.y<pad){bh.y=pad;bh.vy=Math.abs(bh.vy);}
      if(bh.y>H-pad){bh.y=H-pad;bh.vy=-Math.abs(bh.vy);}
    }
    totalBHArea+=Math.PI*bh.r*bh.r;
    // Update drone sound
    updateBHDrone(bh);
  }

  const darknessPct=totalBHArea/screenArea;
  document.getElementById('darkness-overlay').style.opacity=Math.min(0.85,(darknessPct/LV.loss)*0.85);
  if(darknessPct>LV.loss){endGame('The darkness consumed everything');return;}

  for(let i=celestials.length-1;i>=0;i--){
    const cel=celestials[i];
    if(cel.beingSucked){
      const bh=cel.beingSucked;
      if(!blackHoles.includes(bh)){cel.beingSucked=null;cel.suckProgress=0;continue;}
      cel.suckProgress+=dt*1.5;
      const dx=bh.x-cel.x,dy=bh.y-cel.y,dist=Math.sqrt(dx*dx+dy*dy);
      const pull=200+cel.suckProgress*300;
      cel.vx+=(dx/dist)*pull*dt;cel.vy+=(dy/dist)*pull*dt;
      cel.r*=(1-dt*1.5);cel.opacity=Math.max(0,1-cel.suckProgress);
      cel.rotation+=cel.rotSpeed*dt*(1+cel.suckProgress*5);
      if(dist<bh.r*0.5||cel.r<1||cel.opacity<=0){
        bh.consumed++;bh.r+=cel.r*0.15;
        // Bonus points for allowing object to be sucked in
        const celType=CEL_TYPES.find(t=>t.name===cel.type);
        const bonus=celType?celType.bonus*currentLevel:5*currentLevel;
        score+=bonus;
        addScorePopup(cel.x,cel.y,bonus,'rgba(255,180,50,1)');
        emitParticles(cel.x,cel.y,'rgba(255,150,50,1)',6,60);
        playConsumeSound();
        celestials.splice(i,1);continue;
      }
    } else {
      for(const bh of blackHoles){
        if(bh.forming||bh.shrinking)continue;
        const dx=bh.x-cel.x,dy=bh.y-cel.y,dist=Math.sqrt(dx*dx+dy*dy);
        const pullRange=bh.r*4;
        if(dist<pullRange&&bh.r>cel.r){
          const strength=(1-dist/pullRange)*100;
          cel.vx+=(dx/dist)*strength*dt;cel.vy+=(dy/dist)*strength*dt;
          if(dist<bh.r*1.5){cel.beingSucked=bh;cel.suckProgress=0;}
        }
      }
    }
    cel.x+=cel.vx*dt;cel.y+=cel.vy*dt;cel.rotation+=cel.rotSpeed*dt;
    if(!cel.beingSucked){const m=100;if(cel.x<-m||cel.x>W+m||cel.y<-m||cel.y>H+m)celestials.splice(i,1);}
  }

  // ── Update VoyaDur 1 ──
  if(voyager&&voyager.alive){
    // Wormhole entrance animation
    if(voyager.wormhole){
      voyager.wormholeTimer+=dt;
      voyager.opacity=Math.min(1,voyager.wormholeTimer/voyager.wormholeDuration);
      if(voyager.wormholeTimer>=voyager.wormholeDuration){
        voyager.wormhole=false;
        voyager.opacity=1;
      }
    }

    // Drift gently with drag
    voyager.vx*=0.995;
    voyager.vy*=0.995;
    voyager.x+=voyager.vx*dt;
    voyager.y+=voyager.vy*dt;
    voyager.rotation+=voyager.rotSpeed*dt;
    // Bounce off screen edges to keep it in play
    if(voyager.x<30){voyager.x=30;voyager.vx=Math.abs(voyager.vx);}
    if(voyager.x>W-30){voyager.x=W-30;voyager.vx=-Math.abs(voyager.vx);}
    if(voyager.y<60){voyager.y=60;voyager.vy=Math.abs(voyager.vy);}
    if(voyager.y>H-40){voyager.y=H-40;voyager.vy=-Math.abs(voyager.vy);}

    // Black hole gravity affects Voyager
    if(voyager.invuln>0)voyager.invuln-=dt;
    if(voyager.hurt>0)voyager.hurt=Math.max(0,voyager.hurt-dt*2.5);
    if(!voyager.beingSucked){
      for(const bh of blackHoles){
        if(bh.forming||bh.shrinking)continue;
        const dx=bh.x-voyager.x,dy=bh.y-voyager.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        const pullRange=bh.r*4;
        if(dist<pullRange&&bh.r>voyager.r){
          const strength=(1-dist/pullRange)*80;
          voyager.vx+=(dx/dist)*strength*dt;
          voyager.vy+=(dy/dist)*strength*dt;
          if(dist<bh.r*1.5){
            voyager.beingSucked=bh;
            voyager.suckProgress=0;
          }
        }
      }
    } else {
      const bh=voyager.beingSucked;
      if(!blackHoles.includes(bh)||bh.shrinking){
        voyager.beingSucked=null;voyager.suckProgress=0;
      } else {
        voyager.suckProgress+=dt*1.2;
        const dx=bh.x-voyager.x,dy=bh.y-voyager.y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        const pull=150+voyager.suckProgress*250;
        voyager.vx+=(dx/dist)*pull*dt;
        voyager.vy+=(dy/dist)*pull*dt;
        voyager.opacity=Math.max(0,1-voyager.suckProgress*0.8);
        if(dist<bh.r*0.5||voyager.opacity<=0.05){
          damageVoyager(bh);
        }
      }
    }
  }

  updateParticles(dt);
  updateScorePopups(dt);
  document.getElementById('score-display').textContent=totalScore+score;
  document.getElementById('level-display').textContent=currentLevel;
  document.getElementById('time-display').textContent=Math.ceil(timeLeft);
  if(boss){document.getElementById('bh-display').textContent=boss.kind==='devourer'?seversLeft():boss.kind==='nullsovereign'?`${boss.stage+1}/3`:alliesAlive();}
  else document.getElementById('bh-display').textContent=isWarRealm()
    ? angels.filter(a=>a.alive).length
    : blackHoles.filter(b=>!b.forming&&!b.shrinking).length;
  document.getElementById('timer-bar').style.width=`${(timeLeft/ROUND_DURATION)*100}%`;
  // Voyager HUD
  const vhud=document.getElementById('voyager-hud');
  if(voyager&&voyager.alive){
    vhud.style.color='rgba(50,255,120,0.6)';
    vhud.textContent=isFinalBoss()
      ? `\u{1F6F0} VoyaDur 1 \u2022 ${voyager.hp}/${voyager.maxHp} \u2022 carry the final signal`
      :(isBossLevel()&&bossKind()==='devourer'&&!isFreeBoss())
      ? `\u{1F6F0} VoyaDur 1 \u2022 ${voyager.hp}/${voyager.maxHp} \u2022 must survive this level`
      : '\u{1F6F0} VoyaDur 1 active \u2022 x2 points if it survives';
  } else {
    vhud.style.color='rgba(255,100,100,0.3)';
    vhud.textContent='VoyaDur 1 lost \u2022 no x2 this round';
  }
}

// ─── RENDER ───
function render(t){
  const secs=t/1000;
  // The nebula canvas already carries the base colour, so when it exists the
  // clear and fill are redundant work on every frame.
  if(!nebulaCanvas){ctx.clearRect(0,0,W,H);ctx.fillStyle='#030308';ctx.fillRect(0,0,W,H);}
  if(nebulaCanvas)ctx.drawImage(nebulaCanvas,0,0);
  drawStars(secs);
  for(const bh of blackHoles){
    if(bh.forming&&bh.opacity<0.3)continue;
    for(let i=0;i<12;i++){const a=secs*bh.rotSpeed*0.3+(i/12)*Math.PI*2,r1=bh.r*1.2,r2=bh.r*3;
      ctx.beginPath();ctx.moveTo(bh.x+Math.cos(a)*r1,bh.y+Math.sin(a)*r1);
      const ca=a+0.3*Math.sin(secs+i);
      ctx.quadraticCurveTo(bh.x+Math.cos(a+0.2)*(r1+r2)*0.5,bh.y+Math.sin(a+0.2)*(r1+r2)*0.5,bh.x+Math.cos(ca)*r2,bh.y+Math.sin(ca)*r2);
      ctx.strokeStyle=`rgba(100,60,150,${0.08*bh.opacity})`;ctx.lineWidth=1;ctx.stroke();}
  }
  for(const cel of celestials)drawCelestial(cel,secs);
  // The war, beneath the black holes so they still read as the main threat
  if(isWarRealm()){
    for(const a of angels)drawAlly(a,secs);
    for(const d of demons)drawFoe(d,secs);
    drawShots();
  }
  // Draw VoyaDur 1
  if(voyager&&voyager.alive)drawVoyager(voyager,secs);
  for(const bh of blackHoles)drawBlackHole(bh,secs);
  // Boss last of the hazards — it's the focus, ordinary holes shouldn't cover it.
  if(boss)drawBoss(secs);
  // Mega comet (drawn on top of everything)
  if(megaComet&&megaComet.active)drawMegaComet(megaComet,secs);
  drawParticles();drawSwipeTrails(secs);drawScorePopups();
  drawBossDefeatedBanner();
  // Screen flash from comet explosion
  if(screenFlash>0){
    ctx.save();
    ctx.globalAlpha=screenFlash*0.7;
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════
// ─── WARP SEQUENCE (light-speed travel between levels)
// ════════════════════════════════════════════════════
let warp=null;

function playWarpSound(){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;

  // Deep rumble build
  const rumble=audioCtx.createOscillator(), rG=audioCtx.createGain(), rF=audioCtx.createBiquadFilter();
  rumble.type='sawtooth'; rumble.frequency.setValueAtTime(40,now); rumble.frequency.linearRampToValueAtTime(120,now+0.8);
  rF.type='lowpass'; rF.frequency.value=200; rF.Q.value=3;
  rG.gain.setValueAtTime(0,now); rG.gain.linearRampToValueAtTime(0.12,now+0.4);
  rG.gain.setValueAtTime(0.12,now+0.9); rG.gain.linearRampToValueAtTime(0,now+1.4);
  rumble.connect(rF); rF.connect(rG); rG.connect(masterGain); rumble.start(now); rumble.stop(now+1.5);

  // Doppler whoosh — pitch rockets up then fades
  const whoosh=audioCtx.createOscillator(), wG=audioCtx.createGain(), wF=audioCtx.createBiquadFilter();
  whoosh.type='sawtooth'; whoosh.frequency.setValueAtTime(80,now+0.1); whoosh.frequency.linearRampToValueAtTime(1800,now+0.9);
  wF.type='bandpass'; wF.frequency.setValueAtTime(300,now+0.1); wF.frequency.linearRampToValueAtTime(2000,now+0.9); wF.Q.value=1.5;
  wG.gain.setValueAtTime(0,now+0.1); wG.gain.linearRampToValueAtTime(0.09,now+0.5);
  wG.gain.setValueAtTime(0.09,now+0.8); wG.gain.linearRampToValueAtTime(0,now+1.3);
  whoosh.connect(wF); wF.connect(wG); wG.connect(masterGain); whoosh.start(now+0.1); whoosh.stop(now+1.4);

  // High shimmer burst at peak warp
  const shimmer=audioCtx.createOscillator(), shG=audioCtx.createGain();
  shimmer.type='sine'; shimmer.frequency.value=1200;
  shG.gain.setValueAtTime(0,now+0.6); shG.gain.linearRampToValueAtTime(0.04,now+0.8);
  shG.gain.linearRampToValueAtTime(0,now+1.5);
  shimmer.connect(shG); shG.connect(masterGain); shimmer.start(now+0.6); shimmer.stop(now+1.6);

  // Exit thud — arrival
  const thud=audioCtx.createOscillator(), tG=audioCtx.createGain();
  thud.type='sine'; thud.frequency.setValueAtTime(120,now+1.5); thud.frequency.linearRampToValueAtTime(40,now+2.0);
  tG.gain.setValueAtTime(0.1,now+1.5); tG.gain.linearRampToValueAtTime(0,now+2.2);
  thud.connect(tG); tG.connect(masterGain); thud.start(now+1.5); thud.stop(now+2.3);
}

function startWarp(onComplete){
  state=STATE.WARP;
  // Hide HUD during warp
  document.getElementById('ui-overlay').style.opacity='0';

  // Build streak pool — stars become stretched light trails
  const streaks=[];
  const cx=W/2, cy=H/2;
  for(let i=0;i<260;i++){
    const angle=Math.random()*Math.PI*2;
    const startDist=20+Math.random()*Math.max(W,H)*0.15;
    streaks.push({
      angle,
      dist:startDist,
      speed:0,                         // accelerates over time
      baseSpeed:180+Math.random()*320,
      length:4+Math.random()*8,        // grows during warp
      width:0.5+Math.random()*1.0,
      hue:Math.random()<0.7?210+Math.random()*40:Math.random()*30, // blue-white or warm
      brightness:0.5+Math.random()*0.5,
    });
  }

  // Also scatter a few chunky bright streaks for drama
  for(let i=0;i<30;i++){
    const angle=Math.random()*Math.PI*2;
    streaks.push({
      angle, dist:10+Math.random()*60,
      speed:0, baseSpeed:400+Math.random()*600,
      length:12+Math.random()*30, width:1.0+Math.random()*2,
      hue:190+Math.random()*50, brightness:0.9,
    });
  }

  warp={
    time:0,
    totalDuration:1.8,   // trimmed from 2.4 — the gaps between levels were
                         // most of what made the free run feel slow
    streaks,
    flashAlpha:0,
    onComplete,
    cx,cy,
  };

  playWarpSound();
}

function updateWarp(dt){
  if(!warp)return;
  warp.time+=dt;
  const t=warp.time;
  const dur=warp.totalDuration;

  // Phase: 0→0.7 build, 0.7→1.6 full warp, 1.6→2.4 exit flash + fade
  let speedMult;
  if(t<0.7){
    speedMult=Math.pow(t/0.7,2.5);            // ease in (exponential)
  } else if(t<1.6){
    speedMult=1.0;                             // full warp
  } else {
    speedMult=Math.max(0,1-(t-1.6)/0.5);      // quick decel
  }

  // White flash at peak (t~1.0) and fade-to-black at exit (t~1.8)
  if(t>=0.85&&t<1.1){
    warp.flashAlpha=Math.min(1,(t-0.85)/0.18);
  } else if(t>=1.1&&t<1.5){
    warp.flashAlpha=Math.max(0,1-(t-1.1)/0.35);
  } else if(t>=1.6){
    warp.flashAlpha=Math.min(1,(t-1.6)/0.35); // fade to black for transition
  } else {
    warp.flashAlpha=0;
  }

  for(const s of warp.streaks){
    s.speed=s.baseSpeed*speedMult;
    s.dist+=s.speed*dt;
    // Stretch length proportional to speed
    s.length=( 4+Math.random()*4 ) + s.speed*0.045;
  }

  if(t>=dur){
    const cb=warp.onComplete;
    warp=null;
    document.getElementById('ui-overlay').style.opacity='1';
    state=STATE.LEVEL_TRANS;
    if(cb)cb();
  }
}

function renderWarp(t){
  if(!warp)return;
  const {cx,cy,streaks,flashAlpha,time}=warp;

  // Deep space black
  ctx.fillStyle='#000005';
  ctx.fillRect(0,0,W,H);

  // Draw nebula hint during build phase (fades out as we accelerate)
  if(nebulaCanvas&&time<0.8){
    ctx.save();
    ctx.globalAlpha=(1-time/0.8)*0.4;
    ctx.drawImage(nebulaCanvas,0,0);
    ctx.restore();
  }

  // Draw star streaks radiating from center
  for(const s of streaks){
    if(s.dist<=0)continue;
    const x1=cx+Math.cos(s.angle)*s.dist;
    const y1=cy+Math.sin(s.angle)*s.dist;
    const x0=cx+Math.cos(s.angle)*(s.dist-s.length);
    const y0=cy+Math.sin(s.angle)*(s.dist-s.length);

    // Skip if both points off screen
    if(x1<-50&&x0<-50)continue;
    if(x1>W+50&&x0>W+50)continue;
    if(y1<-50&&y0<-50)continue;
    if(y1>H+50&&y0>H+50)continue;

    const speedFrac=Math.min(1,s.speed/800);
    const alpha=s.brightness*(0.4+0.6*speedFrac);

    const grad=ctx.createLinearGradient(x0,y0,x1,y1);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    if(s.hue>100&&s.hue<260){
      // Blue-white
      grad.addColorStop(0.6,`hsla(${s.hue},80%,85%,${alpha*0.5})`);
      grad.addColorStop(1,`hsla(${s.hue},90%,98%,${alpha})`);
    } else {
      // Warm orange/white
      grad.addColorStop(0.6,`hsla(${s.hue},90%,80%,${alpha*0.5})`);
      grad.addColorStop(1,`hsla(${s.hue},100%,98%,${alpha})`);
    }
    ctx.beginPath();
    ctx.moveTo(x0,y0);
    ctx.lineTo(x1,y1);
    ctx.strokeStyle=grad;
    ctx.lineWidth=s.width*(0.5+speedFrac*1.5);
    ctx.stroke();
  }

  // Central glow at peak warp
  if(time>0.5&&time<1.6){
    const glowIntensity=Math.min(1,(time-0.5)/0.4)*Math.max(0,1-(time-1.2)/0.4);
    const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.35);
    grd.addColorStop(0,`rgba(180,220,255,${0.18*glowIntensity})`);
    grd.addColorStop(0.4,`rgba(100,160,255,${0.08*glowIntensity})`);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.arc(cx,cy,W*0.35,0,Math.PI*2);ctx.fill();
  }

  // White flash overlay
  if(flashAlpha>0){
    ctx.fillStyle=`rgba(230,240,255,${flashAlpha})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ─── LOOP ───
function gameLoop(timestamp){
  const dt=Math.min(0.05,(timestamp-lastTime)/1000);lastTime=timestamp;
  if(state===STATE.CUTSCENE){
    updateStars(dt);
    if(continuumEnding){updateContinuumEnding(dt);renderContinuumEnding(timestamp);}
    else{updateCutscene(dt);renderCutscene(timestamp);}
  } else if(state===STATE.TUTORIAL){
    updateTutorial(dt);
    renderTutorial(timestamp);
  } else if(state===STATE.WARP){
    updateWarp(dt);
    renderWarp(timestamp);
  } else {
    if(state!==STATE.PLAYING)updateStars(dt); // menu, over, paused — keep stars drifting
    update(dt);render(timestamp);
  }
  requestAnimationFrame(gameLoop);
}

document.getElementById('screen-overlay').addEventListener('click', function handler(e){
  if(e.target.closest('#gc-open')){ gcShow(); return; }
  const iap=e.target.closest('#menu-unlock [data-action]');
  if(iap){ handleUnlockAction(iap.dataset.action); return; }
  if(e.target.closest('#continue-btn')){
    // Progress past the free wall only counts while the unlock is owned.
    pendingStartLevel=isUnlocked()?savedProgress():Math.min(savedProgress(),FREE_MAX_LEVEL);
    startGame(pendingStartLevel);
    return;
  }
  if(e.target.closest('#how-to-play')){
    pendingStartLevel=1;
    startTutorial();
    return;
  }
  const jump=e.target.closest('[data-dev-level]');
  if(jump){
    pendingStartLevel=parseInt(jump.dataset.devLevel,10);
    startGame(pendingStartLevel);
    return;
  }
  if(!e.target.closest('#start-btn')) return;
  pendingStartLevel=1;
  try{localStorage.removeItem(PROGRESS_KEY);}catch(err){}   // New Game means new
  // First run gets the tutorial; after that Launch goes straight in.
  if(!tutorialSeen())startTutorial();
  else startGame();
});

document.getElementById('tut-skip').addEventListener('click',e=>{e.stopPropagation();endTutorial(true);});
document.getElementById('tut-next').addEventListener('click',e=>{e.stopPropagation();nextTutorialStep();});

// Continue only appears once there's something to continue from.

  const c=document.getElementById('continue-btn');

  else c.style.display='none';

paintStartButtons();

// Apple requires a Restore path reachable without finishing the free
// campaign again — a reinstall would otherwise strand a paying player.

  m.innerHTML=`
    <button class="btn" data-action="unlock"
      style="font-size:11px;letter-spacing:2px;padding:10px 18px;max-width:88vw;
      border-color:rgba(255,160,80,0.4);color:rgba(255,210,150,0.9);

    <div style="margin-top:10px;">
      <button data-action="restore" style="background:none;border:none;cursor:pointer;

}
paintMenuUnlock();

// ─── DEV LEVEL PICKER ───
// Rendered while either dev flag is true, so it disappears from the shipping
// build. Jumping straight to a paid level works even with the paywall live —
// the wall is enforced when a level is completed, not when one is started.
// The game-over and victory screens overwrite this overlay's innerHTML, which
// destroys the title screen. Keep a copy so Main Menu can put it back.
let startScreenHTML=null;
function captureStartScreen(){
  const o=document.getElementById('screen-overlay');
  if(o&&!startScreenHTML)startScreenHTML=o.innerHTML;
}
function restoreStartScreen(){
  document.body.classList.remove('results');
  const o=document.getElementById('screen-overlay');
  if(!o||!startScreenHTML)return;
  o.innerHTML=startScreenHTML;
  // Re-render the parts that carry state.
  paintBestLine();
  paintStartButtons();
  paintMenuUnlock();
}

if(DEV_UNLOCK_ALL||DEV_LEVEL_PICKER){
  // The levels worth checking after any change: onboarding, the first
