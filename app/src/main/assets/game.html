<script>
// ═══════════════════════════════════════════════════
// ─── AUDIO ENGINE (Web Audio — procedural synthesis)
// ═══════════════════════════════════════════════════
let audioCtx=null, masterGain=null, ambientNodes=[], bhDrones=new Map(), audioStarted=false, audioMuted=false;

function initAudio(){
  if(audioStarted)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=0.5;
  masterGain.connect(audioCtx.destination);
  audioStarted=true;
}

function toggleMute(){
  audioMuted=!audioMuted;
  rampMaster(audioMuted?0:0.5,0.1);
  document.getElementById('mute-btn').innerHTML=audioMuted?'&#x1f507;':'&#x1f50a;';
}
document.getElementById('mute-btn').addEventListener('click',toggleMute);

// ── Ambient celestial pad ──
function startAmbient(){
  if(!audioCtx)return; stopAmbient();
  const layers=[
    {f:55,type:'sine',vol:0.025,filterF:180},
    {f:82.5,type:'sine',vol:0.018,filterF:220},
    {f:110,type:'triangle',vol:0.012,filterF:280},
    {f:164.81,type:'sine',vol:0.008,filterF:350},
  ];
  const now=audioCtx.currentTime;
  layers.forEach((l,i)=>{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const pan=audioCtx.createStereoPanner();
    const filter=audioCtx.createBiquadFilter();
    osc.type=l.type; osc.frequency.value=l.f; osc.detune.value=(Math.random()-0.5)*12;
    filter.type='lowpass'; filter.frequency.value=l.filterF; filter.Q.value=1.5;
    gain.gain.setValueAtTime(0,now); gain.gain.linearRampToValueAtTime(l.vol,now+4);
    pan.pan.value=(Math.random()-0.5)*0.5;
    osc.connect(filter); filter.connect(gain); gain.connect(pan); pan.connect(masterGain);
    osc.start(now);
    // Slow LFO on filter
    const lfo=audioCtx.createOscillator(); const lfoG=audioCtx.createGain();
    lfo.type='sine'; lfo.frequency.value=0.04+Math.random()*0.08;
    lfoG.gain.value=50+i*20; lfo.connect(lfoG); lfoG.connect(filter.frequency); lfo.start(now);
    ambientNodes.push({osc,gain,lfo});
  });
  // High shimmer
  const sh=audioCtx.createOscillator(), shG=audioCtx.createGain(), shF=audioCtx.createBiquadFilter();
  sh.type='sine'; sh.frequency.value=440; sh.detune.value=7;
  shF.type='bandpass'; shF.frequency.value=500; shF.Q.value=10;
  shG.gain.setValueAtTime(0,now); shG.gain.linearRampToValueAtTime(0.006,now+6);
  sh.connect(shF); shF.connect(shG); shG.connect(masterGain); sh.start(now);
  const shL=audioCtx.createOscillator(), shLG=audioCtx.createGain();
  shL.type='sine'; shL.frequency.value=0.025; shLG.gain.value=180;
  shL.connect(shLG); shLG.connect(sh.frequency); shL.start(now);
  ambientNodes.push({osc:sh,gain:shG,lfo:shL});
}

function stopAmbient(){
  for(const n of ambientNodes){try{n.osc.stop();}catch(e){}try{n.lfo.stop();}catch(e){}}
  ambientNodes=[];
}

// ═══════════════════════════════════════════════════
// ─── BACKGROUND MUSIC (procedural, loops forever)
// ═══════════════════════════════════════════════════
// D minor pentatonic: D3 F3 G3 A3 C4 D4 F4 G4 A4 C5 D5
// Tempo: 85 BPM — one bar = 2.82s, 16th note = 0.176s
const MUSIC_BPM = 85;
const MUSIC_BEAT = 60 / MUSIC_BPM;          // one quarter note
const MUSIC_16TH = MUSIC_BEAT / 4;          // one 16th note

// Scale in Hz — D minor pentatonic across 2 octaves
const SCALE = [
  146.83, // D3
  174.61, // F3
  196.00, // G3
  220.00, // A3
  261.63, // C4
  293.66, // D4
  349.23, // F4
  392.00, // G4
  440.00, // A4
  523.25, // C5
  587.33, // D5
];

let musicGain = null;       // dedicated music bus
let musicNodes = [];        // all scheduled nodes, for cleanup
let musicPlaying = false;
let musicScheduler = null;  // setInterval handle
let musicNextTime = 0;      // next Web Audio clock time to schedule
let musicBar = 0;           // which bar we're on (loops)
let musicLevel = 1;         // synced to game level for intensity

// Melody patterns — 16 steps, index into SCALE, -1 = rest
const MELODY_A = [7, -1, 9, -1,  8, -1, 7,  5,  3, -1, 5, -1,  3,  1,  0, -1];
const MELODY_B = [10,-1, 9,  8,  7, -1, 5, -1,  3,  5, 7, -1,  8, -1,  7, -1];
const BASS_PAT = [0,  0, -1, 0, -1,  0, -1, -1,  2,  2, -1, 2, -1,  2, -1, -1];
// Arpeggio: runs up the chord on every other bar
const ARP_PAT  = [0,  2,  3,  5,  7,  5,  3,  2,  0,  2,  3,  5,  7,  8, 10, -1];

function startMusic(){
  if(!audioCtx || musicPlaying) return;
  musicPlaying = true;
  musicBar = 0;
  musicNextTime = audioCtx.currentTime + 0.1;

  // Dedicated gain bus for music, sits under the master
  musicGain = audioCtx.createGain();
  musicGain.gain.setValueAtTime(0, audioCtx.currentTime);
  musicGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 3);
  musicGain.connect(masterGain);

  // Schedule ahead by ~200ms, refresh every 100ms
  musicScheduler = setInterval(scheduleMusicChunk, 100);
}

function stopMusic(){
  if(!musicPlaying) return;
  musicPlaying = false;
  clearInterval(musicScheduler);
  musicScheduler = null;

  // The fade-out cleanup runs 1.6s later. It used to read the globals when it
  // fired, so retrying or starting a new game inside that window destroyed the
  // freshly started music and left musicGain null — after which
  // scheduleMusicChunk bails on every tick and the track never returns.
  // Capture what's dying, hand the globals straight back.
  const dyingGain = musicGain;
  const dyingNodes = musicNodes;
  musicGain = null;
  musicNodes = [];

  if(dyingGain){
    try{ dyingGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.5); }catch(e){}
    setTimeout(()=>{
      for(const n of dyingNodes){ try{ n.stop(); }catch(e){} }
      try{ dyingGain.disconnect(); }catch(e){}
    }, 1600);
  }
}

function setMusicIntensity(level){
  // Called on each new level — ramps music gain up slightly each level
  musicLevel = level;
  if(!musicGain || !audioCtx) return;
  const vol = Math.min(0.32, 0.18 + (level - 1) * 0.016);
  musicGain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 2);
}

function scheduleNote(freq, startTime, duration, vol, type='sine', detune=0){
  if(!audioCtx || !musicGain) return;
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  const flt = audioCtx.createBiquadFilter();

  osc.type = type;
  osc.frequency.value = freq;
  osc.detune.value = detune;
  flt.type = 'lowpass';
  flt.frequency.value = 1800;
  flt.Q.value = 0.8;

  // Envelope: fast attack, sustain, release
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(vol, startTime + 0.012);
  g.gain.setValueAtTime(vol, startTime + duration * 0.65);
  g.gain.linearRampToValueAtTime(0, startTime + duration * 0.95);

  osc.connect(flt); flt.connect(g); g.connect(musicGain);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
  musicNodes.push(osc);

  // Prune stopped nodes periodically so array doesn't grow forever
  if(musicNodes.length > 400) musicNodes = musicNodes.filter(n => {
    try{ return n.playbackState !== 3; }catch(e){ return false; }
  });
}

function scheduleMusicChunk(){
  if(!audioCtx || !musicPlaying || !musicGain) return;
  const scheduleAhead = 0.25; // seconds to look ahead

  while(musicNextTime < audioCtx.currentTime + scheduleAhead){
    scheduleMusicBar(musicNextTime, musicBar);
    musicNextTime += MUSIC_BEAT * 4; // one 4/4 bar
    musicBar = (musicBar + 1) % 8;   // 8-bar loop
  }
}

function scheduleMusicBar(barStart, barIndex){
  // Alternate melody patterns every 2 bars
  const melodyPat = (barIndex % 4 < 2) ? MELODY_A : MELODY_B;
  const useArp    = (barIndex % 2 === 1);           // arp on odd bars
  const useBeat   = musicLevel >= 2;                // kick/hat from level 2+
  const useChords = musicLevel >= 4;                // pad chords from level 4+
  const fastArp   = musicLevel >= 6;                // faster arp from level 6+

  for(let step = 0; step < 16; step++){
    const t = barStart + step * MUSIC_16TH;

    // ── Melody (lead synth) ──
    const mIdx = melodyPat[step];
    if(mIdx >= 0){
      const freq = SCALE[mIdx];
      const vol  = 0.055 + (step % 4 === 0 ? 0.015 : 0);  // accent on beats
      scheduleNote(freq, t, MUSIC_16TH * 1.6, vol, 'triangle', 3);
      // Soft octave below for body
      scheduleNote(freq / 2, t, MUSIC_16TH * 1.4, vol * 0.3, 'sine', -2);
    }

    // ── Bass line ──
    const bIdx = BASS_PAT[step];
    if(bIdx >= 0){
      const freq = SCALE[bIdx] / 2; // one octave down
      scheduleNote(freq, t, MUSIC_16TH * 2.2, 0.07, 'sawtooth', 0);
      scheduleNote(freq, t, MUSIC_16TH * 2.2, 0.04, 'sine', 7); // sub layer
    }

    // ── Arpeggio ──
    if(useArp){
      const arpStep = fastArp ? step : Math.floor(step / 2);
      const aIdx = ARP_PAT[fastArp ? step : (arpStep % ARP_PAT.length)];
      if(aIdx >= 0){
        const freq = SCALE[aIdx];
        scheduleNote(freq, t, MUSIC_16TH * 0.8, 0.025, 'sine', 5);
      }
    }

    // ── Rhythmic beat (from level 2) ──
    if(useBeat){
      // Kick on beats 1 and 3 (steps 0, 8)
      if(step === 0 || step === 8){
        scheduleKick(t, 0.10);
      }
      // Snare on beats 2 and 4 (steps 4, 12)
      if(step === 4 || step === 12){
        scheduleSnare(t, 0.045);
      }
      // Hi-hat every 2 steps from level 3+
      if(musicLevel >= 3 && step % 2 === 1){
        scheduleHihat(t, 0.018);
      }
      // Faster hi-hat from level 5+
      if(musicLevel >= 5 && step % 2 === 0 && step !== 0 && step !== 8){
        scheduleHihat(t + MUSIC_16TH * 0.5, 0.012);
      }
    }

    // ── Pad chords (from level 4) ──
    if(useChords && step % 8 === 0){
      // Dm chord voicing: D F A
      const chord = [SCALE[0], SCALE[1], SCALE[3]]; // D F A
      for(const freq of chord){
        scheduleNote(freq * 2, t, MUSIC_BEAT * 3.5, 0.018, 'sine', (Math.random()-0.5)*8);
      }
    }
  }
}

function scheduleKick(t, vol){
  if(!audioCtx || !musicGain) return;
  // Sine wave pitch-drops from 150→40Hz — classic kick
  const osc = audioCtx.createOscillator();
  const g   = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(150, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.08);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  osc.connect(g); g.connect(musicGain);
  osc.start(t); osc.stop(t + 0.2);
  musicNodes.push(osc);
}

function scheduleSnare(t, vol){
  if(!audioCtx || !musicGain) return;
  // Noise burst + tone for snare crack
  const bufSize = audioCtx.sampleRate * 0.12;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  const src = audioCtx.createBufferSource();
  const g   = audioCtx.createGain();
  const flt = audioCtx.createBiquadFilter();
  src.buffer = buf;
  flt.type = 'highpass'; flt.frequency.value = 1500;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  src.connect(flt); flt.connect(g); g.connect(musicGain);
  src.start(t); src.stop(t + 0.13);
  musicNodes.push(src);
}

function scheduleHihat(t, vol){
  if(!audioCtx || !musicGain) return;
  const bufSize = audioCtx.sampleRate * 0.04;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1);
  const src = audioCtx.createBufferSource();
  const g   = audioCtx.createGain();
  const flt = audioCtx.createBiquadFilter();
  src.buffer = buf;
  flt.type = 'highpass'; flt.frequency.value = 6000;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
  src.connect(flt); flt.connect(g); g.connect(musicGain);
  src.start(t); src.stop(t + 0.04);
  musicNodes.push(src);
}



// ── Black hole drone: ominous, scales with size ──
function startBHDrone(bh){
  if(!audioCtx)return;
  const osc1=audioCtx.createOscillator(), osc2=audioCtx.createOscillator();
  const gain=audioCtx.createGain(), filter=audioCtx.createBiquadFilter();
  const dist=audioCtx.createWaveShaper();
  osc1.type='sawtooth'; osc1.frequency.value=30;
  osc2.type='square'; osc2.frequency.value=31.5;
  filter.type='lowpass'; filter.frequency.value=80; filter.Q.value=6;
  const curve=new Float32Array(256);
  for(let i=0;i<256;i++){const x=(i/128)-1;curve[i]=(Math.PI+3)*x/(Math.PI+3*Math.abs(x));}
  dist.curve=curve; dist.oversample='2x';
  gain.gain.value=0;
  osc1.connect(dist); osc2.connect(dist); dist.connect(filter); filter.connect(gain); gain.connect(masterGain);
  osc1.start(); osc2.start();
  // Tremolo
  const trem=audioCtx.createOscillator(), tremG=audioCtx.createGain();
  trem.type='sine'; trem.frequency.value=2; tremG.gain.value=0.01;
  trem.connect(tremG); tremG.connect(gain.gain); trem.start();
  bhDrones.set(bh,{osc1,osc2,gain,filter,dist,trem,tremG});
}

function updateBHDrone(bh){
  const d=bhDrones.get(bh); if(!d||!audioCtx)return;
  const sf=Math.min(1,bh.r/bh.maxR);
  const ff=bh.forming?bh.opacity:1;
  const skf=bh.shrinking?Math.max(0,bh.opacity):1;
  const f=sf*ff*skf;
  const tv=Math.min(0.09,f*0.08);
  d.gain.gain.linearRampToValueAtTime(tv,audioCtx.currentTime+0.1);
  const bf=45-sf*20;
  d.osc1.frequency.linearRampToValueAtTime(bf,audioCtx.currentTime+0.1);
  d.osc2.frequency.linearRampToValueAtTime(bf*1.05,audioCtx.currentTime+0.1);
  d.filter.frequency.linearRampToValueAtTime(60+sf*200,audioCtx.currentTime+0.1);
  d.trem.frequency.linearRampToValueAtTime(1.5+sf*6,audioCtx.currentTime+0.1);
  d.tremG.gain.linearRampToValueAtTime(0.005+sf*0.03,audioCtx.currentTime+0.1);
}

function stopBHDrone(bh){
  const d=bhDrones.get(bh); if(!d)return;
  try{d.gain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.12);
  setTimeout(()=>{try{d.osc1.stop();}catch(e){}try{d.osc2.stop();}catch(e){}try{d.trem.stop();}catch(e){}},180);}catch(e){}
  bhDrones.delete(bh);
}

function stopAllBHDrones(){for(const[bh]of bhDrones)stopBHDrone(bh);}

// ── Comical POP ──
function playPopSound(x){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  const pan=audioCtx.createStereoPanner();
  pan.pan.value=Math.max(-1,Math.min(1,(x/W)*2-1));
  // Main pop: fast sine pitch drop
  const o1=audioCtx.createOscillator(), g1=audioCtx.createGain();
  o1.type='sine';
  o1.frequency.setValueAtTime(950,now);
  o1.frequency.exponentialRampToValueAtTime(130,now+0.14);
  o1.frequency.exponentialRampToValueAtTime(55,now+0.3);
  g1.gain.setValueAtTime(0.28,now);
  g1.gain.linearRampToValueAtTime(0.35,now+0.025);
  g1.gain.exponentialRampToValueAtTime(0.001,now+0.35);
  o1.connect(g1); g1.connect(pan); pan.connect(masterGain);
  o1.start(now); o1.stop(now+0.4);
  // Boing harmonic
  const o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
  o2.type='triangle';
  o2.frequency.setValueAtTime(1500,now);
  o2.frequency.exponentialRampToValueAtTime(180,now+0.12);
  g2.gain.setValueAtTime(0.14,now);
  g2.gain.exponentialRampToValueAtTime(0.001,now+0.2);
  o2.connect(g2); g2.connect(pan);
  o2.start(now); o2.stop(now+0.25);
  // Bubble noise burst
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.07,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,4);
  const ns=audioCtx.createBufferSource(), ng=audioCtx.createGain(), nf=audioCtx.createBiquadFilter();
  ns.buffer=buf; nf.type='bandpass'; nf.frequency.value=2200; nf.Q.value=2;
  ng.gain.setValueAtTime(0.12,now); ng.gain.exponentialRampToValueAtTime(0.001,now+0.09);
  ns.connect(nf); nf.connect(ng); ng.connect(pan);
  ns.start(now);
}

// ── Swipe hit ──
/// Short pitched blip. Allies read higher and cooler than hostiles.
let bossDrone=null;
/// A low churn that rises in pitch as arms come off, so progress is audible.
function startBossDrone(){
  if(!audioCtx||bossDrone)return;
  const now=audioCtx.currentTime;
  const o=audioCtx.createOscillator(), o2=audioCtx.createOscillator();
  const g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=38;
  o2.type='square';  o2.frequency.value=57;
  f.type='lowpass';  f.frequency.value=180; f.Q.value=6;
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(0.09,now+2.5);
  o.connect(f);o2.connect(f);f.connect(g);g.connect(masterGain);
  o.start(now);o2.start(now);
  bossDrone={o,o2,g,f};
}
function setBossDronePitch(armsLeft){
  if(!bossDrone||!audioCtx)return;
  const k=(BOSS_ARMS-armsLeft)/BOSS_ARMS;
  const now=audioCtx.currentTime;
  try{
    bossDrone.o.frequency.linearRampToValueAtTime(38+k*46,now+0.6);
    bossDrone.o2.frequency.linearRampToValueAtTime(57+k*70,now+0.6);
    bossDrone.f.frequency.linearRampToValueAtTime(180+k*420,now+0.6);
  }catch(e){}
}
function stopBossDrone(){
  if(!bossDrone||!audioCtx)return;
  const now=audioCtx.currentTime, d=bossDrone;
  bossDrone=null;
  try{
    d.g.gain.cancelScheduledValues(now);
    d.g.gain.setValueAtTime(d.g.gain.value,now);
    d.g.gain.linearRampToValueAtTime(0,now+0.8);
  }catch(e){}
  setTimeout(()=>{try{d.o.stop();d.o2.stop();d.g.disconnect();}catch(e){}},900);
}

function playLaser(x,fromAlly){
  if(!audioCtx||audioMuted)return;
  const now=audioCtx.currentTime;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), pan=audioCtx.createStereoPanner();
  o.type='sawtooth';
  const f0=fromAlly?1250:620;
  o.frequency.setValueAtTime(f0,now);
  o.frequency.exponentialRampToValueAtTime(f0*0.35,now+0.11);

  g.gain.exponentialRampToValueAtTime(0.0008,now+0.13);
  pan.pan.value=Math.max(-1,Math.min(1,(x/W)*2-1));
  o.connect(g);g.connect(pan);pan.connect(masterGain);
  o.start(now);o.stop(now+0.14);
}

function playSwipeHit(x){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;

  pan.pan.value=Math.max(-1,Math.min(1,(x/W)*2-1));

  f.type='highpass'; f.frequency.value=400;

// ── Epic celestial horn (welcome screen) ──
function playCelestialHorn(){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;

  // Layer 1: Deep brass foundation — sawtooth through resonant filter
  const horn1=audioCtx.createOscillator(), g1=audioCtx.createGain(), f1=audioCtx.createBiquadFilter();
  horn1.type='sawtooth';
  horn1.frequency.setValueAtTime(110,now); // A2
  horn1.frequency.linearRampToValueAtTime(146.83,now+0.6); // D3 — rising fifth
  horn1.frequency.setValueAtTime(146.83,now+0.6);
  horn1.frequency.linearRampToValueAtTime(220,now+1.8); // A3 — octave resolve
  f1.type='lowpass'; f1.frequency.setValueAtTime(300,now);
  f1.frequency.linearRampToValueAtTime(900,now+1.0);
  f1.frequency.linearRampToValueAtTime(500,now+3.0); f1.Q.value=3;
  g1.gain.setValueAtTime(0,now);
  g1.gain.linearRampToValueAtTime(0.12,now+0.3);
  g1.gain.setValueAtTime(0.12,now+2.0);
  g1.gain.linearRampToValueAtTime(0.08,now+3.0);
  g1.gain.exponentialRampToValueAtTime(0.001,now+4.5);
  horn1.connect(f1); f1.connect(g1); g1.connect(masterGain);
  horn1.start(now); horn1.stop(now+4.6);

  // Layer 2: Octave above — power
  const horn2=audioCtx.createOscillator(), g2=audioCtx.createGain(), f2=audioCtx.createBiquadFilter();
  horn2.type='sawtooth';
  horn2.frequency.setValueAtTime(220,now+0.15);

// Levels past 10 (paid) extrapolate the curve and never stop climbing.
function levelConfig(level){
  if(level<=LEVELS.length)return LEVELS[level-1];
  const k=level-LEVELS.length, base=LEVELS[LEVELS.length-1];
  return {
    spawn:Math.max(2.6,base.spawn-k*0.04),
    bMin:2,bMax:2+Math.min(1,Math.floor(k/18)),
    cap:Math.min(18,base.cap+k),
    hits:Math.min(9,base.hits+Math.floor(k/12)),
    grow:Math.min(0.130,base.grow+k*0.0022),
    maxR:Math.min(0.66,base.maxR+k*0.008),
    // Rounds stay short: under a minute always, capped at 45s. Pressure comes
    // from the curve, not from endurance.
    dur:Math.min(45,base.dur-2+k*0.7),
    loss:Math.max(0.30,base.loss-k*0.006),
    drift:1.00,split:Math.min(0.85,base.split+k*0.012),
  };
}
